    starting_room: geonosis_hive_main_chamber
    prerequisites:
      - chargen_complete
    duration_minutes: 40
    locked: false
    kind: questline

    graduation:
      credits: 500
      faction_rep:
        republic: 3
      items: []
      achievements: ["power_run_ion"]
      drop_room: geonosis_hive_main_chamber
      follow_up_hint: >
        Chief Petty Officer Dax will sign off on the Mil-Spec Ion Engine
        Core. With the Republic honored (rep 50+) you can `learn` it —
        `talk` to begin, then bring q75+ deep-dune iron and craft.

    steps:
      - step: 1
        title: "The Powerplant Chief"
        location: geonosis_hive_main_chamber
        npc: "Chief Dax Orrin"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Report to Chief Dax Orrin in the hive chamber."
        npc_intro: >
          "Mil-spec ion core, eh? That's a powerplant secret, not a parts
          list. We hold this chamber because the salvaged CIS reactor in
          it is worth more than the position. You want the core spec, you
          help me tame it. `examine` the reactor housing first — tell me
          what we're working with."
        completion:
          type: talk_to_npc
          npc: "Chief Dax Orrin"
        npc_complete: >
          "Reactor's against the far wall. `examine` the housing — careful,
          it's salvage, not spec. Then we tune."
        reward:
          faction_rep:
            republic: 2
        next_hint: "Inspect the reactor — `examine` the housing."

      - step: 2
        title: "Salvaged Power"
        location: geonosis_hive_main_chamber
        npc: "Chief Dax Orrin"
        npc_role: instructor
        teaches: ["examine"]
        objective: "Examine the salvaged CIS reactor housing."
        npc_intro: >
          "`examine` the housing. You can't tune a powerplant you don't
          understand — and CIS salvage doesn't read like Republic kit."
        completion:
          type: command_executed
          command: "examine"
        npc_complete: >
          "Now you see the problem — the regulator's fighting the core.
          Tuning it by hand is the test. `chain attempt` — that's a
          `space transports repair` job, and the margins are tight."
        reward:
          faction_rep:
            republic: 2
        next_hint: "Tune the powerplant by hand — `chain attempt`."

      - step: 3
        title: "Tuning by Hand"
        location: geonosis_hive_main_chamber
        npc: "Chief Dax Orrin"
        npc_role: instructor
        teaches: ["repair"]
        objective: "Hand-tune the salvaged ion powerplant."
        npc_intro: >
          [The regulator hums wrong, power surging against the core's
          limits. Tune it live or it cooks.] "Easy," Dax murmurs.
          "`chain attempt` — `space transports repair`, and feel the
          margin."
        completion:
          type: skill_check_passed
          skill: "space_transports_repair"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [The powerplant settles into a clean, deep hum — mil-spec
          steady. But a full reactor draw rings through the hive, and the
          Geonosians who built this place come to reclaim it.]
        reward:
          faction_rep:
            republic: 3
        next_hint: "Geonosian warriors converge. Defend the chamber."

      - step: 4
        title: "Reclaimers"
        location: geonosis_warrior_barracks
        npc: "(none)"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Defeat the Geonosian warrior."
        npc_intro: >
          [A Geonosian drone-warrior drops from a barracks tunnel, sonic
          pike leveled, hive-furious that off-worlders woke its reactor.
          `attack`, `dodge` the pike.]
        completion:
          type: combat_won
          enemy_template: "geonosis_drone_warrior"
          enemy_count: 1
        npc_complete: >
          [The warrior falls; the chamber holds. The powerplant still
          hums clean behind you — and Dax has his proof.]
        reward:
          credits: 200
          faction_rep:
            republic: 4
        next_hint: "Report back to Chief Dax."

      - step: 5
        title: "Powerplant-Certified"
        location: geonosis_hive_main_chamber
        npc: "Chief Dax Orrin"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Report your tuning run to Chief Dax."
        npc_intro: >
          "Tuned by hand, held the chamber, and that core's still singing
          mil-spec. That's the run. Not many finish it."
        completion:
          type: talk_to_npc
          npc: "Chief Dax Orrin"
        npc_complete: >
          "I'll sign you for the ion-core spec. Come back when the
          Republic trusts you proper, with deep-dune iron worth the
          build. Good run, engineer."
        reward:
          faction_rep:
            republic: 3
        next_hint: >
          Trial complete. `talk` to Chief Dax to learn the Mil-Spec Ion
          Engine Core (Republic rep 50+ required).

  # ─── Q5. MASTER ARMORER — "The Warrens Forge" → t5 armor ─────────────
  - chain_id: master_armorer_armor
    chain_name: "The Warrens Forge"
    description: >
      An independent master armorer who works a hidden forge in the Nar
      Shaddaa Warrens will teach the crafting of master-grade armor — to
      one who can scavenge the right composite, prove the plate against a
      real edge, and survive what the Warrens send. Rich, dangerous,
      end-game.
    archetype_label: "Master-Grade Armor Trial"
    faction_alignment: independent
    starting_zone: nar_shaddaa_warrens
    starting_room: warrens_scavenger_den
    prerequisites:
      - chargen_complete
    duration_minutes: 40
    locked: false
    kind: questline

    graduation:
      credits: 500
      faction_rep:
        independent: 3
      items: []
      achievements: ["warrens_forge"]
      drop_room: warrens_scavenger_den
      follow_up_hint: >
        Sabra will teach Master-Grade Armor. With the independents
        honored (rep 50+) you can `learn` it — `talk` to begin, then
        bring q75+ composite chitin and craft.

    steps:
      - step: 1
        title: "The Armorer of the Warrens"
        location: warrens_scavenger_den
        npc: "Sabra the Smith"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Find Sabra the Smith in the scavenger den."
        npc_intro: >
          "Master-grade plate. You came to the right hole in the ground —
          and the most dangerous one. I don't sell the spec; I teach it to
          people who can WORK. The Warrens are full of good composite if
          you know where to dig. `search` the den — find me a chitin
          plate worth forging."
        completion:
          type: talk_to_npc
          npc: "Sabra the Smith"
        npc_complete: >
          "Go dig. `search` the scavenger den. The good chitin's buried
          under the junk — most folk walk right past it."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Scavenge composite — `search` the scavenger den."

      - step: 2
        title: "Good Composite"
        location: warrens_scavenger_den
        npc: "Sabra the Smith"
        npc_role: instructor
        teaches: ["search"]
        objective: "Search the scavenger den for composite chitin."
        npc_intro: >
          "`search`. Chitin plate, not scrap — you'll know it by the
          weight. The Warrens don't give up the good stuff easy."
        completion:
          type: command_executed
          command: "search"
        npc_complete: >
          "That's the one. Heavy, clean. Now — plate's no good if it
          can't take an edge. There's a test rig in the fungal cavern.
          Prove the chitin holds: `chain attempt`, armor work, by hand."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Prove the plate in the fungal cavern — `chain attempt`."

      - step: 3
        title: "Proving the Plate"
        location: warrens_fungal_cavern
        npc: "(none)"
        npc_role: contact
        teaches: ["repair"]
        objective: "Work the chitin plate against the test rig."
        npc_intro: >
          [The test rig is a brutal old thing — a powered edge that bites
          armor to grade it. Set the plate, work it true.] "By hand,"
          Sabra had said. "`chain attempt` — `armor repair`, and feel
          where it wants to fail."
        completion:
          type: skill_check_passed
          skill: "armor_repair"
          difficulty: 10
          on_fail: "retry_allowed"
        npc_complete: >
          [The plate takes the edge and holds — master-grade. But the
          rig's noise carries in the Warrens, and a fungal-cavern stalker
          that hunts by sound comes for you.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "A stalker hunts the noise. Defend yourself."

      - step: 4
        title: "What the Warrens Send"
        location: warrens_collapsed_plaza
        npc: "(none)"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Defeat the Warrens stalker."
        npc_intro: >
          [It drives you into the collapsed plaza — a pale, many-legged
          Warrens predator, all hooks and silence. `attack` it, `dodge`
          its lunges. Your new plate earns its first scars here.]
        completion:
          type: combat_won
          enemy_template: "warrens_stalker"
          enemy_count: 1
        npc_complete: >
          [The stalker shrieks and folds. The plaza goes still. The plate
          held — and so did you. Back to the forge.]
        reward:
          credits: 200
          faction_rep:
            independent: 4
        next_hint: "Return to Sabra at the scavenger den."

      - step: 5
        title: "Forge-Proven"
        location: warrens_scavenger_den
        npc: "Sabra the Smith"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Sabra to finish the trial."
        npc_intro: >
          "Scavenged it, proved it, wore it against a stalker, and walked
          back to my forge. That's the trial. The Warrens keep the rest."
        completion:
          type: talk_to_npc
          npc: "Sabra the Smith"
        npc_complete: >
          "I'll teach you master-grade plate. Come back when the
          independents trust you proper, with chitin worth the forge. Now
          get out of my den — you've earned the right to come back."
        reward:
          faction_rep:
            independent: 3
        next_hint: >
          Trial complete. `talk` to Sabra to learn Master-Grade Armor
          (independent rep 50+ required).

  # ═══════════════════════════════════════════════════════════════════════
  # GENERALIZED QUESTLINES (kind: questline) — T3.24 quest expansion
  # ═══════════════════════════════════════════════════════════════════════
  # quest_expansion_postlaunch_path_v1.md — the sanctioned right-of-launch
  # widening of the chain engine: MORE `kind: questline` chains that reuse
  # the SAME live engine (active_questline slot, the 11 existing event
  # types, the four reward funnels). NO new engine code, NO new slot, NO
  # new completion type — pure additive content, exactly the "author
  # questlines in chains.yaml" build step the design doc describes.
  #
  # These differ from the t5 master-trainer questlines above: they are
  # ACCESSIBLE (prerequisites: chargen_complete; no faction rep gate), run
  # in ordinary city rooms, do NOT unlock a t5 schematic, and pay a modest
  # reward + a lower-tier achievement (cp_reward 3 vs the t5 chains' 5).
  # They prove the generalized-quest path serves ordinary freelance
  # side-content, not just the trainer economy. Same reachability rules
  # apply (tests/test_chain_corpus_reachability_invariant.py): every
  # `location` is a REAL world-room slug; NO room_entered / item_acquired
  # completions; every command literal registered; every skill canonical;
  # every combat_won enemy_template resolves to a tagged NPC.

  # ─── G1. FREELANCE INVESTIGATION — "The Ghost Shipment" ───────────────
  - chain_id: nar_freight_ghost_shipment
    chain_name: "The Ghost Shipment"
    description: >
      A small independent freight broker on Nar Shaddaa keeps losing cargo
      between pickup and delivery, and the Guild won't help someone her
      size. Track the leak from the docks, work the market for a name, and
      run the skimmer to ground in the Undercity. A freelance favor — open
      to anyone, no faction required.
    archetype_label: "Freelance Investigation"
    faction_alignment: independent
    starting_zone: nar_shaddaa_promenade
    starting_room: burning_deck_cantina
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["ghost_shipment_solved"]
      drop_room: burning_deck_cantina
      follow_up_hint: >
        Yelza will remember this. Independent brokers across the Corellian
        Sector talk — freelance work tends to find those who finish it.

    steps:
      - step: 1
        title: "The Broker's Problem"
        location: burning_deck_cantina
        npc: "Yelza Korrin"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Yelza Korrin in the Burning Deck Cantina."
        npc_intro: >
          "You look like you can keep your mouth shut and your eyes open.
          Good — that's the job. I'm Yelza, I run freight, and three of my
          last runs vanished clean between pickup and delivery. The Guild
          won't touch it. I'll pay a fair cut to whoever finds out where my
          cargo's going. Start at the docks — Bay Aurek's where my last run
          loaded. `search` it for anything that doesn't add up."
        completion:
          type: talk_to_npc
          npc: "Yelza Korrin"
        npc_complete: >
          "Bay Aurek. Today. Walk the loading floor and `search` it — a
          manifest doesn't just evaporate. Somebody moved it, and people
          who move cargo leave a trail if you know how to look."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Head to Bay Aurek and `search` the loading floor for the cargo trail."

      - step: 2
        title: "The Trail at the Docks"
        location: nar_shaddaa_bay_aurek
        npc: "(none)"
        npc_role: contact
        teaches: ["search"]
        objective: "Search Docking Bay Aurek for the diverted-cargo trail."
        npc_intro: >
          [The loading floor is a churn of crates, droids, and shouting
          stevedores.] Somewhere in this mess is the seam where Yelza's
          cargo slipped sideways. `search` the bay — check the manifests,
          the re-tag stickers, the bays nobody's watching.
        completion:
          type: skill_check_passed
          skill: "search"
          difficulty: 9
          on_fail: "retry_allowed"
        npc_complete: >
          [There — a stack of crates with fresh re-tag stickers slapped
          over Yelza's outfit codes, routed to a buyer in the Undercity.
          Someone here is selling her pickup windows. You'll need a name,
          and the Floating Market is where dock gossip gets sold.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "The trail leads to the Floating Market. Work it for a name — `chain attempt`."

      - step: 3
        title: "A Name on the Market"
        location: floating_market
        npc: "(none)"
        npc_role: contact
        teaches: ["streetwise"]
        objective: "Work the Floating Market for the skimmer's name (streetwise)."
        npc_intro: >
          [The Floating Market drifts between the towers, a churn of vendors,
          fixers, and people who hear everything for the right price.] Re-tag
          work and stolen manifests get fenced somewhere. Use your
          `streetwise` — buy a drink, drop the right name, listen.
        completion:
          type: skill_check_passed
          skill: "streetwise"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [A nervous fixer, two drinks in, gives it up: Brakkis Vone — a
          small-time crew boss skimming cargo through a dead transfer point
          in the Undercity Depths, with a bought dock clerk feeding him
          windows. He kills witnesses. He won't expect one to come to him.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "Brakkis Vone runs his operation in the Undercity Depths. Go confront him."

      - step: 4
        title: "The Transfer Point"
        location: undercity_depths
        npc: "Brakkis Vone"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Confront Brakkis Vone and recover the truth — `attack`, `dodge`."
        npc_intro: >
          [The transfer point is a forgotten Undercity bay stacked with
          re-tagged crates — Yelza's codes among them. Brakkis Vone looks up
          from a manifest, reads the trail on your face, and reaches for his
          blaster.] "You followed the wrong manifest down here, snoop."
        completion:
          type: combat_won
          enemy_template: "nar_ghost_shipment_pirate"
          enemy_count: 1
        npc_complete: >
          [Vone goes down hard among the stolen crates. On his datapad: the
          bought dock clerk's name, the buyer, the whole skimming route —
          everything Yelza needs to shut it down and clear her manifests.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "You have the proof. Return to Yelza at the Burning Deck Cantina."

      - step: 5
        title: "Squaring the Account"
        location: burning_deck_cantina
        npc: "Yelza Korrin"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Yelza Korrin to close the job."
        npc_intro: >
          "You came back. With a name, a route, and a datapad full of proof.
          Figures it was Vone — and a clerk on my own dock." [She lets out a
          long breath, some of the weight off her shoulders.] "That's my
          cargo back and my route clean. Here's your cut, and then some."
        completion:
          type: talk_to_npc
          npc: "Yelza Korrin"
        npc_complete: >
          "Square. You did honest work for an honest broker — that's rarer
          than it should be out here. Anyone gives you grief about freelance,
          you tell them Yelza Korrin vouches for you. Fly safe."
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The Ghost Shipment is solved. Yelza's good word travels — freelance
          work finds those who finish it.

  # ─── G2. FREELANCE INVESTIGATION — "The Crooked Wheel" ────────────────
  # T3.24 next slice (2026-06-25). The SECOND accessible kind:questline
  # chain, set on Tatooine/Mos Eisley (vs the Ghost Shipment's Nar Shaddaa)
  # and exercising a DIFFERENT skill spread (investigation + gambling).
  # Reuses the live questline engine with NO new engine code/slot/event type.
  - chain_id: mos_eisley_crooked_wheel
    chain_name: "The Crooked Wheel"
    description: >
      A loan operation locals call "the Wheel" runs a rigged sabacc table out
      of Chalmun's Cantina, traps marks in spiralling debt, then collects with
      muscle. A small Mos Eisley vendor's runner got caught, and now the
      Wheel's smiling enforcer is squeezing her stall. Read the racket on the
      market floor, sit the crooked table to expose it, and run the collector
      to ground in the desert. A freelance favor — open to anyone, no faction
      required.
    archetype_label: "Freelance Investigation"
    faction_alignment: independent
    starting_zone: tatooine_market
    starting_room: market_place_geps_grill
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["crooked_wheel_busted"]
      drop_room: market_place_geps_grill
      follow_up_hint: >
        Dorae will remember this. Word on the Mos Eisley market floor travels
        fast — freelance work tends to find those who finish it.

    steps:
      - step: 1
        title: "The Vendor's Account"
        location: market_place_geps_grill
        npc: "Dorae Vint"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Dorae Vint at Gep's Grill in the Mos Eisley market."
        npc_intro: >
          "You look like you can read a room and keep your mouth shut. Good —
          that's the job. I'm Dorae, I run a salvage stall two rows over. My
          runner sat a sabacc game he couldn't win, the debt tripled overnight,
          and now the Wheel's collector keeps drifting past my stand, smiling,
          asking when I'll 'settle the account.' A game you can't win isn't a
          game — it's a harvest. Walk the market and watch who the Wheel leans
          on. `investigate` the pattern."
        completion:
          type: talk_to_npc
          npc: "Dorae Vint"
        npc_complete: >
          "Start on the market floor. The Wheel doesn't squeeze everyone — just
          the ones who can't fight back. Watch who the collector visits and
          which stalls go quiet. `investigate` the pattern; debts that move in
          lockstep aren't bad luck, they're a system."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Walk the Market District and `investigate` who the Wheel is squeezing."

      - step: 2
        title: "Reading the Racket"
        location: mos_eisley_market_district
        npc: "(none)"
        npc_role: contact
        teaches: ["investigate"]
        objective: "Investigate the Market District for the Wheel's collection pattern."
        npc_intro: >
          [The Market District is a churn of stalls, hagglers, and the dry rasp
          of the desert wind.] Somewhere in the rhythm of who pays and who goes
          quiet is the shape of the racket. `investigate` the floor — track the
          collector's circuit, the stalls behind on a 'debt', the marks who sat
          the table and never recovered.
        completion:
          type: skill_check_passed
          skill: "investigation"
          difficulty: 10
          on_fail: "retry_allowed"
        npc_complete: >
          [The pattern resolves: every squeezed vendor lost a stake at the same
          sabacc table in Chalmun's back corner, and every debt grew on the
          same impossible curve. The game is the trap. To prove it's rigged
          you'll have to sit the table yourself — and read it from the inside.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "The trap is a sabacc table in Chalmun's Cantina. Sit it and read the game — `chain attempt`."

      - step: 3
        title: "Reading the Table"
        location: chalmuans_cantina_main_bar
        npc: "(none)"
        npc_role: contact
        teaches: ["gambling"]
        objective: "Sit the Wheel's sabacc table and read the rig (gambling)."
        npc_intro: >
          [The Wheel's table sits in a quiet corner of Chalmun's, a smiling
          dealer and a pot that always seems to lean one way.] You don't have
          to win — you have to *read* it. Use your `gambling` eye: watch the
          deal, the shaved chits, the tell in the dealer's hands. Catch the rig
          and you have your proof — and a name.
        completion:
          type: skill_check_passed
          skill: "gambling"
          difficulty: 12
          on_fail: "retry_allowed"
        npc_complete: >
          [There it is — a marked deck and a dealer feeding the house every
          stubborn hand. The dealer, two losses deep into his own debt, gives
          up the collector: Gorvahn Brusk, who walks the stubborn debtors out
          to an abandoned farm past the eastern gate to 'talk it over.' He
          won't expect one of them to come looking.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "Gorvahn Brusk runs his collections from the abandoned farm past the eastern gate. Go confront him."

      - step: 4
        title: "Settling the Account"
        location: outskirts_abandoned_farm
        npc: "Gorvahn Brusk"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Confront Gorvahn Brusk and end the Wheel's collection — `attack`, `dodge`."
        npc_intro: >
          [The abandoned moisture farm is a ring of dead vaporators and drifting
          sand, the Wheel's quiet room for stubborn accounts. Gorvahn Brusk
          looks up from a stack of re-tagged sabacc chits, reads the trail on
          your face, and his smile finally drops.] "You traced the table all
          the way out here, friend? That's a problem."
        completion:
          type: combat_won
          enemy_template: "mos_eisley_crooked_wheel_enforcer"
          enemy_count: 1
        npc_complete: >
          [Brusk goes down among the dead vaporators. On him: the marked deck,
          the doctored debt-ledger, and the names of every mark the Wheel was
          bleeding — everything Dorae needs to break the debts and put the
          collector off the market for good.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "You have the proof and the ledger. Return to Dorae at Gep's Grill."

      - step: 5
        title: "Squaring the Stall"
        location: market_place_geps_grill
        npc: "Dorae Vint"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Dorae Vint to close the job."
        npc_intro: >
          "You came back. With a marked deck, a doctored ledger, and Brusk's
          whole collection list." [She lets out a long breath, some of the
          weight off her shoulders.] "That's my runner's debt broken and the
          collector off my stall. Figures the game was rigged from the deal.
          Here's your cut, and then some."
        completion:
          type: talk_to_npc
          npc: "Dorae Vint"
        npc_complete: >
          "Square. You did honest work for an honest stall — that's rarer than
          it should be out here. Anyone leans on you about freelance, you tell
          them Dorae Vint vouches for you. Walk easy."
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The Crooked Wheel is broken. Dorae's good word travels the market
          floor — freelance work finds those who finish it.

  # T3.24 third slice (2026-06-25). The THIRD accessible kind:questline
  # chain, set on Coruscant's lower city (vs Nar Shaddaa / Tatooine) and
  # exercising a THIRD distinct skill spread (persuasion + sneak). A
  # rescue/recovery story shape, not a racket-bust. Reuses the live
  # questline engine with NO new engine code/slot/event type.
  - chain_id: coruscant_lower_lost_courier
    chain_name: "The Lost Courier"
    description: >
      A lower-city fixer's young courier vanished two days ago carrying a
      client's data-spike into the Southern Underground and never came back.
      The warren that saw the grab is too scared to talk, the trail runs
      through a sealed bolt-hole in the Petrax sublevels, and a Trandoshan
      enforcer is holding the kid in the Factory District until a buyer
      collects. Talk the warren open, slip the bolt-hole, and get the courier
      back. A freelance favor — open to anyone, no faction required.
    archetype_label: "Freelance Recovery"
    faction_alignment: independent
    starting_zone: southern_underground
    starting_room: crystal_jewel_cantina
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["lost_courier_found"]
      drop_room: crystal_jewel_cantina
      follow_up_hint: >
        Sashi Renko keeps her word, and word travels the lower city fast. A
        fixer who vouches for you is worth more than the cut — freelance work
        finds those who finish it.

    steps:
      - step: 1
        title: "The Fixer's Booth"
        location: crystal_jewel_cantina
        npc: "Sashi Renko"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Sashi Renko in her booth at the Crystal Jewel Cantina."
        npc_intro: >
          "You look like you can keep your mouth shut and your eyes open. Good —
          that's the job. I'm Sashi, I match jobs to hands down here. Two days
          ago I put a kid named Tav on a simple data-run and he never came back.
          My contacts have all gone suddenly deaf about it. Somebody grabbed him,
          and the whole warren near his last stop is too scared to say what they
          saw. Go down there and `talk` them open — the truth's in that warren if
          you can pry it loose."
        completion:
          type: talk_to_npc
          npc: "Sashi Renko"
        npc_complete: >
          "Start at the Refugee Warren — that was Tav's last stop before he went
          dark. They saw the grab, I'd bet my booth on it. They won't volunteer
          it, though; you'll have to `persuade` someone to talk. Be gentle. Half
          of them are one bad week from being grabbed themselves."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Lower City Refugee Warren and `persuade` a witness to talk — `chain attempt`."

      - step: 2
        title: "The Warren That Forgot"
        location: lower_refugee_warren
        npc: "(none)"
        npc_role: contact
        teaches: ["persuasion"]
        objective: "Persuade a frightened witness in the Refugee Warren to talk."
        npc_intro: >
          [The Refugee Warren is a low maze of curtained alcoves and watchful
          eyes; everyone here saw something and no one will be the one who said
          it.] Somebody watched the kid get taken. Find them, read the fear, and
          `persuade` them it's safer to talk to you than to keep carrying it —
          use `chain attempt` to make the case.
        completion:
          type: skill_check_passed
          skill: "persuasion"
          difficulty: 10
          on_fail: "retry_allowed"
        npc_complete: >
          [An old spacer with shaking hands finally lets it out: a Trandoshan
          dragged the kid toward the old Petrax sublevels two nights back, into a
          maintenance hatch the locals know to stay clear of. "Sealed bolt-hole,"
          she whispers. "Watched. Don't go loud or you'll join him."]
        reward:
          faction_rep:
            independent: 2
        next_hint: "The trail runs to a watched bolt-hole in the Petrax sublevels. Slip it quietly — `sneak`, `chain attempt`."

      - step: 3
        title: "The Bolt-Hole"
        location: petrax_sublevels
        npc: "(none)"
        npc_role: contact
        teaches: ["sneak"]
        objective: "Sneak past the lookout into the Petrax sublevels bolt-hole."
        npc_intro: >
          [The Petrax sublevels are black and dripping, and a lookout sits where
          the only passage narrows — go loud and the kid pays for it.] You don't
          have to fight your way in; you have to *not be seen*. Use your `sneak` —
          time the lookout, take the dead ground, slip the bolt-hole — and find
          where they're holding Tav. `chain attempt` when you make your move.
        completion:
          type: skill_check_passed
          skill: "sneak"
          difficulty: 12
          on_fail: "retry_allowed"
        npc_complete: >
          [Past the lookout, the cell is empty — but a fresh scuff of drag-marks
          and a dropped courier's tag tell the story: they moved him at
          shift-change, up to a stripped holding cell in the Factory District,
          waiting on a buyer. He's alive. He won't stay that way once the
          hand-off happens.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "Tav's been moved to a holding cell in the Factory District. Get there before the buyer does."

      - step: 4
        title: "The Holding Cell"
        location: factory_district
        npc: "Skarn Vex"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Confront Skarn Vex in the Factory District and free the courier — `attack`, `dodge`."
        npc_intro: >
          [The Factory District's dead conveyor lines swallow every sound, which
          is exactly why the grab job ends here. Tav is chained to a stanchion,
          bruised but whole. Skarn Vex pushes off the line, reads the whole trail
          on your face, and the lazy menace finally sharpens.] "You traced the
          kid all the way down here, soft-skin? Now I have to keep two of you
          quiet."
        completion:
          type: combat_won
          enemy_template: "coruscant_lost_courier_enforcer"
          enemy_count: 1
        npc_complete: >
          [Skarn Vex goes down against the dead conveyor. The cell key and the
          recovered data-spike are on his harness; Tav, shaking the chains off,
          can barely get the thanks out. The buyer is going to arrive to an empty
          cell and a dead enforcer — and no merchandise.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "Tav's free and the spike's recovered. Walk him back up to Sashi at the Crystal Jewel."

      - step: 5
        title: "Squaring the Job"
        location: crystal_jewel_cantina
        npc: "Sashi Renko"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Sashi Renko to close the job."
        npc_intro: >
          "You walked him right back in the door." [Sashi turns the data-pad
          face-up for the first time in two days, some of the stillness going out
          of her shoulders.] "Spike recovered, kid breathing, and a freelance
          enforcer down a job. That's the cleanest run anybody's done me in a
          long while. Here's your cut, and then some."
        completion:
          type: talk_to_npc
          npc: "Sashi Renko"
        npc_complete: >
          "Square. You did honest work and you brought a kid home — that buys you
          my word on the lower-city floor, which down here is worth more than the
          credits. Anyone leans on you about freelance, you tell them Sashi Renko
          vouches. Walk easy."
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The Lost Courier is home. Sashi's good word travels the Southern
          Underground — freelance work finds those who finish it.

  # ─────────────────────────────────────────────────────────────────────
  # GENERALIZED QUESTLINE — "The Skimmed Line" (T3.24 fourth slice, Jun 26 2026)
  # The FOURTH accessible (non-t5, non-tutorial) kind: questline chain, after
  # The Ghost Shipment (Nar Shaddaa), The Crooked Wheel (Tatooine/Mos Eisley),
  # and The Lost Courier (Coruscant lower city). Set on KUAT (the Kuat Drive
  # Yards orbital ring) so the four accessible questlines span four planets, and
  # exercises a FOURTH distinct skill spread — SECURITY + BARGAIN — as a
  # clear-the-innocent industrial theft. Reuses the live questline engine with
  # NO new engine code/slot/event type. NPCs back it in
  # data/worlds/clone_wars/npcs_drop_generalized_questline_skimmed_line.yaml.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: kuat_ring_skimmed_line
    chain_name: "The Skimmed Line"
    description: >
      A restricted navigation-core blank was skimmed off a feeder line on the
      Kuat Drive Yards ring, and Kuat Security Force is about to write it up
      against the honest floor crew that fitted it — cheaper than a real probe,
      and it costs the whole crew their berths. The foreman knows his people are
      clean: the shift badge log was scrubbed, but a maintenance subsystem keeps
      a shadow copy, and an off-ring fixer has been buying skimmed KDY parts to
      order. Slice the shadow log, buy the buyer's name off a warehouse fence,
      and take the core back before it ships out. A freelance favor — open to
      anyone, no faction required.
    archetype_label: "Freelance Recovery"
    faction_alignment: independent
    starting_zone: kdy_orbital_ring
    starting_room: kuat_ring_cantina
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["skimmed_line_cleared"]
      drop_room: kuat_ring_cantina
      follow_up_hint: >
        Dav Nuro pays his berth-bonus and means the thanks. A foreman who keeps
        his crew on the ring remembers who kept them there — honest work on the
        yards finds those who finish it.

    steps:
      - step: 1
        title: "The Foreman's Booth"
        location: kuat_ring_cantina
        npc: "Dav Nuro"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Dav Nuro in the back booth of the Pressure Drop Cantina."
        npc_intro: >
          "You look like you can read a system and keep your mouth shut. Good —
          that's the job. Dav Nuro, line-foreman, twenty years fitting cores on
          this ring. Two days ago a restricted core blank walked off my feeder
          line and the shift badge log came up scrubbed. Now KSF wants to write
          the theft against my crew, because that's cheaper than finding who
          really took it. My people are clean. I can't prove it and I can't fight
          the company — but the truth's still in the yard's systems if somebody
          who knows how can `talk` to me about where to dig."
        completion:
          type: talk_to_npc
          npc: "Dav Nuro"
        npc_complete: >
          "The official log's gone, but the machine shops run a maintenance
          subsystem that keeps its own shadow copy of who badged the floor — KSF
          never bothers with it. Get into that subsystem and pull the dead-shift
          badges; you'll have to `slice` it, the access is locked. Prove an
          outsider was on my floor and the write-up's got nothing to stand on."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Machine Shops and use your `security` skill to slice the maintenance subsystem's shadow log — `chain attempt`."

      - step: 2
        title: "The Scrubbed Shift"
        location: kuat_ring_machine_shops
        npc: "(none)"
        npc_role: contact
        teaches: ["security"]
        objective: "Slice the machine-shop maintenance subsystem to recover the scrubbed shift log."
        npc_intro: >
          [The Machine Shops never fully stop; a maintenance subsystem hums in a
          locked alcove off the floor, logging every badge that ever crossed it.]
          The official shift log was wiped, but this subsystem kept its own copy —
          and it's locked. Work the `security` panel, get past the access lock,
          and pull the dead-shift badges. `chain attempt` when you make your run
          at it.
        completion:
          type: skill_check_passed
          skill: "security"
          difficulty: 10
          on_fail: "retry_allowed"
        npc_complete: >
          [The lock gives, and the shadow log scrolls up clean: every one of Dav's
          crew badged out before the core went missing — and one badge that
          isn't on any crew roster crossed the floor during the dead shift, a
          contractor credential that pings back to an off-ring "acquisitions"
          handle. Somebody bought their way onto the floor. The crew is clean.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "An off-ring fixer bought their way onto the floor. A parts-fence in the Warehouse District knows who buys skimmed KDY parts — `bargain` it out of them, `chain attempt`."

      - step: 3
        title: "The Fence's Price"
        location: kuat_ring_warehouses
        npc: "(none)"
        npc_role: contact
        teaches: ["bargain"]
        objective: "Bargain a parts-fence in the Warehouse District into naming the buyer and the handoff."
        npc_intro: >
          [The Warehouse District has a gray-market corner where ring parts that
          fell off a manifest change hands quietly. The fence here knows who's
          buying skimmed Kuat cores — and won't give it up for nothing.] Don't
          threaten them; the floor would close around you. Read the trade, make
          the `bargain`, and buy the buyer's name and where the handoff's going
          down. `chain attempt` when you put your price on the table.
        completion:
          type: skill_check_passed
          skill: "bargain"
          difficulty: 12
          on_fail: "retry_allowed"
        npc_complete: >
          [The fence weighs your offer, decides the credits beat the risk, and
          gives it up low and fast: the buyer is a fixer named Suro Vant, the
          core blank's already crated, and the handoff to an off-ring freighter
          runs through the ring Factories at the next shift change. "He'll have
          it on him," the fence murmurs. "And he doesn't like being found."]
        reward:
          faction_rep:
            independent: 3
        next_hint: "Suro Vant is moving the core through the Factories at shift change. Get there and take it back before it ships off-ring."

      - step: 4
        title: "The Handoff"
        location: kuat_ring_factories
        npc: "Suro Vant"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Confront Suro Vant in the Factories and recover the skimmed core — `attack`, `dodge`."
        npc_intro: >
          [The ring Factories run loud enough to bury a handoff, which is exactly
          why it ends here. The crated core blank sits at Suro Vant's boot; he
          pushes off a cold press-line, reads the whole trail on your face — the
          shadow log, the fence, all of it — and the bored patience finally goes
          out of his tusked face.] "You traced a core blank all the way to my
          floor, fitter? That's a careless thing to be good at."
        completion:
          type: combat_won
          enemy_template: "kuat_skimmed_line_collector"
          enemy_count: 1
        npc_complete: >
          [Suro Vant goes down against the press-line, and the case pops open on
          the restricted core blank, KDY seals intact. The off-ring freighter is
          going to dock to an empty handoff and a dead fixer — and no merchandise.
          The contractor credential on Vant's pad is the last thing the write-up
          needed to fall apart. Take it all back to Dav.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "Core recovered, fixer down, outsider's credential in hand. Walk it back to Dav at the Pressure Drop."

      - step: 5
        title: "Clearing the Crew"
        location: kuat_ring_cantina
        npc: "Dav Nuro"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Dav Nuro to close the job and clear his crew."
        npc_intro: >
          "You walked the core right back onto the ring." [Dav turns the
          data-pad face-up for the first time in two days, the dead-shift log and
          the outsider's credential laid out where KSF can't pretend not to see
          them, and some of the weight goes off his shoulders.] "Shadow log,
          recovered core, an outsider's badge on my floor. That's a write-up that
          doesn't land. Here's your cut out of my berth-bonus, and then some."
        completion:
          type: talk_to_npc
          npc: "Dav Nuro"
        npc_complete: >
          "Square. You pulled the truth out of the systems and you kept twelve
          honest people on the ring — that buys you my word on this yard, which up
          here is worth more than the credits. Anyone questions your work on the
          Kuat lines, you tell them Dav Nuro vouches. Fly safe."
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The crew keeps their berths and the yard keeps turning. Dav Nuro's
          good word travels the Kuat ring — honest work finds those who finish it.

  # ─────────────────────────────────────────────────────────────────────
  # GENERALIZED QUESTLINE — "The Dust-Sick" (T3.24 fifth slice, Jun 26 2026)
  # The FIFTH accessible (non-t5, non-tutorial) kind: questline chain, after
  # The Ghost Shipment (Nar Shaddaa), The Crooked Wheel (Tatooine/Mos Eisley),
  # The Lost Courier (Coruscant lower city), and The Skimmed Line (Kuat ring).
  # FIRST questline set in the WILDERNESS (the Tatooine deep desert — the City
  # Outskirts scavenger market and the Jundland Wastes — not a city interior),
  # and exercises a FIFTH distinct skill spread — FIRST_AID + SURVIVAL — as a
  # save-the-stricken frontier rescue. Reuses the live questline engine with NO
  # new engine code/slot/event type, and touches NO map coordinate or exit graph
  # (the desert rooms already exist + are loaded). NPCs back it in
  # data/worlds/clone_wars/npcs_drop_generalized_questline_dust_sick.yaml.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: jundland_dust_sick
    chain_name: "The Dust-Sick"
    description: >
      A homesteader's grown son chased a salvage lead into the Jundland Wastes
      and came back word that he is down — fevered, out of good water, "dust-sick"
      and too weak to walk out of the cave he sheltered in — while desert
      scavengers circle his dead speeder waiting for the desert to finish him.
      His mother can't carry him out alone and no one in the market will go for a
      homesteader's credits. Reach the boy and stabilize him, read the rising sand
      to chart a way home across the dunes, and get past the scavenger band before
      the Wastes keep him. A frontier favor — open to anyone, no faction required.
    archetype_label: "Frontier Rescue"
    faction_alignment: independent
    starting_zone: tatooine_outskirts
    starting_room: outskirts_scavenger_market
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["dust_sick_recovered"]
      drop_room: outskirts_scavenger_market
      follow_up_hint: >
        Soree Bann pays her water-credits and means the thanks. A homesteader
        whose son walked home out of the Wastes remembers who carried him — the
        far claims and the caravan trails carry a good word a long way out here.

    steps:
      - step: 1
        title: "The Far Claim's Mother"
        location: outskirts_scavenger_market
        npc: "Soree Bann"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Soree Bann at the City Outskirts scavenger market."
        npc_intro: >
          "You've got the look of someone the desert hasn't beaten yet. Good —
          I need that. Soree Bann; my claim's out past the last marked trail. My
          boy Eddin went into the Jundland after a wreck-salvage lead four days
          back, and a Jawa caravan brought word he's down — fevered, out of good
          water, holed up in a cave too weak to walk. The scavengers that work
          that waste are already circling his speeder. I can't carry him out
          alone and nobody here will go for a homesteader's pay. `talk` to me and
          I'll tell you where he's lying and what'll keep him breathing."
        completion:
          type: talk_to_npc
          npc: "Soree Bann"
        npc_complete: >
          "He's in a hidden cave off the canyon mouth — the caravan marked it.
          Fever and bad water; he'll be slipping in and out. Don't try to move
          him first. Get him stable — water, shade, a steady hand; you'll have to
          `first aid` him on the spot before he can travel at all. Keep him
          breathing and we've got a chance to walk him home."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Jundland Wastes hidden cave and use your `first_aid` skill to stabilize the fevered boy — `chain attempt`."

      - step: 2
        title: "Dust-Sick in the Cave"
        location: jundland_hidden_cave
        npc: "(none)"
        npc_role: contact
        teaches: ["first_aid"]
        objective: "Stabilize the fevered Eddin Bann in the hidden cave with a first-aid check."
        npc_intro: >
          [The hidden cave holds a sliver of shade and a young man laid out in it,
          flushed and shaking, lips cracked, a salvage bar still clutched in one
          hand — Eddin Bann, dust-sick and slipping under.] He's alive, but the
          fever's climbing and bad water's wrung him dry; move him like this and
          the walk will kill him. Cool him, get clean water into him, steady the
          fever — `first aid`, careful and right. `chain attempt` when you work
          on him.
        completion:
          type: skill_check_passed
          skill: "first_aid"
          difficulty: 10
          on_fail: "retry_allowed"
        npc_complete: >
          [The fever breaks enough. Eddin's eyes find focus, the shaking eases,
          and the cracked lips manage a dry whisper of thanks. He can't run, but
          with an arm under him he can walk — and walking out is the only way he
          leaves this cave alive. He grips the salvage bar like it's worth the
          trip. Now you only have to get him across open desert.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "Eddin can walk now, but the straight line home crosses open dune. Get to the Dune Sea Edge and use your `survival` skill to read the rising sand and chart a way back — `chain attempt`."

      - step: 3
        title: "Reading the Sand"
        location: jundland_dune_sea_edge
        npc: "(none)"
        npc_role: contact
        teaches: ["survival"]
        objective: "Read the rising desert at the Dune Sea Edge to chart a safe line home for a man who can't run."
        npc_intro: >
          [Past the canyon the Wastes open into raw dune, and the wind has the
          gritty edge that comes before a sand rises — the straight line home is
          the one a storm erases first, and a fevered man on your shoulder can't
          outpace it.] Read the desert the way Soree would: the firm sand, the
          windbreaks, the slow safe line that keeps shade and water within reach.
          Pick the route a sick man can survive, not the short one. `survival`,
          and `chain attempt` when you commit to a line.
        completion:
          type: skill_check_passed
          skill: "survival"
          difficulty: 12
          on_fail: "retry_allowed"
        npc_complete: >
          [The desert resolves into a route: firmer footing along the windward
          dunes, two shaded hollows to rest him in, a line that bends wide of the
          open pan where the sand will run. It's longer, and it's the only one
          Eddin walks out of. You get him moving along it — and that line bends
          straight into the narrows of Beggar's Canyon, where someone is already
          waiting on the take.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "The safe line home funnels through Beggar's Canyon — and the scavenger boss Vohrek Sarn is waiting on the speeder. Get the boy through; `attack`, `dodge`."

      - step: 4
        title: "The Narrows"
        location: jundland_beggars_canyon
        npc: "Vohrek Sarn"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Get Eddin past Vohrek Sarn's scavengers in Beggar's Canyon — `attack`, `dodge`."
        npc_intro: >
          [The safe line funnels into the narrows of Beggar's Canyon, and a heavy
          red-Nikto in a trophy-strung duster steps out to fill it — Vohrek Sarn,
          who has been circling Eddin's dead speeder for two days, content to let
          the fever do his work. The take he was waiting on is walking out on a
          stranger's shoulder, and the lazy patience goes flat out of his ridged
          face.] "That speeder's mine by waiting, stranger. Put the man down and
          walk — or don't, and the desert keeps you both."
        completion:
          type: combat_won
          enemy_template: "jundland_dust_scavenger_boss"
          enemy_count: 1
        npc_complete: >
          [Vohrek Sarn goes down in the narrows and his band scatters back into
          the Wastes the way scavengers do when the easy take turns and bites.
          The canyon's clear, the line home is open, and Eddin is still on his
          feet with the salvage bar in his fist. Nothing between here and the
          market now but desert you've already learned to read. Walk him home to
          his mother.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "Scavengers scattered, the line home open, the boy still walking. Bring Eddin back to Soree at the scavenger market."

      - step: 5
        title: "Walked Home"
        location: outskirts_scavenger_market
        npc: "Soree Bann"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Soree Bann to close the job and bring her son home."
        npc_intro: >
          "You walked him out." [Soree Bann's three eyes go to the young man on
          your shoulder — fever-thinned and unsteady but upright, salvage bar
          still in his fist — and for a moment the held-breath stillness she came
          in with finally lets go.] "Stabilized, walked across open dune, and past
          whatever was waiting in the canyon. Here's your water-credits out of the
          season's sale, and then some. `talk` to me and let me get my boy sat
          down."
        completion:
          type: talk_to_npc
          npc: "Soree Bann"
        npc_complete: >
          "Square. You kept a fevered man breathing, read a desert that'd have
          buried him, and brought him home through people who'd have stripped him
          where he lay. That buys you my word on the far claims — out here that's
          shade and water when you need it, which is worth more than the credits.
          Anyone questions you on the Outer trails, you tell them Soree Bann
          vouches. Walk safe."
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          Eddin sits in the shade and the far claim keeps its son. Soree Bann's
          word travels the outskirts and the caravan trails — honest work in the
          Wastes finds those who finish it.

  # ─────────────────────────────────────────────────────────────────────
  # The SIXTH accessible (non-t5, non-tutorial) kind: questline chain, after
  # The Ghost Shipment (Nar Shaddaa), The Crooked Wheel (Tatooine/Mos Eisley),
  # The Lost Courier (Coruscant LOWER city), The Skimmed Line (Kuat ring), and
  # The Dust-Sick (Tatooine wilderness). FIRST questline set in Coruscant's
  # CULTURAL / MID-UPPER district (the Petrax Historic Quarter, the Galactic
  # Museum, Calocour Heights, Westport Spaceport — a different face of the
  # planet than the Lost Courier's lower city), and exercises a SIXTH distinct
  # skill spread — VALUE + CON — as an art-fraud caper: clear a defamed dealer
  # and recover a swapped artifact. Reuses the live questline engine with NO new
  # engine code/slot/event type, and touches NO map coordinate or exit graph
  # (the Coruscant rooms already exist + are loaded). NPCs back it in
  # data/worlds/clone_wars/npcs_drop_generalized_questline_false_provenance.yaml.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: coruscant_petrax_false_provenance
    chain_name: "The False Provenance"
    description: >
      A respected Petrax Quarter antiquities dealer is being ruined: she sourced
      a genuine pre-Republic votive for a wealthy collector in good faith, the
      collector received a flawless forgery, and now her name is being branded
      forger before the Guild of Antiquaries while her license hangs on it. The
      truth is a fence who swapped the real piece on the consignment leg and is
      hours from shipping it off-world. Authenticate the fake to prove the swap,
      pose your way into the broker's quiet money to learn where the genuine
      votive is moving, and run down his courier before Westport clears the
      berth. A freelance favor — open to anyone, no faction required.
    archetype_label: "Freelance Authentication"
    faction_alignment: independent
    starting_zone: monumental_district
    starting_room: petrax_quarter
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["false_provenance_cleared"]
      drop_room: petrax_quarter
      follow_up_hint: >
        Hessa Veil's name holds and the genuine votive goes back on the Guild
        register where it belongs. A dealer whose word survived a paid-for
        scandal remembers who proved it — and a good eye that can be trusted in
        the upper-city's quiet money is rarer, and worth more, than the fee.

    steps:
      - step: 1
        title: "The Defamed Dealer"
        location: petrax_quarter
        npc: "Hessa Veil"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Hessa Veil at her gallery in the Petrax Historic Quarter."
        npc_intro: >
          "You have the look of someone who can tell a true thing from a
          well-made lie. Good — that is precisely my problem. Hessa Veil; I deal
          antiquities on this row, honestly, for thirty years. I sourced a
          genuine pre-Republic Koru votive for a collector named Edran Sool —
          authenticated it myself — and the piece in his vault is a forgery. Now
          he is spending real money to call me a forger, and the Guild will pull
          my license over it. The swap happened on the consignment leg, through
          a fence I cannot prove exists. `talk` to me and I will tell you where
          to start pulling the truth loose."
        completion:
          type: talk_to_npc
          npc: "Hessa Veil"
        npc_complete: >
          "Start with the fake itself. Sool's forgery is on inquiry display at
          the Galactic Museum — the Guild lodged it as evidence. Get a proper
          look at it and `value` it the way I would: the glaze-firing, the
          mourning-glass inclusions, the weight of the clay. A forgery this good
          fools a buyer, not an appraiser who knows what to weigh. Prove it false
          and you have proved a swap happened — that is the first thread."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Galactic Museum and use your `value` skill to appraise the disputed votive and prove it a forgery — `chain attempt`."

      - step: 2
        title: "The Appraiser's Eye"
        location: galactic_museum
        npc: "(none)"
        npc_role: contact
        teaches: ["value"]
        objective: "Appraise the disputed Koru votive at the Galactic Museum and prove it a forgery with a value check."
        npc_intro: >
          [The forgery sits under glass in the museum's inquiry alcove, lodged
          as Guild evidence — a small dark mourning-votive, convincing at a
          glance, the kind of piece that fools the man who pays for it.] But the
          true Koru votives are kiln-fired to a glaze a forger cannot quite
          match and seeded with mourning-glass that settles a certain way under
          its own weight. Weigh it the way Hessa would — the firing, the
          inclusions, the heft of the clay — and read what it really is.
          `value`, careful and exact. `chain attempt` when you appraise it.
        completion:
          type: skill_check_passed
          skill: "value"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [It resolves under a careful eye: the glaze runs a half-shade too even,
          the mourning-glass sits high where age would have let it settle, the
          clay weighs light for its size. A good forgery — good enough to clear a
          collector's vault, not good enough to clear yours. The piece Sool
          received was never the one Hessa authenticated. Which means the genuine
          votive went somewhere, through someone, on its way through her hands —
          and the only quiet money on Coruscant that moves real relics like that
          works out of Calocour Heights.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "The fake is proven, so a swap happened — the genuine votive moved through a fence working the quiet money in Calocour Heights. Get there and `con` your way in as a rival buyer to draw the broker out — `chain attempt`."

      - step: 3
        title: "The Quiet Money"
        location: calocour_heights
        npc: "(none)"
        npc_role: contact
        teaches: ["con"]
        objective: "Pose as a rival collector in Calocour Heights to draw the fence out and learn where the genuine votive is moving — a con check."
        npc_intro: >
          [Calocour Heights runs on discreet money and discreeter taste — the
          broker who deals genuine relics off-world will not see a Guild
          investigator, but he will always make time for a richer buyer than the
          one he has.] Wear the part: an off-world collector with deep credits, a
          taste for pre-Republic Core pieces, and no patience for provenance
          questions. Let him think you are competition for the votive he is
          already moving, and he will tell you more reaching for your money than
          he ever would under oath. `con`, smooth and unhurried — `chain attempt`
          when you work him.
        completion:
          type: skill_check_passed
          skill: "con"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [The broker bites on the richer buyer the way Hessa said he would —
          warm, eager, careless. The genuine Koru votive, he lets slip pricing it
          against your invented bid, is already sold and already moving: a sealed
          shockcase, a hired courier, an off-world berth at Westport that boards
          within the hour. He even names the runner — a Zabrak, Brask Yade — to
          prove the piece is real and the deal is closing. He has just sold the
          one thing that clears Hessa to a buyer who is not you, and told you
          exactly where to catch it.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "The genuine votive is in a courier's chained case heading off-world — the Zabrak Brask Yade, boarding at Westport within the hour. Get there and take it back; `attack`, `dodge`."

      - step: 4
        title: "The Gate Lane"
        location: coruscant_westport_landing
        npc: "Brask Yade"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Stop Brask Yade at Westport Spaceport before the votive ships off-world — `attack`, `dodge`."
        npc_intro: >
          [Westport's gate lanes run thick with travelers, and a hard-faced
          Iridonian Zabrak moves through them toward a private berth with a
          sealed shockcase chained to one wrist — Brask Yade, the courier the
          broker named, the genuine votive an hour from leaving Coruscant for
          good. When you step into the lane between him and the berth, the bored
          professionalism goes cold and his free hand drops to the blaster.]
          "Case stays on the wrist, the wrist makes the berth, stranger.
          Whatever the old Bith paid you, it doesn't cover this. Walk — last
          time I say it."
        completion:
          type: combat_won
          enemy_template: "petrax_relic_courier"
          enemy_count: 1
        npc_complete: >
          [Brask Yade goes down in the gate lane and the berth boards without
          him. The chain comes off the wrist; the shockcase cracks open on a
          small dark mourning-votive that weighs right for its size, the
          mourning-glass settled deep and even where the forgery's sat high — the
          genuine Koru piece, caught a single hour before it would have been gone
          for good. Nothing between here and the Petrax row now but the walk back
          to the woman whose name it clears.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The courier's down and the genuine votive is in your hands. Bring it back to Hessa Veil at her Petrax Quarter gallery."

      - step: 5
        title: "Provenance Restored"
        location: petrax_quarter
        npc: "Hessa Veil"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Hessa Veil with the genuine votive to clear her name."
        npc_intro: >
          "You caught it." [Hessa Veil takes the votive in both hands, turns it
          once under the appraiser's loupe, and the careful composure she has
          held against a paid-for scandal finally eases.] "Genuine. The firing,
          the inclusions, the weight — this is the piece I authenticated, and
          the one in Sool's vault is the lie I'll prove with it. You appraised the
          fake, drew the broker into the open, and ran the real thing down before
          Westport cleared it. `talk` to me and let me put this back on the
          register where it belongs."
        completion:
          type: talk_to_npc
          npc: "Hessa Veil"
        npc_complete: >
          "Square — more than square. The Guild has the genuine votive, the
          courier's case, and a broker named in his own greed; the forgery charge
          collapses and Sool's money buys him nothing. You proved a true thing
          against a well-funded lie, which in my trade is the only thing that
          matters. Here is the gallery's commission, honestly paid. And you have
          a Bith appraiser's word on the Petrax row now — out here, that opens
          quiet doors money cannot. Walk well."
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The votive goes back on the Guild register and Hessa Veil keeps her
          name and her license. An honest dealer's word travels the upper-city's
          quiet money — a good eye that proved itself once gets sent for again.

  # ─────────────────────────────────────────────────────────────────────
  # GENERALIZED QUESTLINE (T3.24, seventh slice) — "The Forged Notice"
  # The SEVENTH accessible kind:questline. Back on Nar Shaddaa (vs the Ghost
  # Shipment's cantina/Undercity face of the same moon — reuses NONE of its
  # rooms), a SEVENTH distinct skill spread (forgery + bureaucracy), and a new
  # story shape: a forged-paperwork ship-seizure racket beaten on its own
  # registry ground. NPCs in npcs_drop_generalized_questline_forged_notice.yaml;
  # achievement forged_notice_cleared. No new engine code / slot / event type /
  # schema / faucet, and no map-coordinate or exit-graph change.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: nar_shaddaa_forged_notice
    chain_name: "The Forged Notice"
    description: >
      An honest Corellian freighter captain came back from a haul to find her
      ship condemned as derelict on a notice she never triggered — the work of a
      Nar Shaddaa port factor who forges abandonment paperwork, seizes the
      berthed ships of owners who can't fight the registry, and sells the hulls
      off-moon for a cut. The notice is a forgery with a good enough seal to take
      a ship, and a seizure crew is mustering within the hour. Prove the notice
      forged, file an emergency hold the factor can't quash, and stop his
      enforcer before the crew reaches the berth. A freelance favor — open to
      anyone, no faction required.
    archetype_label: "Freelance Counter-Forgery"
    faction_alignment: independent
    starting_zone: nar_shaddaa_promenade
    starting_room: upper_dock_observation
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["forged_notice_cleared"]
      drop_room: upper_dock_observation
      follow_up_hint: >
        The Cinder Run flies out clean and the factor's forged notice goes into
        the Guild record as evidence against a racket that ran for years on
        captains who couldn't fight the paper. A spacer whose ship you pulled out
        of a crooked seizure remembers it — and word travels the docks that
        there is someone who can read a forged seal and beat a bent clerk at his
        own forms.

    steps:
      - step: 1
        title: "The Condemned Ship"
        location: upper_dock_observation
        npc: "Cassa Brel"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Cassa Brel on the Upper Dock Observation Level."
        npc_intro: >
          "You look like you've read a few documents that didn't want to be
          read. Good — that's the job. Cassa Brel; that's my ship two levels
          down, the Cinder Run, and the port's just condemned her as derelict.
          She isn't. I flew her in here myself. There's a notice mag-clamped to
          her hull with a registry seal good enough to seize her and sell her
          off-moon, and the factor who hung it owns the desk I'd appeal to. It's
          a forgery — I'd stake the ship on it, which is exactly what I'm doing.
          `talk` to me and I'll tell you where to start prying it apart."
        completion:
          type: talk_to_npc
          npc: "Cassa Brel"
        npc_complete: >
          "Start with the notice itself. It's clamped to the Cinder Run's hull
          down at Landing Platform Besh — go read it the way a forger doesn't
          want it read. The seal, the issue-stamp, the authority codes: a fake
          good enough to fool a hurried captain isn't good enough to fool someone
          who knows what a real registry condemnation looks like. Prove that seal
          was never issued and you've proved the seizure's a theft."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to Landing Platform Besh and use your `forgery` skill to examine the derelict-notice on the Cinder Run's hull and prove it a fake — `chain attempt`."

      - step: 2
        title: "The Forged Seal"
        location: westport_arrivals
        npc: "(none)"
        npc_role: contact
        teaches: ["forgery"]
        objective: "Examine the derelict-notice clamped to the Cinder Run at Landing Platform Besh and prove the seal forged with a forgery check."
        npc_intro: >
          [The notice hangs mag-clamped to the freighter's hull at the platform's
          edge — a crisp condemnation slate, registry seal embossed, issue-codes
          marching down the margin, official enough at a glance to have already
          barred the captain from her own airlock.] But a real registry
          condemnation is issued, logged, and counter-sealed in three places a
          forger has to fake all at once — the embossed authority-seal, the
          issue-stamp's timestamp chain, the desk-code that says which clerk
          signed it. Read it the way the man who made it hoped no one would.
          `forgery`, slow and exact — `chain attempt` when you work the seal.
        completion:
          type: skill_check_passed
          skill: "forgery"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [It comes apart under a knowing eye: the authority-seal is embossed
          from a lifted master a half-generation stale, the issue-stamp's
          timestamp chain skips a registry handshake a genuine condemnation can't
          skip, and the desk-code belongs to a clerk who was off-shift the day it
          claims to be signed. A good forgery — good enough to seize a ship off a
          captain who can't fight it, not good enough to survive being read. The
          Cinder Run was never condemned by the registry. Which means the seizure
          stands on nothing but a faked seal — and a faked seal proven false is a
          hold the factor's own registry has to honor, if you file it before the
          crew moves.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "The seal's a proven forgery, so the seizure is fraudulent — now beat the factor on paper. Get to the Smugglers' Guild Hall registry and `bureaucracy` an emergency title-hold filed before the crew can take the ship — `chain attempt`."

      - step: 3
        title: "The Hold on the Desk"
        location: smugglers_guild_hall
        npc: "(none)"
        npc_role: contact
        teaches: ["bureaucracy"]
        objective: "File an emergency title-hold at the Smugglers' Guild registry to freeze the seizure before the crew moves — a bureaucracy check."
        npc_intro: >
          [The Guild's freight registry runs on forms, precedent, and which clerk
          owes which favor — and the factor has spent years making sure an appeal
          dies quietly at the desk he controls.] But a proven-forged seal is a
          different filing entirely: an emergency title-hold lodged on evidence of
          fraud goes around the appeals desk, not through it, and once it's
          stamped the seizure is frozen until a Guild arbiter rules — long after
          the crew's window closes. You have to know the form, cite the right
          condemnation statute, and get it stamped by a clerk who isn't the
          factor's before he hears it's coming. `bureaucracy`, sharp and certain
          — `chain attempt` when you file it.
        completion:
          type: skill_check_passed
          skill: "bureaucracy"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [It stamps. The right form, the fraud-evidence rider, the statute cited
          chapter and line, dropped on a clerk three desks clear of the factor's
          reach before word of it crosses the floor — and an emergency title-hold
          on the Cinder Run is suddenly Guild record, frozen pending an arbiter
          the factor can't appoint. On paper, the ship is safe. The trouble is
          the factor's crew doesn't read paper fast: his enforcer is already
          mustering a seizure detail to march on the berth and take the hull
          before the hold can mean anything, and a clamped ship hauled off-moon
          is hard to give back, arbiter or no. The hold only holds if the crew
          never reaches the Cinder Run.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "The hold is filed but the factor's crew is mustering to take the ship before it matters — his enforcer is forming them up in Enforcer Alley. Stop him before they reach the berth; `attack`, `dodge`."

      - step: 4
        title: "The Alley Mouth"
        location: enforcer_alley
        npc: "Varn Tesk"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Stop Varn Tesk in Enforcer Alley before the seizure crew reaches the Cinder Run — `attack`, `dodge`."
        npc_intro: >
          [Enforcer Alley runs from the Corellian Sector to the upper docks, and
          a broad, leather-skinned Weequay is mustering a half-dozen hired hands
          in its mouth — Varn Tesk, the factor's enforcer, a rolled seizure writ
          in one fist and the Cinder Run named on it, the crew that turns a forged
          notice into a stolen ship. When you plant yourself in the lane between
          him and the berth, the bored efficiency goes flat and his free hand
          settles on the blaster.] "Writ's good, the berth's condemned, and
          you're standing in a working alley. Whatever the captain promised you,
          it doesn't cover a seizure crew. Clear the lane — last time I say it."
        completion:
          type: combat_won
          enemy_template: "nar_forged_notice_enforcer"
          enemy_count: 1
        npc_complete: >
          [Varn Tesk goes down in the alley mouth and the half-mustered crew, paid
          by the cleared berth and not by the fight, melts back into the
          Promenade rather than serve a writ a Guild hold has already frozen. The
          rolled seizure writ comes loose from his fist — the same forged seal you
          read on the hull, the same racket, named now in his hand. Nothing
          between here and the Cinder Run's berth but the walk back up to the
          captain whose ship the hold and the alley just bought back.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The enforcer's down and the crew's scattered — the hold holds. Bring the cleared title back to Cassa Brel on the Upper Dock Observation Level."

      - step: 5
        title: "Title Cleared"
        location: upper_dock_observation
        npc: "Cassa Brel"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Cassa Brel with the seizure stopped to clear the Cinder Run's title."
        npc_intro: >
          "She's still on the clamps, but the clamps come off now." [Cassa Brel
          turns from the observation rail, the set finally going out of her jaw as
          she reads the stamped hold and the forged writ you carry.] "Forged seal
          proven, hold filed, crew turned back — that's the whole trap sprung, in
          order. The arbiter'll rule the notice a fraud, the factor's name goes on
          the Guild record beside it, and a racket that ran for years on captains
          who couldn't fight the paper just met one who could. `talk` to me and
          let me sign you what I owe you."
        completion:
          type: talk_to_npc
          npc: "Cassa Brel"
        npc_complete: >
          "Square — more than square. The Cinder Run flies out clean, the forged
          notice is evidence instead of a death warrant, and Factor Hask is going
          to spend a long time explaining a desk full of seals that were never
          issued. Here's the run's fee, honestly paid. And you've a captain's word
          on the Nar Shaddaa docks now — out here, a name that reads a forgery and
          beats a bent registry is worth more than the fee and travels faster.
          Fair skies."
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The Cinder Run's title clears and Cassa Brel keeps the ship she earned.
          A captain's word travels the docks — a sharp eye for a forged seal and a
          steady hand at a crooked desk get sent for again.

  - chain_id: nar_shaddaa_warrens_toll
    chain_name: "The Warrens Toll"
    description: >
      Down in the Warrens — the lowest inhabitable levels of the Smuggler's Moon
      — a racketeer the locals know only as the Toll-Keeper has sold "reactor
      safety" to the squat block for a year: pay the toll or the centuries-old
      reactor that keeps the level lit and breathing has an "accident." This cycle
      the block couldn't pay, and his enforcer wired a real demolitions charge
      into the reactor's cooling fins — a breach that would collapse the lowest
      levels and everyone on them. There is no law on Nar Shaddaa that comes down
      this far. Get the frightened level to move together, take the charge off the
      fins before it blows, and stop the enforcer who comes to set it by hand. A
      freelance favor — open to anyone, no faction required.
    archetype_label: "Freelance Community Defense"
    faction_alignment: independent
    starting_zone: nar_shaddaa_warrens
    starting_room: warrens_squat_block
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["warrens_toll_broken"]
      drop_room: warrens_squat_block
      follow_up_hint: >
        The charge comes off the fins, the enforcer goes down in the rubble, and
        for the first cycle in a year the squat block sleeps without a toll over
        its head — word travels the Warrens that the Toll-Keeper's safety racket
        met a level that didn't pay and didn't burn. A keeper of a hundred
        families remembers who spent themselves on the block instead of the boss,
        and the lowest level of the Smuggler's Moon learns there is someone who
        will come down here when no law will.

    steps:
      - step: 1
        title: "The Toll Came Due"
        location: warrens_squat_block
        npc: "Vessa Tial"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Vessa Tial in the Warrens squat block."
        npc_intro: >
          "You came down to the Warrens on purpose — that already makes you rarer
          than help usually is down here. Vessa Tial; I keep this block, such as
          it keeps. There's a man we only ever call the Toll-Keeper who sells us
          reactor-safety: pay the toll, or the reactor that keeps this level
          breathing has an accident. We paid it like weather for a year. This
          cycle we couldn't — and his enforcer wired a real charge into the
          reactor's cooling fins. No law on this moon comes down this far. `talk`
          to me and I'll tell you what I can't do alone."
        completion:
          type: talk_to_npc
          npc: "Vessa Tial"
        npc_complete: >
          "Three things, and I can't do one of them. First — the level. People
          are hiding in their dwellings waiting to die polite. The scavengers in
          the den hold the only safe approach to the reactor and they won't open
          it; they're as scared as everyone, and scared people down here close
          the barricade. Get them — get the whole level — to move as one instead
          of waiting. You'll have to make a frightened crowd believe acting beats
          hiding. Start in the scavenger den; that's the door we need open."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Warrens Scavenger Den and use your `command` skill to rally the scavengers and the squat-block dwellers to act together and open the reactor approach — `chain attempt`."

      - step: 2
        title: "Move the Level"
        location: warrens_scavenger_den
        npc: "(none)"
        npc_role: contact
        teaches: ["command"]
        objective: "Rally the frightened scavengers and squat-block dwellers to act together and open the safe approach to the reactor — a command check."
        npc_intro: >
          [Behind the den's barricade of welded durasteel a knot of hard-bitten
          scavengers and squat-block families have gone still and small, each
          waiting for someone else to move first while a charge ticks on the only
          reactor they have.] They are not cowards — they are people who have
          learned that on the Smuggler's Moon the ones who stand up get noticed,
          and being noticed kills you. Changing that in the next few minutes is not
          a matter of a good speech; it is a matter of giving frightened people a
          job, a direction, and the nerve to believe a level acting together can
          do what a level hiding never could. Lead them — open the barricade, clear
          the safe approach, put eyes on the toll-crew's lookouts. `command`,
          steady and certain — `chain attempt` when you take charge.
        completion:
          type: skill_check_passed
          skill: "command"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [It turns, the way a frightened crowd turns when one person finally tells
          it where to stand: the barricade comes down, scavengers who would not
          open the approach for fear are suddenly clearing it and posting watch on
          the toll-crew's lookouts, and the squat block stops waiting to die polite
          and starts moving its old and its young up off the lowest level. With the
          approach open and the lookouts watched, the reactor core is reachable —
          and somewhere on its cooling fins is the charge the level just found the
          nerve to let you go and pull.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "The level's moving and the approach is open — now the charge. Get to the Warrens Reactor Core Access and use your `demolitions` skill to take the charge off the cooling fins before it breaches — `chain attempt`."

      - step: 3
        title: "The Charge on the Fins"
        location: warrens_reactor_core
        npc: "(none)"
        npc_role: contact
        teaches: ["demolitions"]
        objective: "Reach the demolitions charge wired into the reactor's cooling fins and defuse it before it breaches — a demolitions check."
        npc_intro: >
          [The reactor core access is a furnace of residual heat off a machine
          that has run unmaintained for centuries, the catwalk humming with
          suppressed power — and clamped low among the cooling fins where the
          breach would do the most is the charge: a competent, ugly piece of
          work, shaped to crack a fin-bank and let the core run away rather than
          to simply explode.] A panicked yank sets it off; so does cutting the
          wrong lead. Reading it is the whole job — the trigger logic, the
          anti-tamper, the order the leads have to come in — and doing it with the
          heat closing your throat and a level depending on your hands not
          shaking. `demolitions`, slow and exact — `chain attempt` when you work
          the charge.
        completion:
          type: skill_check_passed
          skill: "demolitions"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [It comes apart the way ugly competent work does when someone better
          reads it: the anti-tamper first, then the trigger logic, then the leads
          in the only order that doesn't run the core — and the charge goes dead
          and harmless in your hands, a breach that won't happen lifted clean off
          the fins. The reactor settles back to its old centuries' hum, the level
          above it keeps breathing, and the thing the Toll-Keeper sold safety
          against is suddenly just scrap and evidence. The trouble is the deadline
          has passed and the toll's gone unpaid — and a collector whose lesson
          just failed doesn't write it off. His enforcer is already crossing the
          collapsed plaza to set the next one by hand and make the block pay in
          wreckage what it wouldn't pay in credits.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "The charge is dead but the enforcer's coming to set another by hand — he's crossing the Collapsed Plaza toward the reactor approach. Stop him before he reaches it; `attack`, `dodge`."

      - step: 4
        title: "The Gap in the Rubble"
        location: warrens_collapsed_plaza
        npc: "Tarko Venn"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Stop Tarko Venn in the Collapsed Plaza before he reaches the reactor approach to set another charge — `attack`, `dodge`."
        npc_intro: >
          [The collapsed plaza is a tangle of fallen building-layers, the ceiling
          of the level a frozen avalanche overhead — and picking across it toward
          the one gap in the rubble that opens onto the reactor approach is a
          heavy, flat-faced Klatooinian, a remote detonator clipped at his belt
          and a blaster on his hip. Tarko Venn, the Toll-Keeper's enforcer, the
          hand that wired the dead charge and means to set the next one himself.
          When you plant yourself in the gap between him and the approach, he
          thumbs the detonator, finds the charge already gone, and lets his free
          hand fall to the blaster instead.] "Block missed the toll. That makes
          this a collection, and you're standing in it. Out of the rubble — last
          time I say it."
        completion:
          type: combat_won
          enemy_template: "warrens_toll_enforcer"
          enemy_count: 1
        npc_complete: >
          [Tarko Venn goes down in the gap in the rubble, the remote detonator
          skittering away across fallen tile to a charge that isn't there anymore,
          and the toll-crew's lookouts — paid by a collection, not by a fight on a
          level that suddenly isn't scattered — fade back up the shafts rather than
          come down into a Warrens that found its nerve. The detonator and the dead
          charge are the whole racket in your hands now, the same shaped work on a
          dozen blocks the Toll-Keeper bled before this one. Nothing between here
          and the squat block but the climb back to the keeper who bet the toll-money
          on a stranger.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The enforcer's down and the crew's scattered — the level holds. Bring word back to Vessa Tial in the squat block."

      - step: 5
        title: "The Toll Broken"
        location: warrens_squat_block
        npc: "Vessa Tial"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Vessa Tial with the charge dead and the enforcer down to break the toll."
        npc_intro: >
          "The reactor's humming and the lifts are full of people coming back
          down." [Vessa Tial sets down the block's roster, the steadiness she
          has been holding all cycle finally costing her a breath as she takes the
          dead charge and the detonator from your hands.] "Level moved, charge
          pulled, his man down in the plaza — that's the toll broken, in order.
          The Toll-Keeper sold safety against the one thing that would've killed
          us, and a block that couldn't pay him just made sure he can't sell it
          here again. `talk` to me and let me give you what we owe you."
        completion:
          type: talk_to_npc
          npc: "Vessa Tial"
        npc_complete: >
          "Square — and the block knows it. This is the toll-money — every credit
          we scraped to stay alive this cycle. It was always going to be spent on
          surviving; I'd a thousand times rather it bought the block than the boss.
          You've a keeper's word in the Warrens now, and word travels down here
          faster than it travels up — when no law will come to the lowest level,
          there's a name that will. Mind the climb out, and the spores in the
          fungal cavern. Go safe."
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The squat block keeps its reactor and its hundred families, and the
          Toll-Keeper's safety racket loses the level it leaned on hardest. A
          keeper's word travels the Warrens — when a block needs someone who will
          come down where the law won't, they send for the name that already did.

  # ─────────────────────────────────────────────────────────────────────
  # The NINTH accessible kind:questline. Coruscant MID-CITY — the commercial
  # district and the Coruscant Works sublevels — a FRESH district reusing
  # NONE of the two prior Coruscant arcs' rooms (the Lost Courier ran the
  # lower-city crystal_jewel_cantina / lower_refugee_warren / petrax_sublevels
  # / factory_district; the False Provenance ran the monumental petrax_quarter
  # / galactic_museum / calocour_heights / coruscant_westport_landing). It
  # exercises a NINTH distinct skill spread — PICK POCKET + HIDE + COMPUTER
  # PROGRAMMING (slicing) — none of which any prior accessible questline uses,
  # and it is a NEW STRUCTURE: the FIRST accessible questline that resolves on
  # FINESSE, not force. Three skill-check steps and NO combat step, climaxing
  # on the master slice rather than a blaster fight — the first side-arc a
  # pure slicer / scoundrel / face build can finish on its own terms (every
  # other accessible questline forces a combat climax). A heist-for-justice:
  # pull the proof of a predatory info-broker's forged debt-liens out of the
  # private data-vault he hid in a dead corner of the Works, before his
  # scheduled purge re-forges it — clearing dozens of families at once. NPCs
  # in npcs_drop_generalized_questline_sealed_ledger.yaml; achievement
  # sealed_ledger_recovered. ONE placed NPC (the giver/closer); the broker
  # "the Ledger", his collector, his watchers, and the seized families are
  # narrated-only (no spawned entity, and no combat step needs a foil). No new
  # engine code / slot / event type / schema / faucet, and no map-coordinate
  # or exit-graph change.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: coruscant_works_sealed_ledger
    chain_name: "The Sealed Ledger"
    description: >
      An info-broker the Coruscant mid-city knows only as the Ledger runs a
      "debt-clearing service" that is really a forgery mill: he fabricates
      lien-records against working families — debts they never owed — and when
      they can't pay his "service fees" he seizes their accounts through a
      registry desk he controls. The proof the liens are fakes lives in a
      private data-vault he tucked into a decommissioned corner of the
      Coruscant Works, behind automation so old the maintenance crews never
      look at it, and on a schedule he runs a purge that wipes and re-forges
      the records to stay ahead of any audit. One advocate — Terva Dohl, who
      helps mid-city families fix registry errors honestly — can't beat him on
      paper: he owns the desk and forges faster than she can appeal. So she
      needs the original ledger pulled out of his vault before the next purge,
      the one record that collapses every forged lien at once. A sealed
      sublevel full of his watchers is no place for a firefight; this is a job
      for a light touch — lift the way in, slip past unseen, and crack the
      lock. A freelance favor, open to anyone, no faction required.
    archetype_label: "Freelance Heist"
    faction_alignment: independent
    starting_zone: commercial_district
    starting_room: dexters_diner
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["sealed_ledger_recovered"]
      drop_room: dexters_diner
      follow_up_hint: >
        The original ledger reaches an honest desk before the Ledger's purge
        can re-forge it, and the forged liens collapse all at once — dozens of
        mid-city families clear of debts they never owed, the widow whose
        savings he took first among them. The broker who never lost a record to
        an audit just lost the whole vault to a pair of quiet hands, and word
        moves through the mid-city the way it moves nowhere else: there is
        someone who gets a thing back without ever raising a blaster.

    steps:
      - step: 1
        title: "The Advocate's Problem"
        location: dexters_diner
        npc: "Terva Dohl"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Terva Dohl at Dexter's Diner in Coco Town."
        npc_intro: >
          [A sleek-furred Bothan woman has a back booth at Dexter's and a
          datapad stacked with other people's ruin.] "You have the look of
          someone who can get a thing out of a place it isn't supposed to come
          out of. Good. Terva Dohl — I help mid-city families fix what the
          registry got wrong, and lately I'm losing. There's a broker they call
          the Ledger; he forges debt-liens against people who never borrowed a
          credit, then seizes their accounts when they can't pay his fees. I
          can't beat him appealing — he owns the desk and forges faster than I
          can file. But he keeps the originals, the proof the liens are fake, in
          a vault he thinks no one can reach. `talk` to me and I'll tell you
          where he hid it."
        completion:
          type: talk_to_npc
          npc: "Terva Dohl"
        npc_complete: >
          "He runs a purge on a schedule — wipes the originals and re-forges
          them clean, so an audit never finds the same record twice. Pull the
          ledger before the next purge and every forged lien collapses at once;
          dozens of families clear, all of them. The vault's in a dead corner of
          the Coruscant Works, and the only soft way in starts with his
          collector — the man who works the mid-city accounts carries the vault
          fob on him, and he rides the transit hub every shift in a crowd thick
          enough to lose a hand in. Lift the fob. Don't let him feel it go."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Mid-City Transit Hub and lift the Ledger's collector's vault-fob out of the commuter crush with your `pick pocket` skill — `chain attempt`."

      - step: 2
        title: "The Fob in the Crowd"
        location: mid_transit_hub
        npc: "(none)"
        npc_role: contact
        teaches: ["pick pocket"]
        objective: "Lift the vault access-fob off the Ledger's collector in the Mid-City Transit Hub crowd with a pick pocket check."
        npc_intro: >
          [The transit hub moves tens of thousands an hour through tram queues
          and turbolift crushes, and the Ledger's collector rides it every
          shift — a careful man in a good coat, the vault fob clipped to an
          inside pocket where a careless hand would never reach and a slow one
          would get caught.] Pickpockets work this crowd for a living and the
          scan-droids run random sweeps; the only way to take the fob is in the
          press of a tram arrival, clean and unhurried, and to leave him certain
          it's still in his pocket. `pick pocket`, light and patient — `chain
          attempt` when the crowd surges.
        completion:
          type: skill_check_passed
          skill: "pick pocket"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [The tram doors gasp open, the crowd lurches, and in the half-second
          of contact the fob comes free of the inside pocket and into your sleeve
          while your other hand is already somewhere harmless. The collector
          rides on, hand brushing his coat out of habit, feeling the shape of
          something that is no longer there. By the time he reaches the vault and
          learns it's gone, you intend to be standing in it. The fob will open
          the Ledger's reader — but the vault sits in a stretch of the Coruscant
          Works he keeps watched, and a fob in the wrong place at the wrong
          moment is worse than no fob at all.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "You have the fob — now reach the vault unseen. Get down to the Coruscant Works Industrial Sublevel and `hide` your way past the Ledger's posted watchers and the dead sublevel's sensor sweep — `chain attempt`."

      - step: 3
        title: "The Quiet Sublevel"
        location: commercial_district_main
        npc: "(none)"
        npc_role: contact
        teaches: ["hide"]
        objective: "Cross the Coruscant Works Industrial Sublevel to the dead plant unseen — past the Ledger's watchers and the motion-sweep — with a hide check."
        npc_intro: >
          [The Works sublevel is conduits and recyclers and the kind of quiet
          that makes the few people down here nervous; the live grid stations
          have their own crews busy elsewhere, but the dead stretch toward the
          old atmospheric plant is the Ledger's, and he keeps two watchers on the
          approach and a motion-sweep walking the gantries between them.] A
          firefight in a sealed sublevel ends with you cornered; the way through
          is the way no one notices — read the sweep's pattern, time the
          watchers' arcs, and move only in the gaps, staying off the
          motion-grid and out of every sightline. `hide`, slow and certain —
          `chain attempt` when the sweep turns away.
        completion:
          type: skill_check_passed
          skill: "hide"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [The sweep crawls down the far gantry, a watcher turns to light a
          deathstick in cupped hands, and in the dark seam between them you cross
          the dead stretch one held breath at a time — past the warning-lit
          recyclers no one remembers the meaning of, into the oldest part of the
          plant where the automation hasn't been updated since the late Old
          Republic and no living soul comes on purpose. The vault is here, where
          he was sure no one would ever stand: a slicer's-gauntlet lock on a
          data-core tucked behind machinery older than the war. The fob wakes the
          reader. The lock is another matter — and somewhere a purge-timer is
          counting down toward the wipe that makes all of this for nothing.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "You're at the vault in the Atmospheric Processing Plant — now beat the lock before the purge. Slice the data-core's gauntlet with your `computer programming` skill and pull the original ledger — `chain attempt`."

      - step: 4
        title: "The Slicer's Gauntlet"
        location: commercial_district_atmospheric
        npc: "(none)"
        npc_role: contact
        teaches: ["computer programming"]
        objective: "Crack the data-vault's slicer-gauntlet lock and pull the original ledger before the scheduled purge wipes it — a computer programming check."
        npc_intro: >
          [The data-core sits behind the ancient automation like a held secret,
          and the Ledger spent on it the one thing he trusts: a slicer's
          gauntlet, layered counter-ice that wipes the originals the instant a
          clumsy intrusion trips it — and a purge-timer underneath, counting
          down to do the same on schedule whether you're here or not.] This is
          the whole job in one roll: get through the gauntlet faster than it can
          wipe, and faster than the timer, and pull the original ledger clean —
          the forged liens collapse the moment it reaches an honest desk, but
          only if it survives the next sixty seconds. `computer programming`,
          steady and exact — `chain attempt`, and beat the clock.
        completion:
          type: skill_check_passed
          skill: "computer programming"
          difficulty: 14
          on_fail: "retry_allowed"
        npc_complete: >
          [The gauntlet peels back layer by layer under a knowing hand — a feint
          to draw the counter-ice, a held line while it resets, and then the core
          is open with the purge-timer still ticking and the wipe still leashed.
          The original ledger copies out whole: every forged lien, every seized
          account, every family name the Ledger manufactured a debt against, in
          the broker's own untouched records. You pull it clean and let the
          gauntlet close on an empty core a breath before the purge fires on
          nothing. He'll re-forge what's left and find it proves only that he
          forges — because the real ledger is in your hand, and it only has to
          reach Terva Dohl before he learns it's gone.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "You have the original ledger — now get it to an honest desk before the Ledger can react. Bring it back to Terva Dohl at Dexter's Diner."

      - step: 5
        title: "An Honest Desk"
        location: dexters_diner
        npc: "Terva Dohl"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Terva Dohl with the original ledger to collapse the forged liens."
        npc_intro: >
          [Terva Dohl reads the copied ledger in the back booth, fur prickling,
          scrolling faster the further she gets.] "You actually pulled it. The
          whole vault, the originals, every lien he forged in his own hand — this
          isn't an appeal, this is the case that ends him. Fob lifted, sweep
          beaten, gauntlet cracked, and not a shot fired — that's the cleanest
          piece of work I've seen in the mid-city in years. `talk` to me and let
          me pay you what this is worth before I go file it where he can't reach."
        completion:
          type: talk_to_npc
          npc: "Terva Dohl"
        npc_complete: >
          "It's filed — on a desk the Ledger doesn't own, with the originals
          attached, before his purge could re-forge a single line. Every lien he
          hung collapses at once: the widow gets her savings back, and dozens of
          families clear of debts they never owed. Here's your fee, honestly
          paid, and there's more than the fee in it for you — the mid-city has a
          name now for someone who gets a thing back without raising a blaster,
          and that name travels. Quiet hands are rarer than gun hands down here,
          and worth more. Come find me when you want the next one."
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The forged liens collapse and the mid-city families come out clear,
          the widow first among them. A name moves through the commercial
          district — someone who can get a thing back on finesse alone — and
          quiet work has a way of finding the quiet hands that can do it.

  # ─────────────────────────────────────────────────────────────────────
  # The TENTH accessible kind:questline. Tatooine SPEEDER CIRCUIT — the Mos
  # Eisley spaceport speeder lot, the transport depot, the outskirts speeder
  # track, and the gutted-sandcrawler chop-shop — a THIRD, vehicle-country
  # face of Tatooine reusing NONE of the two prior Tatooine arcs' rooms (the
  # Crooked Wheel ran market_place_geps_grill / chalmuans_cantina_main_bar /
  # mos_eisley_market_district / outskirts_abandoned_farm; the Dust-Sick ran
  # the Jundland outskirts_scavenger_market / jundland_hidden_cave /
  # jundland_dune_sea_edge / jundland_beggars_canyon). It exercises a TENTH
  # distinct skill spread — SENSORS + REPULSORLIFT OPERATION — and is the
  # FIRST accessible questline to lead with a MECHANICAL build (every prior
  # arc leads with Perception / Knowledge / Technical / combat skills),
  # rewarding the pilot / driver / scanner character that the social,
  # investigative, appraisal, technical-repair, leadership, and finesse arcs
  # never do. A new STORY SHAPE: breaking a fixed racing circuit. A swoop
  # gang the outskirts calls the Dust Wheelers spikes honest riders' coils at
  # the start gates so their own rigs win the purses and the haul contracts;
  # they spiked a young runner's speeder and stripped it at their chop-shop,
  # a stranded medical-supply run still crated on it. Read the sabotage off
  # the depot gate scanners and trace the gang's rig (sensors), run the
  # circuit to draw their outrider off the chop-shop (repulsorlift
  # operation), stand off the enforcer who guards it (combat), and bring the
  # rig and the run back. NPCs in
  # npcs_drop_generalized_questline_sabotaged_run.yaml; achievement
  # sabotaged_run_won. TWO placed NPCs (the giver/closer + the combat foil);
  # the gang's boss "the Pacer", the outrider, the gang crew, the young
  # runner, and the stripped rigs are narrated-only (no spawned entity). No
  # new engine code / slot / event type / schema / faucet, and no
  # map-coordinate or exit-graph change.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: tatooine_speeder_sabotaged_run
    chain_name: "The Sabotaged Run"
    description: >
      Out at the Mos Eisley outskirts speeder circuit — where independent
      haulers prove their rigs and pick up the contract runs the big outfits
      won't touch — a swoop gang the locals call the Dust Wheelers has the
      whole track fixed. They scan honest riders' repulsors at the start
      gates and quietly spike the coils of anyone who won't buy their "track
      insurance," so the gang's own rigs take every purse and every haul
      contract. This week they spiked a young runner's speeder mid-race; she
      walked away, but her rig — and the medical-supply run riding on it — is
      stripped down in the gang's chop-shop out at a gutted sandcrawler. Read
      the sabotage off the depot gate scanners and trace the gang's rig, run
      the circuit to pull their outrider off the chop-shop, stand off the
      enforcer who guards it, and bring the rig and the run home. A freelance
      favor — open to anyone, no faction required.
    archetype_label: "Freelance Circuit Run"
    faction_alignment: independent
    starting_zone: tatooine_spaceport
    starting_room: spaceport_speeders
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["sabotaged_run_won"]
      drop_room: spaceport_speeders
      follow_up_hint: >
        The runner's rig comes back off the gang's racks and the stranded
        medical-supply run reaches the moisture farms a week late but whole;
        the Dust Wheelers' fix on the outskirts circuit cracks the day an
        independent beat their outrider clean and walked their enforcer down
        in his own chop-shop. Word runs the speeder lanes the way it runs
        nowhere else on Tatooine — there's a hand who'll take the gang's
        spike off an honest rig and give it back — and honest riders queue at
        the start gates again.

    steps:
      - step: 1
        title: "The Fixed Circuit"
        location: spaceport_speeders
        npc: "Ria Tann"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Ria Tann at Spaceport Speeders in Mos Eisley."
        npc_intro: >
          [A blue-skinned Duros woman looks up from a stripped repulsor
          housing on the bench, grease to the elbow, a row of dead spike-coils
          laid out beside it like evidence.] "You ride, or you haul? Either
          way you came to the right bench and the wrong week. Ria Tann — I
          keep the only honest speeder shop left on the outskirts circuit.
          There's a swoop gang, the Dust Wheelers, that's got the whole track
          fixed: scan your repulsor at the start gate, and if you won't buy
          their 'track insurance' they spike your coil so it throws at speed.
          Their rigs win every purse and every haul run, and the independents
          are folding. They spiked a kid mid-race three days back. `talk` to
          me and I'll tell you what they took."
        completion:
          type: talk_to_npc
          npc: "Ria Tann"
        npc_complete: >
          "She walked away — barely. Her rig didn't: it's stripped down in
          their chop-shop out at the old gutted sandcrawler past the track,
          and there was a medical-supply run contracted on it — bacta and
          fever-spike for the far moisture farms — stranded with it. I can't
          out-muscle a gang, and there's no law in the outskirts that hasn't
          already taken their cut. But the spike they use leaves a signature,
          and every rig that runs the circuit gets logged at the depot gate
          scanners. Start there — read what they did to her coil, and the same
          scan'll show you where their rig went after."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Transport Depot and use your `sensors` skill to read the Dust Wheelers' spike off the gate-scanner logs and trace their rig out to the chop-shop — `chain attempt`."

      - step: 2
        title: "The Signature in the Logs"
        location: transport_depot
        npc: "(none)"
        npc_role: contact
        teaches: ["sensors"]
        objective: "Read the gang's sabotage off the depot gate-scanner logs and trace their rig to the chop-shop — a sensors check."
        npc_intro: >
          [The transport depot's gate scanners log every repulsor that runs
          the outskirts circuit — a wall of signal traces, throttle ghosts,
          and transponder pings going back weeks, most of it junk and all of
          it the gang's cover.] The spiked coil left a signature in the
          runner's last trace if you know the shape to look for: a foreign
          scan-pulse riding the gang's own start-gate sweep, the half-second
          they wrote the fault in. The rig that pulsed it spoofed its
          transponder but not its throttle ghost — and that runs the same
          drift on every Dust Wheeler chassis. Cut the gang's pulse out of the
          noise, match the drift, and the trace runs straight to where their
          rig parked. `sensors`, patient and exact — `chain attempt` when the
          signal resolves.
        completion:
          type: skill_check_passed
          skill: "sensors"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [The runner's last trace blooms on the scanner and there it is — a
          foreign scan-pulse laid over her coil a half-second before the
          fault, the gang writing the spike in at the gate exactly the way Ria
          said. You pull the pulse, match its throttle-drift against the weeks
          of logged traces, and the same drift surfaces over and over on a
          transponder that keeps changing its name and never its chassis. The
          last clean ping parks it out past the track, at the gutted
          sandcrawler the outskirts crews stopped going near. The proof's in
          hand and the chop-shop's on the map — but their rigs run a picket on
          the circuit, and the only way out there fast enough to matter is to
          run it yourself.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "You've traced the rig to the chop-shop and you know their spike — now get out there. Take a speeder onto the City Outskirts Speeder Track and out-run the Dust Wheelers' outrider with your `repulsorlift operation` skill — `chain attempt`."

      - step: 3
        title: "The Outrun"
        location: outskirts_speeder_track
        npc: "(none)"
        npc_role: contact
        teaches: ["repulsorlift operation"]
        objective: "Run the outskirts circuit and beat the Dust Wheelers' outrider to draw their picket off the chop-shop — a repulsorlift operation check."
        npc_intro: >
          [The outskirts speeder track is a flat-out run of gate-markers and
          dust through the broken country past the spaceport, and the Dust
          Wheelers keep an outrider on it to turn back anyone headed for the
          chop-shop.] You can't sneak a speeder past a picket on open hardpan —
          but you can beat it. Make a run their outrider has to chase: hold
          the throttle past where a careful rig lifts, ride the gate-markers
          close enough to strip paint, and draw him off the chop-shop road and
          onto your tail, where he can't watch both. A gang that wins by
          spiking honest coils rides slow on a clean rider who isn't scared of
          the dust. `repulsorlift operation`, full out and steady — `chain
          attempt` when you commit to the run.
        completion:
          type: skill_check_passed
          skill: "repulsorlift operation"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [You take the circuit the way the gang never expects an independent
          to take it — wide open through the first gates, throttle past the
          lift line, close enough to the markers that the outrider commits to a
          chase he has to win and finds he can't. He burns his lead trying to
          match a line he doesn't have the nerve for, drifts wide on the back
          hardpan, and falls off your tail somewhere behind the dust with the
          chop-shop road wide open ahead of you. The picket's pulled and the
          gutted sandcrawler is in sight off the track — but the noise of your
          run has told everyone in it that someone is coming, and the enforcer
          who keeps the chop-shop will be standing in the door.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "You've pulled the picket and the chop-shop's ahead — but the noise brought their enforcer out. Get to the Wrecked Sandcrawler and stop Drevin Saar; `attack`, `dodge`."

      - step: 4
        title: "The Chop-Shop Door"
        location: outskirts_wrecked_sandcrawler
        npc: "Drevin Saar"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Stop Drevin Saar at the gang's chop-shop in the Wrecked Sandcrawler and recover the runner's rig — `attack`, `dodge`."
        npc_intro: >
          [The gutted sandcrawler is a cave of stripped speeders and
          cannibalized repulsors — the Dust Wheelers' chop-shop — and standing
          in the torn-open hull with the runner's half-stripped rig behind him
          is a red-skinned, horned Devaronian in a racer's vest, a blaster
          loose in one hand and a coil-spanner still in the other.] Drevin
          Saar, the gang's enforcer — the man who works the spikes and keeps
          the chop-shop, who heard a clean run pull his picket and came to the
          door to see who was fool enough to make it. When he reads that you
          mean to take the rig back, his easy contempt goes flat and certain.
          "That coil's the gang's now, hauler — same as the run that was on it.
          You rode all the way out here to lose a speeder and walk back, if you
          walk. Turn around." [He thumbs the blaster up.]
        completion:
          type: combat_won
          enemy_template: "sabotaged_run_enforcer"
          enemy_count: 1
        npc_complete: >
          [Drevin Saar goes down among the stripped rigs he cut apart, the
          coil-spanner ringing off the sandcrawler's hull, and the chop-shop
          crew — gang riders who run a fixed circuit precisely so they never
          have to fight a fair one — melt out the far breaches rather than
          stand for an enforcer who just lost in his own door. The runner's rig
          is racked and half-stripped, but the drive and the coil are whole,
          and the medical-supply run is still crated in the cargo well, bacta
          and fever-spike untouched. Enough rig to limp back to Ria's bench,
          enough run to still reach the farms. Nothing between here and the
          spaceport but the drive back — and the gang's whole spike racket,
          dead coils and all, riding in the seat beside you.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The enforcer's down, the crew's scattered, and you've got the rig and the medical run — drive it back to Ria Tann at Spaceport Speeders."

      - step: 5
        title: "Honest Riders Again"
        location: spaceport_speeders
        npc: "Ria Tann"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Ria Tann with the recovered rig and the stranded medical run."
        npc_intro: >
          [Ria Tann comes out from behind the bench before you've cut the
          repulsor, already reading the rig on the trailer and the crates in
          the well — and the dead spike-coils you've brought back with them.]
          "You beat their outrider on open hardpan and walked Saar down in his
          own chop-shop — and you brought the kid's rig and the farm run both."
          [She picks up one of the gang's spent spike-coils, turns it over,
          sets it down.] "That's the whole fix, in your hand. `talk` to me and
          let me settle up before the lot fills with riders who heard."
        completion:
          type: talk_to_npc
          npc: "Ria Tann"
        npc_complete: >
          "Here's the contract advance — the credits I'd set by to make that
          farm run myself, and worth more spent on the gang losing than on me
          driving. The kid'll have her rig back inside a week, the farms get
          their bacta, and the Dust Wheelers spent their enforcer and their
          outrider's nerve to lose the one race that paid. The circuit
          remembers a hand like that. Independents are already back at the
          start gates this morning — first clean board in a year. You've a
          mechanic's word on the outskirts now, and out here that's worth more
          than a fast rig: when a gang spikes an honest run, there's a name
          they send for. Mind the road back into town."
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The fix on the outskirts circuit breaks and the independents ride
          clean again, the stranded farm run reaching the moisture farms whole.
          A hand that takes a gang's spike off an honest rig has a way of being
          sent for — the speeder lanes carry a name now, the way the dust
          carries everything on Tatooine.

  # ─────────────────────────────────────────────────────────────────────
  # GENERALIZED QUESTLINE #11 (T3.24): "The Hollow Crew" — the ELEVENTH
  # accessible (non-t5, non-tutorial) kind: questline chain, and the FIRST
  # set on GEONOSIS. Eleventh distinct skill spread: ALIEN SPECIES +
  # DROID PROGRAMMING (none of the prior ten uses either) — the first
  # accessible arc to reward the xeno-knowledge / droid-tech build. The
  # CIS droid foundry stays entirely OFF-STAGE: the trader buys
  # decommissioned foundry-OVERRUN labor droids (surplus units sold off
  # cheap), and the whole arc runs on the faction-neutral Stalgasin
  # offworlder surface + the deep-hive market — the war kept offstage the
  # way every prior accessible arc keeps the Republic/Clone-War offstage.
  # NO new engine code, slot, event type, schema migration, reward faucet,
  # or map-coordinate/exit-graph change — pure additive content per
  # quest_expansion_postlaunch_path_v1.md.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: geonosis_offworld_hollow_crew
    chain_name: "The Hollow Crew"
    description: >
      In the Stalgasin offworld quarter — the dusty walk-up sprawl where
      the spacers, salvagers, and contract crews who get stuck on Geonosis
      wait out their business — a Sullustan trader named Nuva Sehl makes an
      honest living off the foundry's leavings: she buys decommissioned
      labor droids out of the foundry overruns, rebuilds them on her bench,
      and sells honest work-crews to the mining and moisture outfits that
      pass through. Lately every crew she sells goes wrong the same way — a
      tenday after the sale the droid walks off on its own in the night and
      turns up back in the offworld quarter, stripped of whatever it was
      carrying. A scrap-gang that calls itself the Reclaimers has been
      burying a hidden recall-string in her rebuilt cores: sold honest, the
      droid wakes on a timer and walks its new owner's cargo straight to the
      gang. Her name on the quarter is mud, the buyers think she runs the
      racket, and the Geonosian drone-caste broker who sells her the
      overruns has stopped dealing with an offworlder whose droids "walk" —
      cutting off every salvager in the quarter who lives on cheap labor.
      Read the hive broker right and re-open the channel, crack a walked
      droid to pull the gang's string and find them, stand off the enforcer
      who comes when his crew goes quiet, and give the offworld quarter back
      an honest bench. A freelance favor — open to anyone, no faction
      required.
    archetype_label: "Freelance Salvage Favor"
    faction_alignment: independent
    starting_zone: geonosis_surface
    starting_room: stalgasin_offworld_quarter
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["hollow_crew_freed"]
      drop_room: stalgasin_offworld_quarter
      follow_up_hint: >
        The recall-string comes out of every core the gang ever touched, and
        the walked crews stop walking; the droids Nuva Sehl already sold
        stay sold, working honest for the outfits that bought them. The hive
        broker re-opens the overrun channel the day his drones stop tracking
        her droids back to the Reclaimers, and the offworld quarter takes her
        name out of the mud. Word runs the offworlder camps the way it runs
        nowhere the war touches — there's a hand who can pull a buried string
        out of a stolen droid and walk down the crew that planted it — and
        the salvagers buy crews off her bench again without checking over
        their shoulders.

    steps:
      - step: 1
        title: "The Walking Crews"
        location: stalgasin_offworld_quarter
        npc: "Nuva Sehl"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Nuva Sehl in the Stalgasin Offworld Quarter on Geonosis."
        npc_intro: >
          [A small, jowled Sullustan woman looks up from a half-gutted labor
          droid clamped to a workbench under a dust-tarp, a core-reader in one
          hand and a row of pulled memory cores laid out beside it like
          spent shells.] "Offworld and looking for a work-crew? You came to the
          right bench and the wrong season. Nuva Sehl — I buy the foundry's
          throwaway labor droids, rebuild them honest, and sell crews to the
          outfits passing through. Or I did. Every crew I've sold these two
          months walks off in the night a tenday after the sale, strolls back
          to this quarter, and turns up stripped of whatever its new owner had
          it hauling. The whole offworld camp thinks I'm running the theft. I'm
          not — somebody's reflashing my cores. `talk` to me and I'll show you
          what they put in them."
        completion:
          type: talk_to_npc
          npc: "Nuva Sehl"
        npc_complete: >
          [She turns one of the pulled cores so its read-out faces you — a
          clean rebuild, her own work, with a foreign block of command
          buried under the labor routines.] "A recall-string. Sleeps through
          the sale, wakes on a timer, and walks the droid — and the cargo —
          straight back to a scrap-gang that calls itself the Reclaimers. I
          can read that it's there. I can't crack it, I can't prove who wrote
          it, and I can't find where the droids walk to. Two things stand in
          my way. The Geonosian who sells me the overruns has stopped dealing
          — his caste won't trade with an offworlder whose droids 'walk,' and
          without his channel I'm finished and so's every salvager out here.
          And the gang's crew is somewhere in this quarter I can't reach.
          Start at the hive market — make the broker hear you out, and his
          drones have been tracking my droids; they'll know where they go."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Hive Interior Market and use your `alien species` skill to read the Geonosian drone-caste broker right, re-open the overrun channel, and learn where the walked droids return — `chain attempt`."

      - step: 2
        title: "The Broker's Caste"
        location: geonosis_hive_market
        npc: "(none)"
        npc_role: contact
        teaches: ["alien species"]
        objective: "Read the Geonosian drone-caste scrap-broker correctly, re-open the overrun channel, and learn where the walked droids return — an alien species check."
        npc_intro: >
          [The hive interior market is a vaulted gallery of the worker and
          drone caste — clicking, chittering Geonosians trading foundry scrap
          and mineral by signs an offworlder reads at his peril.] The broker
          who sold Nuva Sehl her overruns is here, and he has turned his back
          on her: to the drone caste a being whose machines wander off is a
          being who cannot keep his own hive in order, and they do not deal
          with the disordered. Push him like a human and you lose the channel
          for good. Read him like what he is — the wing-set that means shame
          deflected, the antenna-cant that means a grievance he wants
          answered, not soothed — answer the grievance in the caste's own
          terms, and the disorder becomes the gang's, not hers. Do it right
          and his foragers, who track every machine that crosses their market,
          will tell you where the walked droids go. `alien species`, patient
          and exact — `chain attempt` when you've read him true.
        completion:
          type: skill_check_passed
          skill: "alien species"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [You read the broker the way the caste reads itself — not pleading
          an offworlder's case but naming the disorder where it belongs, with
          the gang that steals foundry-bound droids off the market's own
          ground, and the wing-set eases. The grievance was never with Nuva
          Sehl; it was with machines walking through his market answering a
          string no Geonosian wrote, an offense to a caste that orders its
          whole world by who answers to whom. He re-opens the overrun channel
          with a single folded gesture, and then his foragers, who miss
          nothing that crosses their gallery, sign you the path the walked
          droids take: down to the offworld quarter, to a back room the gang
          rents off the Smuggler's Roost flophouse, where a fresh crew is
          sitting right now waiting on its recall timer.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "The broker's foragers tracked the walked droids to a rented back room at the Smuggler's Roost Flophouse — get there and use your `droid programming` skill to crack a sitting droid, pull the gang's recall-string, and trace it to them — `chain attempt`."

      - step: 3
        title: "The Buried String"
        location: smugglers_roost_flophouse
        npc: "(none)"
        npc_role: contact
        teaches: ["droid programming"]
        objective: "Crack a walked droid in the gang's rented back room, pull the buried recall-string, and trace it to the gang's compound — a droid programming check."
        npc_intro: >
          [Vez Garra, who runs the Smuggler's Roost and learned long ago not
          to comment on what her tenants store in the back rooms, rents the
          gang a windowless cell off the flophouse — and there it is: a freshly
          walked labor droid, powered down on its haunches in the dark,
          waiting out its recall timer with a moisture-outfit's cargo still
          slung on its frame.] This is the gang's whole racket in one machine.
          Crack its core and the recall-string is right where Nuva Sehl said —
          but the string is the door, not the prize: written into it is the
          master-core address the droid walks home to, the gang's own node
          out in the outsider compound, and the signature of the hand that
          wrote it. Pull the string clean, copy the address, and reflash the
          droid honest while you're in its head, and you walk out with the
          proof, the location, and one crew member the gang will never get
          back. `droid programming`, careful in a sleeping core — `chain
          attempt` when you're into it.
        completion:
          type: skill_check_passed
          skill: "droid programming"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [The core opens to you and the buried string lies there exactly as
          she read it — and threaded through it, the master-core address it
          walks home to: a gang node out in the Stalgasin outsider compound,
          stamped with the write-signature of the hand that planted it. You
          copy the address, lift the signature for proof, and strip the recall
          out of the droid's head, reflashing it honest so it wakes to its
          owner and not to the gang. The droid stirs, finds its own routines
          where the string used to be, and stands down quiet. But pulling its
          string drops it off the gang's own roster the instant they next
          count — and the address in your hand points straight at the compound
          where the man who keeps that roster is going to come looking for
          whoever just made one of his crew stop answering.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "You've pulled the string and traced the gang to the Stalgasin Outsider Compound — get out there. Their enforcer Vossk Rhal will come when his crew goes quiet; stand him off — `attack`, `dodge`."

      - step: 4
        title: "The Outsider Compound"
        location: stalgasin_outsider_compound
        npc: "Vossk Rhal"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Stop Vossk Rhal at the gang's node in the Stalgasin Outsider Compound and break the recall racket — `attack`, `dodge`."
        npc_intro: >
          [The outsider compound is a walled scrap-yard of cannibalized droids
          and stacked foundry reject — the Reclaimers' turf — and standing over
          the gang's master-core node with one of the walked crew gone dark
          beside him is a heavy-scaled, slit-eyed Trandoshan in a welder's
          apron, a blaster on his hip and a cutting-spanner in one clawed
          hand.] Vossk Rhal, the gang's enforcer — the hand whose write-
          signature is on every buried string, the one who came to the node
          the moment a crew member stopped answering his roster. He reads the
          reflashed droid you walked in behind, and the easy contempt of a
          being who steals with a buried command and never has to fight for it
          goes flat. "You're the one pulling my strings out of my droids,
          offworlder. That's gang property you reflashed — every core in this
          quarter answers to me, and so will you, in pieces. Should've stayed
          on your ship." [He thumbs the blaster up off his hip.]
        completion:
          type: combat_won
          enemy_template: "hollow_crew_enforcer"
          enemy_count: 1
        npc_complete: >
          [Vossk Rhal goes down among the cannibalized droids he built his
          racket on, the cutting-spanner ringing off the compound wall, and the
          rest of the Reclaimers — a scrap-crew that steals precisely so it
          never has to stand in a fair fight — scatter over the back wall
          rather than answer for an enforcer who just lost in his own yard. The
          gang's master-core node sits open beside him, the whole recall racket
          spelled out in it: every buried string, every walked crew, every
          address the droids were told to walk home to. Pull the node and the
          strings die with it — the droids the gang already turned stay turned
          back, and the crews still on Nuva Sehl's bench will sell honest. The
          write-signature on the node matches the one you lifted off the
          flophouse droid; that's the proof that clears her name in the
          quarter. Nothing between here and her bench but the walk back, the
          dead node under your arm and a reflashed droid trailing you home.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The enforcer's down, the node's pulled, and you've got the proof and a freed droid — carry it back to Nuva Sehl in the Stalgasin Offworld Quarter."

      - step: 5
        title: "An Honest Bench"
        location: stalgasin_offworld_quarter
        npc: "Nuva Sehl"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Nuva Sehl with the gang's master-core node and the freed droid."
        npc_intro: >
          [Nuva Sehl comes out from under the dust-tarp before you've crossed
          the quarter, reading the dead master-core node under your arm and the
          reflashed droid walking honest at your heel — and the broken
          cutting-spanner you've brought back with them.] "You read the broker
          true, cracked their string out of a sitting droid, and walked Vossk
          Rhal down in his own yard — and you pulled their whole node and
          brought one of my crew home awake." [She turns the node over, reads
          the write-signature stamped across it, and sets it down beside her
          row of spent cores.] "That signature clears my name in this quarter
          and damns theirs. `talk` to me and let me settle up before the camp
          hears their bench is honest again."
        completion:
          type: talk_to_npc
          npc: "Nuva Sehl"
        npc_complete: >
          "Here's the fee — the credits I'd set by to buy my way off this rock
          if the racket finished me, and worth a great deal more spent on the
          Reclaimers finished instead. The strings die with their node, the
          crews I already sold stay honest, and the broker's channel is open
          the moment his foragers stop tracking my droids anywhere but to work.
          The offworld quarter's a hard posting and a small one, and it
          remembers a hand that pulled a buried string out of a stolen droid
          and gave a salvager her bench back. When somebody out here finds
          their machines answering a command they never wrote, there's a name
          they'll send for now. Mind the dust on the walk to the pad."
        # graduation closes the arc; no extra on-completion side effects.
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The recall racket dies with the gang's node and the offworld quarter
          buys honest crews off Nuva Sehl's bench again, the hive broker's
          overrun channel open and the walked droids working where they were
          sold. A hand that pulls a buried string out of a stolen droid has a
          way of being sent for — the offworlder camps carry a name now, in the
          one corner of Geonosis the war hasn't reached.

  # ─────────────────────────────────────────────────────────────────────
  # GENERALIZED QUESTLINE #12 — "The Driven Herd" (kamino_driven_herd)
  # ─────────────────────────────────────────────────────────────────────
  # The TWELFTH accessible (non-t5, non-tutorial) `kind: questline` chain,
  # and the FIRST set on KAMINO. Twelfth distinct skill spread: BEAST
  # RIDING + SWIMMING (none of the prior eleven uses either) — the FIRST
  # accessible arc whose spread includes a STRENGTH skill (swimming) and
  # the FIRST to reward BEAST RIDING: the physical creature-handler /
  # rider-and-swimmer build. The Tipoca City cloning facility and the clone
  # army stay entirely OFF-STAGE: the whole arc runs on the faction-neutral
  # fauna-and-spacer margins of the open-ocean platforms — the war kept
  # offstage the way every prior accessible arc keeps the Republic/Clone-War
  # offstage. New story shape: breaking a wildlife-poaching racket / rescuing
  # a driven herd (no prior accessible arc touches fauna). NO new engine
  # code, slot, event type, schema migration, reward faucet, or
  # map-coordinate/exit-graph change — pure additive content per
  # quest_expansion_postlaunch_path_v1.md.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: kamino_driven_herd
    chain_name: "The Driven Herd"
    description: >
      On the storm-lashed ocean platforms of Kamino — out past the Tipoca
      City cloning halls, on the open-water margin where the offworld
      outfits and the aiwha stable live — a Nautolan keeper named Neyla Sur
      tends the working aiwha that ferry rider-and-cargo crossings between
      the storm-separated pylons, and doctors the foundered beasts the
      squalls bring in. For a season a poacher has worked her string: in the
      worst of the squalls he sounds a stolen Kaminoan herd-call goad that
      panics the aiwha off their roost and scatters them into the open swell,
      where his crew nets the foundered ones and crates them — under the
      city's sensor umbrella and off the logs — for off-world collectors who
      pay a fortune for a thing that flies and swims. The aiwha his crew
      don't reach drown out in the dark water; the string thins one squall
      at a time, and the platform outfits that cross by aiwha are stranded.
      Gentle one of the driven beasts and ride it out to find where the herd
      was taken, dive the poacher's submerged net-pen and cut the foundering
      aiwha free before they drown, stand off the poacher when he comes back
      to an empty pen, and give the platforms their herd back. A freelance
      favor — open to anyone, no faction required.
    archetype_label: "Freelance Beast-Keeper's Favor"
    faction_alignment: independent
    starting_zone: kamino_ocean_platform
    starting_room: kamino_aiwha_stable
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["driven_herd_freed"]
      drop_room: kamino_aiwha_stable
      follow_up_hint: >
        The poacher's goad goes silent and his pen stays cut; the aiwha he
        crated breach back to the roost and the ones his crew never reached
        stop drowning unnoticed in the swell. Neyla Sur's string fills again,
        and the platform outfits cross the storm-separated pylons by aiwha
        the way they did before the squalls turned into a harvest. Word runs
        the ocean platforms the way it runs nowhere the war touches — there's
        a rider who can gentle a driven beast and a diver who can cut a
        drowning herd loose and walk the poacher down — and the keeper hires
        her crossings out again without counting the roost in the morning to
        see who's gone.

    steps:
      - step: 1
        title: "The Thinning String"
        location: kamino_aiwha_stable
        npc: "Neyla Sur"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Neyla Sur at the Aiwha Stable on Kamino's ocean platform."
        npc_intro: >
          [A lean, sea-green Nautolan woman looks up from a foundered aiwha
          she is doctoring on the stable's open deck, the rain beading on her
          bound head-tresses, a coil of cut net over one shoulder.] "Offworld
          and looking for a crossing? You came to the right stable and the
          wrong season. Neyla Sur — I keep the aiwha that ferry the outfits
          between the pylons, and I doctor the ones the squalls break. Or I
          did. There's a poacher working my string. Every bad squall he scatters
          the herd into the swell and his crew nets the foundered ones and
          crates them off the logs for some collector off-world. The ones they
          miss drown. My string's half what it was and the platforms can't
          cross. `talk` to me and I'll show you what he leaves in the water."
        completion:
          type: talk_to_npc
          npc: "Neyla Sur"
        npc_complete: >
          [She lifts the coil off her shoulder and runs the cut end through her
          webbed hands — net-cord sheared clean, not torn.] "His pen's nets.
          One of my aiwha came home dragging this through the swell with a
          crate-line still on it before it foundered. He sounds a stolen
          Kaminoan herd-call goad in the squalls — panics the beasts off the
          roost, scatters them where his crew can net them under the city's
          sensor shadow, off every log. Three things stand between me and
          stopping him, and I can't do one of them. There's a driven aiwha
          foundering off the ocean-surface platform right now, too spooked to
          come in — gentle it, ride it out across the swell, and it'll take you
          to where the herd was driven. Start there. I haven't the seat for a
          storm-swell, and the platforms haven't the time."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Ocean Surface Platform and use your `beast riding` skill to gentle the driven aiwha foundering in the swell and ride it out to where the poacher took the herd — `chain attempt`."

      - step: 2
        title: "The Driven Beast"
        location: kamino_ocean_surface
        npc: "(none)"
        npc_role: contact
        teaches: ["beast riding"]
        objective: "Gentle the driven aiwha foundering off the ocean-surface platform and ride it out across the storm-swell to find where the herd was taken — a beast riding check."
        npc_intro: >
          [At ocean level the swells stand four meters on a calm day and this
          is not a calm day; the city rises overhead on its pylons like an
          artificial cliff, and out past the platform's edge a single aiwha
          wallows half-foundered in the swell, wings beating ragged, too
          panicked from the goad to come in and too spent to fly clear.] No
          Kaminoan ever taught a clone to approach an aiwha, and the swell
          will drown a rider who fights the beast instead of reading it. Come
          in low and slow, match the wallow, put a hand where it can feel you
          are not the sound that scattered it — gentle the panic out of it,
          take the seat, and let it carry you where the herd's instinct says
          the rest were driven: down under the pylons, to the sensor-shadowed
          dock where the poacher pens his catch. `beast riding`, patient
          against a panicked beast in a heavy sea — `chain attempt` when you've
          gentled it and taken the seat.
        completion:
          type: skill_check_passed
          skill: "beast riding"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [The panic goes out of the aiwha under your hand the way a held breath
          lets go — it stops fighting the swell, folds its great wings to the
          wallow, and lets you take the seat behind its head-crest. You turn it
          with the swell instead of against it and it knows at once where you
          mean to go: it banks down under the lip of the platform, slides along
          the pylons through the electromagnetic murk that hides the dock from
          the city's sensors, and brings you in beneath the Unauthorized Docking
          Point — and there it is, lashed to the underside of the dock and half
          drowned in the dark water: the poacher's net-pen, crates stacked on
          the deck above it and, below the waterline, a knot of netted aiwha
          fighting the strands for the air they can't reach. The beast under you
          shudders at the sound of them. The crates wait on the tide for a ship;
          the netted herd does not have until the tide.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "The driven aiwha carried you under the city to the poacher's net-pen beneath the Unauthorized Docking Point — get there and use your `swimming` skill to dive the flooded pen and cut the foundering aiwha free before they drown — `chain attempt`."

      - step: 3
        title: "The Drowning Pen"
        location: kamino_smuggler_dock
        npc: "(none)"
        npc_role: contact
        teaches: ["swimming"]
        objective: "Dive the poacher's submerged net-pen beneath the dock and cut the netted aiwha free before they drown — a swimming check."
        npc_intro: >
          [The Unauthorized Docking Point hangs beneath the city's sensor
          umbrella, its modified pylon-section quiet and unlogged — and lashed
          to its underside, below the black waterline, is the poacher's pen:
          a knot of net-mesh and crate-lines holding the netted aiwha under,
          where every surge drives them deeper from the air they breach to
          breathe.] Aiwha are air-breathers; netted under, they drown — and
          the strong, panicking ones drown fastest, fouling themselves deeper
          the harder they fight. There's no cutting the pen from the deck;
          you go in the cold dark water after it, find the crate-lines by feel
          in the surge, and cut the mesh from the beasts without being dragged
          under by a panicked half-tonne of aiwha or fouled in your own cut
          net. Free them and they breach for the surface and scatter for the
          open roost; leave one and the tide finishes it. `swimming`, hard
          against a heavy surge in a fouling net — `chain attempt` when you're
          down in it.
        completion:
          type: skill_check_passed
          skill: "swimming"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [You go off the dock into water cold enough to stop the breath, find
          the first crate-line by feel in the surge, and saw the mesh off the
          nearest aiwha a strand at a time while it thrashes for air it can't
          reach — then the next, and the next, working the knot of the pen from
          the outside in, twice nearly dragged under by a freed beast breaching
          for the surface and once fouled in your own cut net before you kick
          clear. One by one they tear loose and breach, the dark water boiling
          white as the freed herd scatters up and out for the open roost, until
          the pen hangs empty and cut, the crate-lines trailing slack in the
          surge. You come up under the dock among the empty mesh — and feel,
          through the pylon, the thud of a boot on the deck above: the poacher's
          pen-line has gone slack on his count, and Korsa Drael has come back
          down to the dock to see who emptied it.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "You've cut the pen and the herd's breaching free — but the poacher Korsa Drael has come back down to the dock to a pen cut empty. Stand him off — `attack`, `dodge`."

      - step: 4
        title: "The Empty Pen"
        location: kamino_smuggler_dock
        npc: "Korsa Drael"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Stop Korsa Drael at the dock and break the poaching racket — `attack`, `dodge`."
        npc_intro: >
          [You haul out of the black water onto the dock and he is already
          there at the head of the stacked crates — a weathered, leather-skinned
          Weequay in a sealed slicker, the stolen herd-call goad slung across
          his back, a blaster coming up off his hip — reading the cut pen and
          the freed aiwha breaching off into the swell.] Korsa Drael, the
          poacher — the hand who sounds the goad in the squalls, the one who
          came back down the moment his pen-line went slack on the count. The
          bored contempt of a being who poaches by remote sound and never has
          to fight for it goes flat. "That's a season's work breaching off into
          the dark on your account, diver. The herd's my catch and this dock's
          mine — should've stayed up top where the rain can't reach you. You go
          out in the nets they just left empty." [He thumbs the blaster up.]
        completion:
          type: combat_won
          enemy_template: "driven_herd_poacher"
          enemy_count: 1
        npc_complete: >
          [Korsa Drael goes down on the dock among his own empty crates, the
          stolen goad clattering off into the dark water, and the net-crew that
          works for him — a poaching gang that nets drowning beasts precisely so
          it never has to stand in a fair fight — scatters for its ship rather
          than answer for a poacher who just lost on his own dock. The goad sinks
          where it fell, and with it the only sound that could scatter the herd;
          the crates on the deck stand empty, their catch breaching free in the
          swell. Take the cut pen-line and the goad's broken sling for the
          keeper — the proof that the racket worked her string and not she
          herself — and there's nothing between here and the stable but the ride
          back up through the pylons, a gentled aiwha under you and a freed herd
          scattering for the open roost behind.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The poacher's down, his goad's in the deep, and the herd's breaching free — ride back up to Neyla Sur at the Aiwha Stable."

      - step: 5
        title: "The Full Roost"
        location: kamino_aiwha_stable
        npc: "Neyla Sur"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Neyla Sur with the cut pen-line and word that the poacher is down."
        npc_intro: >
          [Neyla Sur is already out on the stable deck when you bring the
          gentled aiwha in, reading the freed herd scattering for the roost
          behind you and the cut pen-line and the goad's broken sling in your
          hands.] "You gentled a driven beast and rode it out, cut my herd loose
          from his pen before the tide took them, and put Korsa Drael down on
          his own dock." [She turns the cut net-cord over in her webbed hands,
          reads where it was sheared, and sets it beside the coil she's kept all
          season as proof.] "His goad's in the deep and his pen's cut, and the
          aiwha he crated are breaching home where I can count them. `talk` to
          me and let me settle up before the roost fills back in."
        completion:
          type: talk_to_npc
          npc: "Neyla Sur"
        npc_complete: >
          "Here's the fee — the credits I'd set by to buy my way off this rock
          if the racket finished my string, and worth a great deal more spent on
          the poacher finished instead. The goad's silent, the pen's cut, and
          the herd that drowned a beast a squall stays in the swell where it
          belongs. The ocean platforms are a hard posting and a small one, and
          they remember a rider who gentled a driven beast and a diver who cut a
          drowning herd loose. When somebody out here finds their string going
          quiet in the squalls, there's a name they'll send for now. Mind the
          rain on the ride up to the pad."
        # graduation closes the arc; no extra on-completion side effects.
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The poaching racket dies with the goad in the deep and the ocean
          platforms cross by aiwha again, the keeper's string filling back to
          the roost and the squalls turned back into weather instead of a
          harvest. A rider who can gentle a driven beast and a diver who can cut
          a drowning herd loose has a way of being sent for — the ocean
          platforms carry a name now, in the one corner of Kamino the war hasn't
          reached.

  # ─────────────────────────────────────────────────────────────────────
  # GENERALIZED QUESTLINE — "The Condemned Hull" (kuat_condemned_hull)
  # T3.24 thirteenth accessible (non-t5, non-tutorial) kind:questline chain.
  # The SECOND arc set on Kuat (after "The Skimmed Line"), on a FRESH FACE of
  # the Drive Yards — the customs/cert front + the independent berths + the
  # supply station + the Ileu strip-berth; reuses NONE of the Skimmed Line's
  # cantina/machine-shops/warehouses/factories rooms. Thirteenth DISTINCT skill
  # spread: SPACE TRANSPORT REPAIR (Technical) + ASTROGATION (Mechanical) — the
  # FIRST accessible arc to reward the spacer ENGINEER-NAVIGATOR build (neither
  # skill used by any prior arc). New story shape: a ship-condemnation /
  # certification-fraud racket — a corrupt KSF cert-inspector plants a drive
  # fault and falsifies the jump-cert to condemn honest independent freighters
  # as unspaceworthy scrap, which a chop-crew then buys cheap and strips — beaten
  # by ENGINEERING the proof: survey the sealed drive to find the planted fault
  # (space transport repair), re-run the condemned jump to prove the nav sound
  # and the cert cooked (astrogation), trace the condemned hulls to the strip-
  # berth's buy-ledger and stand off the enforcer (combat), and get the
  # condemnation overturned. Reuses the live questline engine (kind:questline +
  # active_questline + existing event types + the four reward funnels) with NO
  # new engine code, no new slot/event type, no schema migration, no new reward
  # faucet, and NO map-coordinate or exit-graph change.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: kuat_condemned_hull
    chain_name: "The Condemned Hull"
    description: >
      On the Kuat Drive Yards orbital ring — out past the great Republic
      drydocks, on the customs-and-cert front where the independent freighters
      put in for the inspection that lets them keep flying — a Verpine
      engineer-captain named Veelo Trinn sits grounded beside a freighter that
      is not broken. A KSF cert-inspector condemned the Resin Wing's hyperdrive
      as unspaceworthy and cooked her jump-cert to match, sealed the drive bay
      so her owner can't legally touch it to argue, and posted the hull for
      forced sale as scrap — where, a week later, the same handful of buyers
      take it for a song and strip it at a leased Ileu berth. It is not the
      first honest hull he has condemned and it will not be the last; the
      racket runs on a sealed drive nobody is allowed to open and a cert nobody
      bothers to re-run. Trinn is a master of the drive and a master of the
      jump, but the seal is the one thing her own hands are barred from, and
      the chop-crew is past anything an engineer can argue. Survey the sealed
      drive and find the fault the inspector planted, re-run the jump he swore
      she could never make, trace the condemned hulls to the berth that strips
      them, stand off the crew that came when you pulled their ledger, and get
      an honest captain her ship and her cert back. A freelance favor — open to
      anyone, no faction required.
    archetype_label: "Freelance Ship-Surveyor's Favor"
    faction_alignment: independent
    starting_zone: kuat_main_spaceport
    starting_room: kuat_customs_checkpoint
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["condemned_hull_cleared"]
      drop_room: kuat_customs_checkpoint
      follow_up_hint: >
        The independent survey overturns the condemnation: the planted
        phase-fault and the cooked jump-cert go on the record, the Resin Wing's
        seal comes off, and the cert-inspector's name comes off the duty
        roster a great deal faster than the racket took to build. The chop-crew
        that lived on a steady feed of condemned hulls finds the feed cut and
        scatters for a friendlier ring, and the buy-ledger you pulled turns
        every "scrap" sale of the season back into a theft on the record. Word
        runs the independent berths the way it never runs the corporate ones —
        there's a surveyor who'll crack a crooked seal and re-run a cooked
        cert and put it on paper, and stand on the berth when the crew comes —
        and the captains who've watched an honest hull condemned out from under
        them stop flying the ring afraid of the inspection that was supposed to
        keep them safe.

    steps:
      - step: 1
        title: "The Grounded Wing"
        location: kuat_customs_checkpoint
        npc: "Veelo Trinn"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Veelo Trinn at the KSF Customs Checkpoint on the Kuat Drive Yards ring."
        npc_intro: >
          [A tall, narrow Verpine in a grease-darkened ship-suit stands at the
          customs rail beside a sheaf of flimsi condemnations, the chitin of her
          long fingers ticking against the rail in the steady way her species
          thinks out loud, her freighter visible past the viewport with a KSF
          seal welded across its drive bay.] "Offworld, and put in for your
          cert? Then put in somewhere else this season, while you still can.
          Veelo Trinn — I built the drive on that hull and I plot her own jumps,
          and a KSF inspector just condemned her as scrap. The drive's sound. I
          know it's sound the way you know your own hand. But he sealed the bay,
          and the day they seal it the owner can't lay a tool on it without
          forfeiting the hull — so I can't open my own drive to prove him a liar.
          `talk` to me and I'll show you how the racket runs."
        completion:
          type: talk_to_npc
          npc: "Veelo Trinn"
        npc_complete: >
          [She lays the condemnation flat on the rail and runs a chitinous
          finger down it — a planted-fault citation and a failed jump-cert,
          both signed by the same inspector.] "Two lies on one page. He logged
          a phase-fault in the hyperdrive that isn't there — and to make a
          fault stick he had to put one there, under the seal where only he's
          been. And he failed her jump-cert: swore on the record her
          astrogation can't safely plot the runs she's flown for nine years.
          A week from now the Resin Wing posts for forced sale as scrap, and
          the same buyers who took the last four condemned hulls take her for a
          song and strip her at an Ileu berth. I can't touch the seal and I'm
          no hand in a fight. But a freelance surveyor with no stake in the
          hull CAN crack the seal to survey it — that's a contest, not
          tampering. Go to her berth at the Deporin yard, get under the seal,
          and find me the fault he planted. Then we'll have the first of the
          two lies on paper."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Deporin Shipyards berth where the Resin Wing is grounded, crack the KSF seal to survey the sealed hyperdrive, and find the planted fault — use your `space transport repair` skill, then `chain attempt`."

      - step: 2
        title: "The Planted Fault"
        location: kuat_deporin_shipyards
        npc: "(none)"
        npc_role: contact
        teaches: ["space transport repair"]
        objective: "Crack the KSF seal on the Resin Wing's drive bay at the Deporin berth and survey the hyperdrive to find the planted fault — a space transport repair check."
        npc_intro: >
          [The Resin Wing sits cold in an independent Deporin berth with a KSF
          condemnation seal welded across the drive bay, the kind of seal whose
          whole purpose is that the owner never gets to argue with what's behind
          it.] A condemned-as-scrap drive is supposed to be a wreck; this one is
          a Verpine's life's work, every line dressed and labeled, and somewhere
          in it is a fault that was put there by a hand that doesn't build drives
          for a living. Crack the seal as the independent surveyor a contest
          allows, open the hyperdrive, and read it the way the inspector counted
          on no one reading it: trace the phase-regulator he cited, find where a
          sound part was made to read faulted — a shimmed coupling, a swapped
          calibration chip, a fault a builder would never leave and only a
          saboteur would plant. `space transport repair`, careful work against a
          drive dressed to lie — `chain attempt` when you're down in it.
        completion:
          type: skill_check_passed
          skill: "space transport repair"
          difficulty: 12
          on_fail: "retry_allowed"
        npc_complete: >
          [You crack the seal, lift the drive cover, and the Resin Wing is
          exactly what Trinn said — a sound hyperdrive in tournament order, with
          one wrong thing in it. The phase-regulator the inspector condemned
          reads faulted on the panel, but pull the housing and it's a swapped
          calibration chip riding a shimmed coupling: a good regulator made to
          fail its self-test by a hand that knew precisely which reading a
          condemnation needs. Pocket the swapped chip and the shim — the
          inspector's own planted fault, the part number stamped to a yard he
          buys from off the books — and the drive, with its real chip back in,
          spins up sweet on the first try. The first lie is on paper now, and in
          your pocket. There's still the cert he cooked: he swore her
          astrogation couldn't make the jump she's flown for years, and that
          lie is re-run at a nav console, not under a seal.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "You've pulled the planted fault — now the inspector's other lie, the cooked jump-cert. Go to the Supply Space Station's nav console and re-run the condemned jump to prove her astrogation sound — use your `astrogation` skill, then `chain attempt`."

      - step: 3
        title: "The Cooked Cert"
        location: kuat_supply_station
        npc: "(none)"
        npc_role: contact
        teaches: ["astrogation"]
        objective: "Re-run the condemned jump-cert at the Supply Space Station nav console to prove the Resin Wing's astrogation sound and the cert falsified — an astrogation check."
        npc_intro: >
          [The Supply Space Station's open nav console looks out on the same
          star-field the Resin Wing's cert was failed against — the standard
          ring-to-Outer-Rim runs she's flown clean for nine years, that an
          inspector swore on the record her astrogation could no longer safely
          plot.] A cooked cert is a subtle lie: you don't claim a jump is
          impossible, you claim the margin's gone — that her nav can't hold the
          tolerance the run needs anymore, so the safe answer is to ground her.
          Re-run it honestly. Pull her flight logs, plot the condemned jump
          fresh against the real mass-shadows and the live hazard tables, and
          read the margin the inspector buried: either her astrogation makes the
          run inside tolerance — and his cert is a fabrication — or it doesn't,
          and Trinn's wrong about her own ship. `astrogation`, an honest plot
          against a dishonest one — `chain attempt` when you've run the numbers.
        completion:
          type: skill_check_passed
          skill: "astrogation"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [You pull the Resin Wing's logs and plot the condemned run fresh, and
          the numbers come up exactly where nine clean years said they would:
          her astrogation holds the run well inside tolerance, margin to spare,
          on the same hazard tables the inspector certified her against last
          year and failed her against this one with not one mass-shadow changed.
          The cert isn't a close call gone the wrong way — it's a fabrication,
          a margin written down to fail a ship that plots better than half the
          corporate hulls on the ring. Stamp the honest plot, log it beside the
          swapped chip in your pocket, and the inspector's two lies are both on
          paper now. The only thing left is where the condemned hulls go: the
          Ileu strip-berth the last four were broken at, where a buy-ledger ties
          every "scrap" sale of the season back to one crew — and where that
          crew will be when an independent survey starts pulling their feed
          apart.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "Both lies are on paper — now the crew that profits. Go to the Ileu Shipyards strip-berth, pull the buy-ledger tying the condemned hulls to one buyer, and stand off the enforcer who comes for it — `attack`, `dodge`."

      - step: 4
        title: "The Strip Berth"
        location: kuat_ileu_shipyards
        npc: "Bohrus Kang"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Pull the chop-crew's buy-ledger at the Ileu strip-berth and stop Bohrus Kang when he comes for it — `attack`, `dodge`."
        npc_intro: >
          [The leased Ileu berth is a graveyard of honest hulls: four condemned
          freighters in mid-strip, their drives — every one of them sound —
          pulled and racked for resale, and on the foreman's stand a buy-ledger
          that ties every "scrap" sale of the season to one crew and one
          inspector's signature. You have it in hand when the berth's enforcer
          comes off the gantry: a heavy, slab-shouldered Houk in a stripper's
          rig, a hull-cutter's vibro-axe in his fists, reading the pulled ledger
          and the surveyor holding it.] Bohrus Kang — the muscle who keeps the
          strip-berth quiet, who never had to lift the axe at an owner because
          the seal and the cert did the taking for him. The bored calm of a
          being whose racket runs itself goes flat. "That ledger's berth
          property, surveyor, and so's everything you just read off it. The
          hulls come to us condemned, fair and legal, and what's on that stand
          stays on it. Put it down and walk, or go on the rack with the rest of
          the scrap." [He sets the axe.]
        completion:
          type: combat_won
          enemy_template: "condemned_hull_enforcer"
          enemy_count: 1
        npc_complete: >
          [Bohrus Kang goes down among the gutted hulls and the racked drives,
          the vibro-axe ringing off the berth deck, and the strip-crew that
          works the condemned freighters — a chop-gang that lived on a seal
          nobody opened and a cert nobody re-ran — scatters for its skiff rather
          than answer for a racket pulled apart on its own berth. The buy-ledger
          stays in your hand: every condemned hull of the season, every "scrap"
          price, every sale tied back to one inspector's signature. Take it with
          the swapped chip and the honest plot — the three things together that
          turn a condemnation into a fraud and a fraud into a forfeiture — and
          there's nothing between here and the customs front but the ride back
          to a captain who's been told for a week that the ship she built was
          scrap.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The enforcer's down, the strip-crew's scattered, and you've got the ledger, the planted chip, and the honest plot — go back to Veelo Trinn at the KSF Customs Checkpoint."

      - step: 5
        title: "The Cert Reinstated"
        location: kuat_customs_checkpoint
        npc: "Veelo Trinn"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Veelo Trinn at the customs front with the planted fault, the honest jump-plot, and the chop-crew's buy-ledger."
        npc_intro: >
          [Veelo Trinn is already at the customs rail when you come back, the
          chitin of her fingers gone still for the first time as she reads the
          swapped chip, the stamped honest plot, and the buy-ledger laid out in
          front of her.] "The fault he planted, the jump he cooked, and the
          ledger that says where my ship was going to go." [She lifts the
          swapped calibration chip to the light and reads the off-books part
          number stamped on it, and something that has been wound tight for a
          week lets go.] "Nine years I've flown her clean and a week ago a man
          with a seal told me I'd built scrap. `talk` to me and let me file
          this before he hears his berth went quiet."
        completion:
          type: talk_to_npc
          npc: "Veelo Trinn"
        npc_complete: >
          "Here's your fee — and worth ten times the credits to me to hand it
          to the surveyor who cracked his seal instead of to the chop-crew who'd
          have stripped my drive by now. An independent survey overturns a
          condemnation; two lies on paper and a buy-ledger overturn the
          inspector. The seal comes off the Resin Wing tonight and his name
          comes off the roster tomorrow, and every captain he grounded this
          season gets a hull and a cert back out of that ledger you pulled. The
          independent berths are a small world and a long-memoried one, and they
          remember the difference between the inspector who condemns an honest
          hull and the surveyor who proves it sound. When a captain on this ring
          finds their cert cooked and their drive sealed, there's a name they'll
          send for now. Fair skies on the way out — yours are clear."
        # graduation closes the arc; no extra on-completion side effects.
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The condemnation is overturned and the racket is on the record: the
          Resin Wing's seal comes off, the cert-inspector's name comes off the
          roster, and a season of honest hulls condemned as scrap turns back
          into a theft the buy-ledger can prove. A surveyor who can crack a
          crooked seal, re-run a cooked cert, and stand on the berth when the
          crew comes has a way of being sent for — the independent berths of
          the Kuat ring carry a name now, on the one front of the Drive Yards
          the war never reaches.

  # ─────────────────────────────────────────────────────────────────────
  # The FOURTEENTH accessible (non-t5, non-tutorial) kind:questline chain,
  # and the FOURTH on Tatooine — on the FREIGHT-HAUL face of the Mos Eisley
  # margins (the power-station trade stop + the town garage + the open desert
  # haul road), reusing NONE of The Crooked Wheel's market, The Dust-Sick's
  # Jundland, or The Sabotaged Run's speeder-circuit rooms. A FREIGHT
  # STRAND-AND-SALVAGE racket — a bigger freight outfit corners the runs to
  # the outlying moisture farms by planting a fault to strand the independents'
  # rigs on the killing ridge stretch, where its recovery crew tows the load
  # off under a salvage lien and buys the missed contract cheap — beaten by
  # WHEELMAN-MECHANIC work: find and clear the planted sabotage before the rig
  # rolls (ground vehicle repair), drive the loaded rig through the ridge the
  # outfit owns without breaking down (ground vehicle operation), stand off the
  # recovery-crew enforcer who comes for the load at the gate (combat), and
  # bring the run in on the window. The FOURTEENTH distinct skill spread
  # (ground vehicle repair + ground vehicle operation), the FIRST accessible
  # arc to reward the groundside hauler — mechanically distinct from The
  # Sabotaged Run's repulsorlift swoop-racer and The Condemned Hull's starship
  # engineer-navigator. Reuses the live questline engine (kind:questline +
  # active_questline + existing event types + the four reward funnels) with NO
  # new engine code, no new slot/event type, no schema migration, no new reward
  # faucet, and NO map-coordinate or exit-graph change.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: tatooine_long_haul
    chain_name: "The Long Haul"
    description: >
      On the dusty margins of Mos Eisley — out at the power station where the
      moisture farmers and the independent haulers gather to recharge and trade
      word — a Sullustan owner-driver named Numi Vesh stands beside a freight
      rig she can't afford to lose and a run she can't afford to miss. A bigger
      freight outfit has spent the season cornering the only paying water-and-
      parts runs to the outlying farms, and not by underbidding: they pay a hand
      to plant a fault in an independent's rig — a fouled coolant line, a shimmed
      bearing — so it strands on the worst stretch of the ridge road, where the
      outfit's own recovery crew is always waiting to tow the load off under a
      salvage lien and buy the missed contract for a song. Two haulers folded
      this season; Numi's driver quit scared a week ago; she has one rig, one
      run, and one delivery window left, and she cannot both wrench the sabotage
      and drive the road and stand off the crew alone. She is a master of the rig
      and the road, but no one being can do all three at once on a road the
      outfit owns. Find and clear the planted fault before the rig rolls, drive
      the loaded rig through the ridge stretch where every independent gets
      stranded, stand on the gate when the recovery crew comes for the load, and
      bring an honest hauler's run in on the window. A freelance favor — open to
      anyone, no faction required.
    archetype_label: "Freelance Hauler's Favor"
    faction_alignment: independent
    starting_zone: tatooine_mos_eisley
    starting_room: power_station
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["long_haul_cleared"]
      drop_room: power_station
      follow_up_hint: >
        The run comes in on the window and the racket comes apart with it: the
        load the recovery crew was paid to tow off as salvage is logged
        delivered, the salvage lien dies on a rig that made its window, and the
        string of "breakdowns" the outfit lived on turns into a string of
        plantings nobody on this road can call an accident anymore. The freight
        outfit that won by making honest rigs fail finds the one thing the racket
        needed — a rig stranding where its crew was waiting — gone, and the
        independents it squeezed off the route start running it again. Word goes
        the haul roads the way it never goes the corporate docks: there's a hand
        who'll wrench a planted fault clear, drive a sabotaged rig through the
        ridge the outfit owns, and stand on the gate when the crew comes — and
        the haulers who watched their loads towed off as salvage stop running the
        road afraid of the breakdown that was never an accident.

    steps:
      - step: 1
        title: "One Rig, One Window"
        location: power_station
        npc: "Numi Vesh"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Numi Vesh at the Power Station on the Mos Eisley outskirts."
        npc_intro: >
          [A short, broad-shouldered Sullustan in a heat-bleached driver's coat
          stands among the merchants and moisture farmers at the recharge stop, a
          coil of coolant line over one arm and a delivery flimsi gone soft at the
          folds in her grease-dark hand, her wide black eyes ringed red from too
          many nights under a rig.] "Hauling something, or just charging up? If
          you haul on this road, find another — while there still is one for the
          independents. Numi Vesh. I own and drive the Sand Loper, run water and
          parts to the far farms, eleven years. A freight outfit's been pushing me
          off the route all season, and not by underbidding. They make sure I
          break down. `talk` to me and I'll show you how the racket runs."
        completion:
          type: talk_to_npc
          npc: "Numi Vesh"
        npc_complete: >
          [She lays the soft delivery flimsi flat on the recharge rail and taps
          the window time stamped on it, then a column of breakdown logs beside
          it — every one on the same stretch of ridge road.] "They don't beat my
          price. They beat my window. Somebody plants a fault in the rig — a
          fouled coolant line, a shimmed bearing — and she dies on the ridge,
          right where the outfit's recovery crew is already parked. They tow my
          load off under a salvage lien and buy my missed contract cheap. Two of
          us folded this season. My driver quit a week ago. I've got one rig, one
          run, and one window left, and I can't wrench the sabotage and drive the
          road and fight that crew all in one trip. But you can. Get to the garage
          before she rolls and find me the fault they planted — there'll be one."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Dewback Stables and Garage where the Sand Loper is staged, find the planted sabotage in the rig, and clear it before the run — use your `ground vehicle repair` skill, then `chain attempt`."

      - step: 2
        title: "The Planted Fault"
        location: dewback_stables_garage
        npc: "(none)"
        npc_role: contact
        teaches: ["ground vehicle repair"]
        objective: "Inspect the Sand Loper at the Dewback Stables and Garage and find and clear the planted fault before the run — a ground vehicle repair check."
        npc_intro: >
          [The Sand Loper sits loaded in a garage bay, a heavy freight rig dressed
          and ready for a long haul — and somewhere in her drivetrain is the
          reason every independent on this road dies on the same ridge.] A rig
          this well-kept doesn't break down twice in a season by chance. The
          outfit's hand has been in here; the fault is planted to read sound until
          the worst possible kilometer of the run. Go over her the way Numi can't
          spare the trip to do herself: pull the coolant line and the bearing
          races the breakdown logs all point to, and find the one wrong thing a
          saboteur left and an owner would never — a fouled line dressed to look
          clean, a bearing shimmed to seize under load and heat. Clear it now and
          the rig that was built to strand on the ridge makes the run instead.
          `ground vehicle repair`, careful work against a rig dressed to fail —
          `chain attempt` when you're under her.
        completion:
          type: skill_check_passed
          skill: "ground vehicle repair"
          difficulty: 12
          on_fail: "retry_allowed"
        npc_complete: >
          [You pull the coolant line and the bearing races the logs kept pointing
          at, and there it is — a coolant line fouled with a slow-clogging grit
          that would read clean cold and choke hot, riding a bearing shimmed a
          hair out of true to seize exactly when the ridge climb loads it. A rig
          built to die at one kilometer and call it wear. Flush the line, pull the
          shim, reseat the bearing true, and the Sand Loper turns over sweet and
          even — a sound rig that was made to fail on schedule. Pocket the shim,
          stamped with a yard mark that isn't Numi's, and the first half of the
          racket is in your hand. The fault's cleared, but clearing it isn't
          making the run: the ridge stretch the outfit owns is still between the
          load and the window, and a sound rig still has to be driven through it.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "The sabotage is cleared — now the run. Drive the loaded Sand Loper through the ridge stretch the outfit owns, the road where every independent gets stranded — use your `ground vehicle operation` skill, then `chain attempt`."

      - step: 3
        title: "The Killing Stretch"
        location: outskirts_hermits_ridge
        npc: "(none)"
        npc_role: contact
        teaches: ["ground vehicle operation"]
        objective: "Drive the loaded Sand Loper through the ridge stretch where the outfit strands the independents and make the delivery window — a ground vehicle operation check."
        npc_intro: >
          [The ridge road runs a high, exposed sandstone shelf with the desert
          falling away for kilometers on one side and the thermal updrafts making
          the air itself dance — the stretch every breakdown log pointed to, the
          place a heavy rig is hardest to hold and easiest to lose, and the place
          the outfit's recovery crew waits.] A sound rig isn't a safe run here. The
          shelf narrows where the loaded weight wants to drift, the heat blooms off
          the rock straight into the drivetrain you just nursed back, and a hauler
          who muscles it wrong puts a wheel over the edge or cooks a bearing the
          honest way. Drive her the way Numi would — read the shelf, hold the line
          the loaded weight fights, keep the temp off the redline through the
          climb, and bring the rig and the load through the one stretch that was
          supposed to strand them. `ground vehicle operation`, a heavy rig on a bad
          shelf against a hard window — `chain attempt` when you've got her through.
        completion:
          type: skill_check_passed
          skill: "ground vehicle operation"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [You hold the Sand Loper to the shelf through the narrows and the climb,
          read the drift before the loaded weight can take it, and keep the temp a
          hair off the redline where the heat blooms worst — and the rig comes off
          the ridge whole and on the clock, past the one kilometer that was built
          to kill the run. Below, where the recovery crew's dust-rig is parked in
          the shade of the rock, you can see a hauler take in the thing the racket
          was never set up to handle: an independent's load coming down off the
          ridge clean, on the window, with a stranger holding the wheel. The strand
          failed. There's nothing between the load and a logged delivery now but the
          eastern gate — and the crew that was paid to tow this load off as salvage
          is already moving to take it the only way left.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "You've driven the ridge and beaten the strand — now the gate. Get the load to the Eastern Gate and stand off the recovery-crew enforcer who comes to take it by force — `attack`, `dodge`."

      - step: 4
        title: "The Gate"
        location: outskirts_eastern_gate
        npc: "Gornt Reska"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Bring the load to the Eastern Gate and stop Gornt Reska when the recovery crew comes for it — `attack`, `dodge`."
        npc_intro: >
          [The eastern gate is the last chokepoint before town and a logged
          delivery — a weathered ferrocrete wall, a gate half-open for years, the
          Jundland shimmering beyond. The recovery crew's dust-rig slews in across
          the road ahead of the Sand Loper, and a heavy, thick-necked Klatooinian
          steps down from it into the gateway, a worn blaster on his hip and a
          tow-hook coiled at his belt, reading the loaded rig that was supposed to
          be his salvage and the driver who brought it in clean.] Gornt Reska —
          the muscle who keeps the outfit's recovery work quiet, who has rarely had
          to draw because a stranded rig and a missed window do the taking for him.
          The bored contempt of a being whose work tows itself goes flat. "That
          load's under a salvage lien, hauler, signed before you turned a wheel. The
          rig strands, we recover — that's the deal on this road. Step off her and
          walk, or go out on the hook with the rest of the strand." [He sets the
          tow-hook down where you can see it and plants himself across the gate.]
        completion:
          type: combat_won
          enemy_template: "long_haul_enforcer"
          enemy_count: 1
        npc_complete: >
          [Gornt Reska goes down in the gateway, the tow-hook ringing off the
          ferrocrete, and the recovery crew that worked the ridge — a tow-gang that
          lived on a planted fault and a missed window — pulls its dust-rig back
          rather than answer at the gate for a racket coming apart in the open road.
          The way to town stands clear. Take the shimmed bearing and the fouled
          line with you — the saboteur's own work, stamped to a yard the outfit
          buys from off the books — and there's nothing between here and the power
          station but the run in, the load logged delivered, and a window made for
          the first time all season.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The enforcer's down, the crew's pulled back, and the road to town is clear — bring the load in on the window and go back to Numi Vesh at the Power Station."

      - step: 5
        title: "On the Window"
        location: power_station
        npc: "Numi Vesh"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Numi Vesh at the Power Station with the run delivered and the planted sabotage in hand."
        npc_intro: >
          [Numi Vesh is already at the recharge rail when you come in, the delivery
          flimsi stamped delivered in front of her and the shimmed bearing and the
          fouled line laid out beside it.] "On the window. First time all season."
          [She turns the shimmed bearing to the light and reads the yard mark
          stamped on it, the mark that isn't hers, and something that has been wound
          tight for a week lets go.] "Eleven years I've run this road honest and a
          season of breakdowns nearly took it. `talk` to me and let me get this on
          the record before the outfit hears its crew came back to town empty."
        completion:
          type: talk_to_npc
          npc: "Numi Vesh"
        npc_complete: >
          "Here's your fee — and worth twice the credits to hand it to the hand
          who drove my run in instead of to a recovery crew that'd have it towed
          and sold by now. A delivered load kills a salvage lien; a planted bearing
          and a missed window's worth of logs kill the racket. The route stays open
          to the independents, and every breakdown the outfit called an accident
          this season is a planting now that the bearing in your hand can prove. The
          haul roads are a small world and a long-memoried one, and they tell the
          difference between the outfit that strands an honest rig and the hand who
          drives it through. When a hauler on this road finds a fault they didn't
          leave, there's a name they'll send for now. Fair roads on the way out —
          yours are clear."
        # graduation closes the arc; no extra on-completion side effects.
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The run is in on the window and the racket is on the record: the salvage
          lien dies on a delivered load, the freight outfit's string of "accidents"
          turns into a string of plantings the shimmed bearing can prove, and the
          independents squeezed off the route start running it again. A hand who can
          wrench a planted fault clear, drive a sabotaged rig through the ridge the
          outfit owns, and stand on the gate when the crew comes has a way of being
          sent for — the haul roads of the Mos Eisley margins carry a name now, on
          the frontier the war leaves alone.

  # ─────────────────────────────────────────────────────────────────────
  # GENERALIZED QUESTLINE — "The Twisted Word" (coruscant_gilded_twisted_word)
  # The FIFTEENTH accessible (non-t5, non-tutorial) kind:questline chain, the
  # FOURTH on Coruscant — on the GILDED CAGE alien-quarter face (the cosmopolitan
  # multi-species enclave under the old Hutt-mediated charters: the alien quarter
  # + the unlicensed bazaar + the courtyard of heritage halls + the upper-city
  # promenade chokepoint out of the district), reusing NONE of The Lost Courier's
  # lower-city, The False Provenance's Petrax/museum, or The Sealed Ledger's
  # mid-city rooms. A TRANSLATION-FRAUD / FEUD-BAITING racket — a licensed sole
  # go-between doctors the rendering of a renewal charter shared by two Gilded
  # Cage communities (the Gran mutual-aid society and the Bothan trade
  # confederacy) so each reads the other as having reneged, baiting a blood-feud
  # the broker's backers can pick the lapsed charter rights off of cheap — beaten
  # by INTERPRETER-MEDIATOR work: read the original-tongue charter against the
  # broker's twisted Basic rendering and catch the inverted honor-clause
  # (languages), carry the true reading to the wronged hall and present it in
  # correct protocol so it's received as redress and the feud stands down
  # (cultures), stand off the broker's enforcer who comes for the proof at the
  # promenade (combat), and get the fraud on the charter record. The FIFTEENTH
  # distinct skill spread (languages + cultures — both Knowledge), the FIRST
  # accessible arc to reward the SCHOLAR-DIPLOMAT / INTERPRETER-MEDIATOR build,
  # mechanically distinct from every prior arc's Perception social skills
  # (persuasion / bargain / con): this is reading a tongue and a people's
  # protocol, not charming a mark. Reuses the live questline engine
  # (kind:questline + active_questline + existing event types + the four reward
  # funnels) with NO new engine code, no new slot/event type, no schema
  # migration, no new reward faucet, and NO map-coordinate or exit-graph change.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: coruscant_gilded_twisted_word
    chain_name: "The Twisted Word"
    description: >
      Deep in the Gilded Cage — the cosmopolitan alien quarter Coruscant
      tolerates because its old Hutt-mediated charters predate the modern Senate
      — a Gran keeper named Brama Hool stands between her people and a feud she
      can see coming and cannot stop alone. Two old communities of the district,
      the Gran mutual-aid society she keeps and the Bothan trade confederacy
      across the courtyard, have shared a charter for generations: water rights,
      berth rights, a standing of mutual honor written into the old Hutt papers.
      It comes up for renewal this season, and by district custom every word
      between the two halls passes through one licensed go-between — and that
      broker has spent the season feeding each hall a doctored rendering of the
      other's terms, twisting a single honor-clause so each reads the other as
      having reneged and meant insult by it. The Bothan hall has called a
      challenge; the Gran hall is days from answering it; and when the charter
      lapses in blood, the broker's backers stand ready to pick the rights off
      both halls cheap. Brama Hool knows the rendering is a lie, but she is the
      accused party — barred from the filed copies as conflicted, and no reading
      from her hand would be trusted across the courtyard. She needs a neutral
      outside hand who can do the three things she cannot: read the original
      Bothan-tongue charter against the broker's Basic and find the clause he
      inverted, carry the true reading to the Bothan hall in their own protocol
      so it lands as redress and not a fresh slight, and get the fraud onto the
      charter record before the broker's muscle can bury it. A freelance favor —
      open to anyone, no faction required.
    archetype_label: "Freelance Interpreter's Favor"
    faction_alignment: independent
    starting_zone: entertainment_district
    starting_room: gilded_cage_alien_quarter
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["twisted_word_cleared"]
      drop_room: gilded_cage_alien_quarter
      follow_up_hint: >
        The fraud goes onto the charter record and the racket comes apart with
        it: the inverted clause is logged a forgery, the Bothan challenge is
        withdrawn, and the renewal both halls thought the other had wrecked is
        signed in the courtyard in the old form. The broker who lived as the only
        voice between the two halls — feeding each a twisted rendering of the
        other and waiting for the charter to lapse in blood — finds the one thing
        the racket needed gone: two communities who could not hear each other
        except through him, now holding a true reading neither of them needs him
        to carry. The backers who meant to buy the lapsed rights cheap buy
        nothing. Word goes the courtyard the way it never goes a Senate office:
        there is a hand who can read a tongue a broker swore could not be read
        and walk a correction through a hall's own protocol without giving fresh
        offense — and the old communities of the Gilded Cage, who have watched a
        season of words turned against them, stop trusting that the only voice
        between two halls has to be a crooked one.

    steps:
      - step: 1
        title: "The Only Voice Between"
        location: gilded_cage_alien_quarter
        npc: "Brama Hool"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Brama Hool in the Gilded Cage Alien Quarter."
        npc_intro: >
          [A three-eyed Gran in the muted formal sash of a heritage-hall keeper
          stands at the edge of the alien quarter's evening crowd, where a dozen
          untranslated tongues run together into one low murmur, a soft-folded
          sheaf of old charter papers held flat against her chest in both hands.]
          "You hear it — the quarter, all of it talking and none of it in Basic.
          A keeper learns to live inside that. I am Brama Hool, keeper of the
          Gran hall, and I am about to watch two communities who have shared a
          charter for four generations cut each other over words neither of them
          ever said. `talk` to me. I have one season's renewal and one broker's
          rendering between my people and a feud, and I cannot read my way out of
          it alone."
        completion:
          type: talk_to_npc
          npc: "Brama Hool"
        npc_complete: >
          [She lays the charter sheaf flat and taps two columns side by side — a
          dense Bothan-tongue clause and a clean Basic rendering beneath it, the
          broker's seal at the foot of both.] "Every word between my hall and the
          Bothan confederacy passes through one licensed go-between — district
          custom, four generations old. This season he has rendered each of us a
          lie of the other. One honor-clause, turned over: the Bothans read us as
          having renounced the shared berth; we read them as having spat on the
          old standing. Their hall has called a challenge. Mine will answer it. And
          when the charter lapses in blood, his backers buy the rights off both of
          us for nothing. I know the rendering is false — but I am the accused
          party, barred from the filed copies, and no word from my hand crosses
          that courtyard clean. You can go where I cannot. The broker keeps his
          filed renderings down in the bazaar, with the off-license crystals. Read
          the original Bothan charter against his Basic and find me the clause he
          turned."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Gilded Cage Bazaar where the broker files his renderings, read the original Bothan-tongue charter against his doctored Basic, and find the inverted honor-clause — use your `languages` skill, then `chain attempt`."

      - step: 2
        title: "The Inverted Clause"
        location: gilded_cage_bazaar
        npc: "(none)"
        npc_role: contact
        teaches: ["languages"]
        objective: "At the Gilded Cage Bazaar, read the original Bothan-tongue charter against the broker's Basic rendering and find the inverted honor-clause — a languages check."
        npc_intro: >
          [The bazaar runs under transparisteel canopies that throw the Coruscant
          sky in broken color across stalls of off-license crystals and goods no
          upper-city customs would pass. In a clerk's nook behind the comm-crystal
          stalls the broker keeps his filed renderings — the original Bothan
          charter and his Basic beneath it, both stamped, both meant to be read
          only by him.] A doctored rendering hides in plain sight: the Basic is
          clean, fluent, and signed, and only the original tongue beside it can
          show what was turned. Bothan honor-grammar runs on standing — who is
          owed, who renounces, who restores — and a single voicing flipped from
          the giving case to the renouncing case reads, in Basic, like a wronged
          party deserved the insult. Go down the clause the challenge was called
          over, set the Bothan against the Basic word by word, and find the one
          place the broker turned a vow of standing into a renunciation. `languages`,
          careful reading against a rendering built to pass — `chain attempt` when
          you have the clause.
        completion:
          type: skill_check_passed
          skill: "languages"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [You set the original Bothan against the broker's Basic and walk the
          honor-clause case by case — and there it is, one voicing turned: a vow
          in the giving case, the Bothan hall pledging to hold the shared berth
          for the Gran, rendered into Basic as a renunciation of it. Read straight,
          the clause is the opposite of the insult both halls were handed: each
          pledged the other the standing, and the broker turned each pledge into a
          spurning in the other's copy. Copy out the true reading, the turned
          voicing marked against the broker's own filed seal, and the fraud is in
          your hand — proof a forger left because he never meant the two tongues to
          be set side by side by anyone but him. Reading it isn't ending it: the
          Bothan hall has already called its challenge on the lie, and a true
          reading carried wrong across that courtyard is one more offense, not a
          peace.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "You have the true clause — now the harder hall. Carry the corrected reading to the Bothan confederacy in the Gilded Cage Courtyard and present it in their own honor-protocol so it lands as redress, not a fresh slight — use your `cultures` skill, then `chain attempt`."

      - step: 3
        title: "Across the Courtyard"
        location: gilded_cage_courtyard
        npc: "(none)"
        npc_role: contact
        teaches: ["cultures"]
        objective: "Bring the corrected reading to the Bothan confederacy hall in the Gilded Cage Courtyard and present it in correct Bothan honor-protocol so the challenge is withdrawn — a cultures check."
        npc_intro: >
          [The courtyard is a ring of heritage halls, a dozen architectural
          traditions layered in by centuries — the Gran hall behind you, the
          Bothan trade confederacy's across the plaza, its door carved with the
          standing-marks of a people who measure everything in honor owed and
          honor restored.] A true reading is not enough; how it is carried across
          this courtyard is the whole of it. To a Bothan hall mid-challenge, an
          outsider striding in to announce they were deceived is a second insult —
          you call them fools who could not read their own charter. Carry it the
          way their protocol allows a wrong to be unmade: enter by the petitioner's
          mark, name the broker's seal and not the hall as the author of the slight,
          set the turned clause before the speaker as a matter put right rather than
          a correction handed down, and let the redress be theirs to take. Do it in
          their form and the challenge can be withdrawn without a hall losing face;
          do it wrong and the true reading becomes the spark. `cultures`, an
          outsider walking a redress through a proud hall's own protocol —
          `chain attempt` when the challenge stands down.
        completion:
          type: skill_check_passed
          skill: "cultures"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [You enter by the petitioner's mark, name the broker's seal as the author
          of the turned clause, and set the true reading before the Bothan speaker
          as a standing to be restored rather than an error to be admitted — and the
          hall that was a day from blood reads its own pledge back in its own tongue
          and takes the redress as its own. The speaker lifts the challenge: not
          because an outsider told them they were wrong, but because the protocol
          let a fraud be named without a hall bowing to name it. The Bothan
          confederacy will hold to the true charter — on one condition any honor-
          court would set: that the forgery go onto the charter record, sealed,
          so the broker cannot render the clause a third way tomorrow. Take the
          marked reading and the withdrawn challenge toward the record office up in
          the upper city. The broker has held this courtyard as the only voice
          between two halls for four generations; he is not going to let the proof
          that ends that walk out of the district in your hand.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "The challenge is withdrawn — now get the fraud on the record. Carry the marked reading up to the Upper City Promenade toward the charter record office, and stand off the broker's enforcer who comes to take it — `attack`, `dodge`."

      - step: 4
        title: "On the Promenade"
        location: upper_city_promenade
        npc: "Hekka Vrool"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Carry the proof up to the Upper City Promenade and stop Hekka Vrool when the broker's enforcer comes for it — `attack`, `dodge`."
        npc_intro: >
          [The Upper City Promenade runs its mag-elevated walkways above the smog
          line, the way up out of the Gilded Cage and toward the charter record
          office — and a heavy, leather-skinned Weequay steps out of the packed
          restaurant crowd into the walkway ahead, a worn blaster pistol on his
          hip and a quiet menace in how little he hurries.] Hekka Vrool — the
          muscle who keeps the broker's renderings from ever being questioned, who
          has rarely had to draw because a doctored word and a called challenge do
          his work for him. He reads the marked charter in your hand and the easy
          contempt of a being whose threats keep themselves goes flat. "That paper
          stays in the district, friend. A charter dispute is a private hall matter
          — it does not go on any record up here." [He sets himself across the
          walkway between you and the record office.] "Hand it over and walk back
          down, or you don't walk up. The broker's a patient man. I'm the part of
          him that isn't."
        completion:
          type: combat_won
          enemy_template: "twisted_word_enforcer"
          enemy_count: 1
        npc_complete: >
          [Hekka Vrool goes down on the bright walkway above the smog, the blaster
          spinning away across the mag-elevated deck, and the crowd that pays for a
          view and not for trouble parts and pretends it saw nothing. The way up to
          the record office stands clear. Take the marked reading with you — the
          turned clause set against the broker's own filed seal, the withdrawn
          Bothan challenge folded in beside it — and there is nothing between here
          and the record but the climb, the fraud sealed onto the charter, and a
          renewal two halls can sign in the old form for the first time in four
          generations.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The enforcer's down and the way up is clear — get the fraud sealed onto the charter record, then go back to Brama Hool in the Gilded Cage Alien Quarter."

      - step: 5
        title: "In the Old Form"
        location: gilded_cage_alien_quarter
        npc: "Brama Hool"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Brama Hool in the Gilded Cage Alien Quarter with the fraud on the record and the renewal saved."
        npc_intro: >
          [Brama Hool is at the heart of the alien quarter when you come in, the
          charter sheaf open before her and the record office's sealed mark fresh
          on the corrected clause, the murmur of the quarter's dozen tongues going
          on around her the way it has for four generations.] "On the record.
          Sealed. The challenge withdrawn." [She turns the marked clause to the
          quarter-light and reads her own people's pledge and the Bothans', set
          true at last, side by side.] "Four generations one broker stood between
          two halls and called it the only way two peoples could speak. `talk` to
          me and let me say it plain before he finds another word to turn."
        completion:
          type: talk_to_npc
          npc: "Brama Hool"
        npc_complete: >
          "Here is your fee — and worth twice the credits to hand it to the hand
          who read the lie clean and carried the truth across that courtyard
          without making it a new wound. A fraud on the record kills a challenge; a
          clause read true in both tongues kills the racket. The renewal is signed
          in the old form, the berth and the standing hold, and the backers who
          meant to buy us cheap in our own blood buy nothing. The Gilded Cage is a
          small world for all its hundred peoples, and a long-memoried one. It will
          tell the difference between the broker who turns two halls against each
          other and the hand who set their own words straight between them. When a
          hall in this quarter finds a rendering it cannot trust, there is a name
          they will send for now. Fair speaking on the way out — yours has been
          true."
        # graduation closes the arc; no extra on-completion side effects.
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The fraud is sealed onto the charter and the renewal is signed in the old
          form: the challenge dies on a true reading, the broker's season of turned
          words becomes a forgery on the record, and the two old communities who
          could only hear each other through one crooked voice find they never
          needed him to carry a true one. A hand who can read a tongue a broker
          swore could not be read, walk a redress through a proud hall's own
          protocol, and stand on the promenade when the muscle comes has a way of
          being sent for — the heritage halls of the Gilded Cage carry a name now,
          under the old charters the war leaves alone.

  # GENERALIZED QUESTLINE — "The Wasting Ward" (nar_shaddaa_wasting_ward)
  # The SIXTEENTH accessible (non-t5, non-tutorial) kind:questline chain, the
  # FOURTH on Nar Shaddaa — on the lower REFUGEE-AND-UNDERCITY face (the
  # displaced-persons quarter and the lawless market depths below it: the refugee
  # sector aid post + the back-alley medcenter + the droid junkyard where the cut
  # is scavenged + the undercity market chokepoint up out of the depths), reusing NONE
  # of The Ghost Shipment's cantina/Undercity-Depths, The Forged Notice's
  # upper-dock registry, or The Warrens Toll's Warrens rooms. A FAKE-PLAGUE /
  # QUARANTINE-EXTORTION (medical-fraud) racket — a Hutt-lieutenant's self-styled
  # "sanitation board" declares a contagious "wasting fever" loose in the refugee
  # sector, seals the level under quarantine, sets a clearance toll, and sells the
  # only "cure," so its backers can buy the emptied, condemned habs cheap as the
  # families who can't pay sicken or flee — beaten by PHYSICIAN work: read a
  # board-"treated" patient and prove the wasting a poisoning, not a contagion, by
  # how it travels (medicine), trace the cut to the droid junkyard it's scavenged
  # up out of and name the agent in the board's own cure (scholar), stand off the board's
  # collector who comes for the proof at the undercity market (combat), and get the
  # truth to the Moon's port-medical registry. The SIXTEENTH distinct skill spread
  # (medicine + scholar — Technical + Knowledge), the FIRST accessible arc to
  # reward the DOCTOR / DIAGNOSTICIAN-RESEARCHER build, mechanically distinct from
  # The Dust-Sick (the only prior medical arc — first_aid + survival, a frontier
  # FIELD MEDIC stabilizing a real patient in the wilderness): this is MEDICINE
  # (clinical diagnosis) + SCHOLAR (research), a physician UNMASKING a manufactured
  # epidemic in the city, not a medic SAVING a real one in the wastes. Reuses the
  # live questline engine (kind:questline + active_questline + existing event types
  # + the four reward funnels) with NO new engine code, no new slot/event type, no
  # schema migration, no new reward faucet, and NO map-coordinate or exit-graph
  # change.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: nar_shaddaa_wasting_ward
    chain_name: "The Wasting Ward"
    description: >
      Down in the refugee sector of Nar Shaddaa — the crowded quarter where the
      displaced of a dozen fallen Outer Rim worlds eke out survival on protein
      packs and shared heating vents — an Ithorian volunteer medic named Ulil
      Maan watches a sickness she cannot name kill the people she treats, and
      knows it for a lie she cannot prove alone. A Hutt-lieutenant's self-styled
      "sanitation board" has declared a contagious "wasting fever" loose in the
      sector. It has sealed the level under quarantine, set a clearance toll on
      anyone who wants out to work, and sells the only "cure" — and its backers
      stand ready to buy the emptied, condemned habs cheap as the families who
      cannot pay sicken or run. But Ulil Maan has watched patient after patient
      come back from that cure worse, never better, and she knows in her hands'
      memory that the wasting does not move the way a plague moves: it does not
      jump from a shared vent or a shared cup; it falls hardest on the ones who
      took the board's tonic and drank the board's cheap clearance-ration water.
      It is no fever. It is a slow poison, sold back to the people it is killing.
      She is only an unlicensed offworlder medic with no standing a Hutt board
      answers to, and she needs a neutral outside hand who can do the three things
      she cannot: read one of the board's "treated" patients and prove the wasting
      a poisoning and not a contagion, trace the cut they dose the cure with to
      its source and name the agent, and get the truth up out of the depths to the
      one authority on the Moon a health-concession fears — before the board's
      collector can bury it. A freelance favor — open to anyone, no faction
      required.
    archetype_label: "Freelance Physician's Favor"
    faction_alignment: independent
    starting_zone: nar_shaddaa_promenade
    starting_room: refugee_sector
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["wasting_ward_cleared"]
      drop_room: refugee_sector
      follow_up_hint: >
        The truth reaches the port-medical registry and the racket comes apart
        with it: the "wasting fever" is logged a poisoning, the board's "cure" is
        pulled as the very thing doing the killing, the quarantine is lifted, and
        the clearance toll dies with the seal. The board that lived by a sickness
        nobody could question — dosing the cure, charging the dying, and waiting
        for the level to empty — finds the one thing the racket needed gone: a
        sealed sector that could not be diagnosed, now holding a true readout and
        a named poison nobody needs the board's leave to read. The backers who
        meant to buy a condemned level cheap buy nothing. Word goes the depths the
        way it never goes a licensing desk: there is a hand who can tell a poison
        from a plague a Hutt board swore was a plague, and run the agent down to
        the cut it came from — and the displaced of the refugee sector, who have
        watched a season of their own deaths sold back to them, stop believing
        that the only word on what is killing them has to be a board's.

    steps:
      - step: 1
        title: "The Quarantine Line"
        location: refugee_sector
        npc: "Ulil Maan"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Ulil Maan at her aid post in the Nar Shaddaa Refugee Sector."
        npc_intro: >
          [A tall, stoop-shouldered Ithorian in a worn medic's smock stands at a
          makeshift aid post among the refugee sector's shelters, a battered
          diagnostic scanner in her long fingers, the curved T-shaped head of her
          species bowed over a feverish child while a vocoder at her twin throats
          turns her slow words into a dozen frightened tongues.] "You feel it on
          the air at the seal — the level is closed. A board declared a wasting
          fever, and now nobody works, nobody leaves, and everybody pays for a
          cure. I am Ulil Maan. I have treated this sector since before the board
          had a name for what it sells, and I am watching people die of a thing I
          have never once seen catch. `talk` to me. I think a poison is being
          sold to this level as a plague, and I cannot prove it with a scanner no
          board will read."
        completion:
          type: talk_to_npc
          npc: "Ulil Maan"
        npc_complete: >
          [She turns the scanner so you can see the readout — a slow wasting,
          dose by dose, in a being who never shared a room with another sick
          soul.] "A plague jumps from breath to breath. This jumps from the cure
          to the one who paid for it. The ones who fall hardest are the ones who
          took the board's tonic and drank the cheap clearance-ration water — not
          the ones who shared a vent with the dying. That is not how a sickness
          moves. That is how a poison is sold. But I am an offworlder with an
          unlicensed scanner and no standing a Hutt board answers to, and no word
          from my hand lifts that seal. You can be heard where I cannot. The board
          runs its 'treated' cases through the back-alley medcenter down in the
          undercity. Get in, read one of their patients, and prove to a registry
          what I cannot — that this is a poisoning, not a plague."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go down to the Black Market Medcenter in the Nar Shaddaa undercity, examine one of the board's 'treated' patients, and prove the wasting is a slow poisoning and not a contagion — use your `medicine` skill, then `chain attempt`."

      - step: 2
        title: "Not a Fever"
        location: black_market_medcenter
        npc: "(none)"
        npc_role: contact
        teaches: ["medicine"]
        objective: "At the Black Market Medcenter, examine one of the board's 'treated' patients and prove the wasting is a poisoning, not a contagion — a medicine check."
        npc_intro: >
          [Behind a rust-streaked door the back-alley medcenter keeps a
          surprisingly functional surgical bay, recycled bacta tanks half-full
          along one wall, the board's overflow of "wasting" cases laid out on
          stolen cots while its own no-questions doctor works the next room and
          asks nothing about who reads them.] A manufactured plague hides in plain
          sight: the patient is genuinely, terribly sick, and only the SHAPE of
          the sickness gives the lie away. A contagion seeds from a contact and a
          shared breath and climbs; a poisoning tracks the dose — it rises and
          falls with how much of the board's tonic and ration-water went in, with
          no contact to seed from and no one downwind of the patient catching it.
          Read the wasting against the chart of who took the cure and who only
          shared the air: the curve follows the dose, not the contact. Find the
          place the "fever" behaves like nothing that ever spread. `medicine`,
          a clinical read against a sickness dressed up as a plague — `chain
          attempt` when you have the diagnosis.
        completion:
          type: skill_check_passed
          skill: "medicine"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [You work the patient's history against the board's own intake chart and
          the shape comes clear: the wasting rises with every dose of the tonic
          and every measure of the clearance-ration water, and falls in the ones
          who could not afford either — and not one case seeds from a contact, not
          one soul downwind of a "fever" patient has caught the "fever." It does
          not spread. It is administered. The readout in your hand is a poisoning
          dressed as a plague, dose-driven and one-directional, proof a board left
          because it never meant a physician to read its own cases against its own
          chart. Diagnosing it isn't ending it: a true readout that names no agent
          is a healer's word against a Hutt board's notice, and the board's word
          is the one with a license. You have to name what is doing it — and where
          it comes from.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "You've proven it's a poisoning — now name the agent. The cut they dose the 'cure' with is a toxic industrial sludge scavenged up out of the Nar Shaddaa Droid Junkyard; trace it there and identify what's in the tonic — use your `scholar` skill, then `chain attempt`."

      - step: 3
        title: "What's in the Cure"
        location: droid_junkyard
        npc: "(none)"
        npc_role: contact
        teaches: ["scholar"]
        objective: "At the Droid Junkyard, trace the cut dosed into the board's 'cure' to its source and identify the agent — a scholar check."
        npc_intro: >
          [Mountains of droid parts climb into the hazy ceiling of the junkyard
          while salvagers pick the wreckage over with magnetic tools and the
          Ugnaught proprietor insists, to nobody who believes him, that everything
          is honestly acquired — and somewhere in the drained power cores and the
          slit coolant lines is the cheap toxic sludge the board's buyer hauls off
          by the drum to dose its cure.] A poisoning named is a poisoning a
          registry can act on; a poisoning unnamed is one more refugee-sector
          rumor. Knowing the agent is knowing where it came from and what it does:
          a slow cytotoxic by-product, near-worthless because it is the drained
          dregs of scrapped machinery nobody else has a use for, hauled out of
          yards like this one by anyone who wants a tonic to wear a body down
          without looking like murder. Sample the sludge, match it against what you
          read in the patient, and trace the drum back to the board's buyer — name
          the thing in the cure and tie it to the supply, in terms a port-medical
          desk can log. `scholar`, the research and xenobiology to put a name to an
          industrial poison and where it's scavenged — `chain attempt` when you
          can name the agent.
        completion:
          type: skill_check_passed
          skill: "scholar"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [You match the sludge against the wasting in the patient and the agent
          resolves: a slow cytotoxic by-product, near-worthless and
          near-untraceable, drained from the junkyard's scrap by the drum and dosed into
          the board's tonic and its clearance-ration water at exactly the measure
          that wears a body down over weeks and reads, to anyone who does not look,
          like a wasting fever. You have its name, its make, and the buyer's
          standing order tying the drums to the board's supply — the whole of it,
          set against the medcenter's true readout, in terms a registry cannot
          wave off as a rumor. Naming it isn't filing it: the board has held this
          level by being the only voice on what the wasting is, and the proof that
          ends that has to get up out of the depths to a desk that can pull a
          license. The board is not going to let it walk up the market in your
          hand.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "You've named the poison and tied it to the board's supply — now get it to a registry. Carry the proof up through the Nar Shaddaa Undercity Market toward the port-medical desk, and stand off the board's collector when he comes for it — `attack`, `dodge`."

      - step: 4
        title: "The Collector"
        location: undercity_market
        npc: "Greel Vodo"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Carry the proof up through the Undercity Market and stop Greel Vodo when the board's collector comes for it — `attack`, `dodge`."
        npc_intro: >
          [The undercity market sprawls under jury-rigged glowpanels and
          bioluminescent fungi, the lawless press of scrap stalls and informants
          where the law never comes — the way up out of the depths and toward the
          port-medical registry — and a wiry, green-scaled Rodian in a collector's
          flak-vest steps out of the crowd into the lane ahead, a worn blaster
          pistol on his thigh and a quiet menace in how little he hurries.] Greel
          Vodo — the collector who keeps the board's quarantine paying, who works
          the toll at the seal and leans on the families behind on the cure, and
          who has rarely had to draw because a sealed level and a sold fever do his
          collecting for him. He reads the proof in your hand and the easy contempt
          of a being whose threats keep themselves goes flat. "Those readings stay
          in the depths, friend. The wasting's a quarantine matter — it doesn't go
          on any registry up top." [He sets himself across the market between you
          and the way up.] "Hand it over and walk back down, or you don't walk up.
          The board's a patient outfit. I'm the part of it that isn't."
        completion:
          type: combat_won
          enemy_template: "wasting_ward_enforcer"
          enemy_count: 1
        npc_complete: >
          [Greel Vodo goes down between the scrap stalls, the blaster spinning away
          across the grimy decking, and the market crowd that pays for nothing and
          sees less parts and pretends it saw nothing. The way up out of the depths
          stands clear. Take the proof with you — the medcenter's true readout, the
          named agent, the board's standing order for the cut folded in beside it —
          and there is nothing between here and the registry but the climb, the
          poisoning logged, and a sealed level that can be opened for the first time
          since the board declared its fever.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The collector's down and the way up is clear — get the proof logged at the port-medical registry, then go back to Ulil Maan in the Refugee Sector."

      - step: 5
        title: "The Sealed Level"
        location: refugee_sector
        npc: "Ulil Maan"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Ulil Maan in the Nar Shaddaa Refugee Sector with the poisoning logged and the quarantine lifting."
        npc_intro: >
          [Ulil Maan is back at her aid post when you come in, the seal at the end
          of the corridor already standing open for the first time in a season, the
          registry's logged finding on the readout in her long hand, the murmur of
          the sector's frightened tongues turning, slowly, to something else.]
          "Logged. The wasting named for what it is. The cure pulled. The
          quarantine lifting as we speak." [She bows the curved sweep of her head
          over the open seal and the people already moving through it.] "A whole
          season they sold this level its own dying and called it a plague nobody
          could question. `talk` to me and let me say it plain, while there is
          finally someone with a license to hear it."
        completion:
          type: talk_to_npc
          npc: "Ulil Maan"
        npc_complete: >
          "Here is your fee — and worth twice the credits to hand it to the hand
          who read a poison a board swore was a plague and carried the proof up out
          of the depths to a desk that could act on it. A true readout lifts a
          quarantine; a named agent ends a racket. The dosing stops, the real sick
          can be treated for what is actually killing them, the toll dies with the
          seal, and the backers who meant to buy this level cheap in its own
          people's blood buy nothing. Nar Shaddaa is a deep, dark Moon, and a
          long-memoried one. It will tell the difference between the board that
          sold a sector its own deaths and the hand who told it the truth of what
          it was dying of. When a level on this Moon is handed a sickness it cannot
          trust, there is a name they will send for now. Heal well on the way out —
          you have, already."
        # graduation closes the arc; no extra on-completion side effects.
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The poisoning is logged and the quarantine is lifting: the "wasting
          fever" dies as a true readout names it for the cut in the board's own
          cure, a season of sold deaths becomes a poisoning on the registry, and a
          sealed level that could only learn what was killing it from the board
          that was killing it finds it never needed the board's leave to be
          diagnosed at all. A hand who can tell a poison from a plague a Hutt board
          swore was a plague, run the agent down to the scrap it's cut from, and
          stand in the market when the collector comes has a way of being sent for — the
          refugee levels of Nar Shaddaa carry a name now, down where the war's
          displaced wash up and the boards prey on them.

  # ═══════════════════════════════════════════════════════════════════════
  # GENERALIZED QUESTLINE — "The Rigged Issue" (tatooine_rigged_issue)
  # The SEVENTEENTH accessible (non-t5, non-tutorial) kind:questline chain, the
  # FIFTH on Tatooine — on the CIVIC-COMPOUND face (the dusty knot of Mos Eisley
  # officialdom: the planetary militia's HQ and weapons vault + the regional
  # government's weapon-licensing offices + the under-staffed police station's
  # property locker + the quiet government-quarter street between them:
  # tatooine_militia_hq / regional_government_offices / police_station_main /
  # mos_eisley_government_quarter), reusing NONE of The Crooked Wheel's market
  # district, The Dust-Sick's Jundland, The Sabotaged Run's speeder circuit, or
  # The Long Haul's freight margins. A COUNTERFEIT / SABOTAGED-ARMS racket — a
  # licensed outfitter holding the militia's small-arms contract substitutes the
  # genuine issue for counterfeits (blasters cut to a cheaper, hotter spec that
  # jam after a magazine, "ceramic-faced" armor that is forged-marked pot-metal),
  # pocketing the difference and fencing the real arms offworld, and a patrol
  # rider is dead of a blaster that quit on him with a raider on his back — beaten
  # by ARMORER work: strip one of the outfitter's "certified" replacement blasters
  # and prove it built to jam (blaster repair), put the dead rider's recovered
  # "issue" plate under the light and prove the proof-mark forged (armor repair),
  # stand off the enforcer the outfitter sends when the proof starts to walk
  # (combat), and get it to the prefect's weapons-licensing desk. The SEVENTEENTH
  # distinct skill spread (blaster repair + armor repair — both Technical), the
  # FIRST accessible arc to reward the GUNSMITH / ARMORER (weaponsmith) build,
  # mechanically distinct from the two prior repair arcs that both work MACHINES:
  # The Condemned Hull (space transport repair + astrogation, a starship
  # engineer-navigator) and The Long Haul (ground vehicle repair + operation, a
  # wheelman-mechanic). This is the bench — a blaster and a breastplate in the
  # hand, not a hull or a hauler — proving a soldier's own issued gear was made to
  # fail. The bored clone garrison and twice-a-week Republic liaison the room
  # descriptions already name stay distant background; a local arms-fraud racket
  # runs on a crooked outfitter, not a war faction — the war stays offstage the
  # way every prior accessible arc keeps it. Reuses the live questline engine
  # (kind:questline + active_questline + existing event types + the four reward
  # funnels) with NO new engine code, no new slot/event type, no schema migration,
  # no new reward faucet, and NO map-coordinate or exit-graph change.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: tatooine_rigged_issue
    chain_name: "The Rigged Issue"
    description: >
      In the dusty civic knot of Mos Eisley — the planetary militia's
      headquarters, the regional government's licensing offices, the
      under-staffed police station, all huddled together where the law patrols
      in pairs and stays out of everyone's way — a Chadra-Fan contract armorer
      named Senni Vrook watches the guns she would never have passed go out to
      the line and come back failed, and knows it for a fraud she cannot prove
      alone. This season the militia stopped buying her rebuilds and took a
      licensed outfitter's "certified" replacement issue instead — newer,
      cheaper, stamped and sealed — and ever since, the guns have begun to fail:
      fresh blasters that fire a magazine clean and then foul and jam as if they
      were built to, armor plate that a raider's slug-thrower punches straight
      through. A patrol rider is dead of a blaster that quit on him with a Tusken
      on his back, and the quartermaster who signed off on the cheap issue has put
      it on her maintenance. But Senni Vrook can smell the wrong, hotter propellant
      in those fouled chambers, and she knows pot-metal under a ceramic facing by
      its weight in her small hands, and she is certain to her bones the
      "certified" issue is a counterfeit built to fail — sold to the militia so the
      outfitter could pocket the difference and fence the real guns offworld. She
      is only an offworld civilian with a tool bandolier and no licensed standing
      a stamped contract answers to, and she needs a neutral outside hand who can
      do the three things she cannot: strip one of the "certified" replacement
      blasters and prove it built to jam, prove the dead rider's plate a
      forged-marked counterfeit, and get the proof to the one desk on the planet a
      licensed contract answers to — before the outfitter's man can take it back,
      and before the next raider season finds the line carrying junk. A freelance
      favor — open to anyone, no faction required.
    archetype_label: "Freelance Armorer's Favor"
    faction_alignment: independent
    starting_zone: tatooine_civic
    starting_room: tatooine_militia_hq
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["rigged_issue_cleared"]
      drop_room: tatooine_militia_hq
      follow_up_hint: >
        The proof reaches the prefect's weapons-licensing desk and the racket
        comes apart with it: the outfitter's small-arms contract is pulled, the
        "certified" issue is condemned as the counterfeit it always was, the real
        guns are traced off the offworld fence, and the militia is re-armed with
        gear that fires before the raider season finds the line. The outfit that
        lived by a fraud nobody licensed would look at — selling a frontier line
        its own dead and skimming the difference — finds the one thing the racket
        needed gone: a stamped seal that could not be questioned, now stripped to
        the rigged action and the forged proof-mark on a bench a licensing desk had
        to read. The fence who meant to buy a militia's real arms cheap in its own
        riders' blood buys nothing. Word goes the line the way it never goes a
        licensing desk: there is a hand who can put a "certified" gun on a bench and
        tell you to the part where it was built to quit, and read a forged mark off
        a plate cast in pot-metal — and the riders of the Mos Eisley line, who have
        carried a season of guns that failed when they needed them, stop believing
        that the seal on a thing has to be the truth of it.

    steps:
      - step: 1
        title: "Bad Maintenance"
        location: tatooine_militia_hq
        npc: "Senni Vrook"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Senni Vrook at her bench in the Tatooine Militia Headquarters armory."
        npc_intro: >
          [A small, bat-eared Chadra-Fan is perched on a stool at the militia
          armory bench, barely waist-high to the troopers around her, the stripped
          action of a blaster pistol fanned out in clean parts before her and a
          loupe pushed up onto her brow. The whole bench smells of solvent and
          scorched metal. She does not look up from the part in her small hands.]
          "Another one back failed. Fired one magazine and fouled solid — and the
          quartermaster wrote 'maintenance' on it, on MY rack, like I don't know
          the smell of the wrong propellant by now. I am Senni Vrook. I have rebuilt
          most of the guns on this rack with my own hands, and these new 'certified'
          ones are not failing. They are being made to. `talk` to me. A rider is
          dead of one, and I can prove the fraud — but not with a stamp's word
          against mine, and not alone."
        completion:
          type: talk_to_npc
          npc: "Senni Vrook"
        npc_complete: >
          [She sets the fouled part down and turns the stripped action so you can
          see where the gas chamber was cut thin.] "Look — too light, here, where it
          should be heavy. They cut the chamber to a cheaper, hotter spec; it fires
          a magazine and then it fouls and jams like clockwork, because that is the
          clock they built into it. A real gun fails when it wears out. This was
          made to. The militia took a licensed outfitter's 'certified' issue over my
          rebuilds this season, cheap and stamped and sealed — and the outfitter
          pocketed the difference and is fencing our real guns offworld while the
          line carries counterfeits that quit on them. But I am an offworld civilian
          with a tool bandolier and no licensed standing a stamped contract answers
          to, and no word from me pulls that contract. You can be heard at a desk
          where I cannot. The outfitter's replacement stock is logged for licensing
          over at the regional government offices. Get in, put one of their
          'certified' blasters on a bench, and prove to a licensing desk what I
          cannot — that it was built to fail."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Regional Government Offices where the outfitter's 'certified' replacement stock is logged for licensing, strip one of the blasters, and prove it was built to jam — use your `blaster repair` skill, then `chain attempt`."

      - step: 2
        title: "Built to Jam"
        location: regional_government_offices
        npc: "(none)"
        npc_role: contact
        teaches: ["blaster repair"]
        objective: "At the Regional Government Offices, strip one of the outfitter's 'certified' replacement blasters and prove it was built to fail — a blaster repair check."
        npc_intro: >
          [Behind the clutter of datadisks and land deeds, the regional offices
          keep a licensing dock where new small arms are logged and proof-stamped
          before issue, and a crate of the outfitter's "certified" replacement
          blasters sits sealed and signed, waiting on the militia's sign-off.] A
          counterfeit built to fail hides in plain sight: the blaster looks newer
          and cleaner than anything on Senni Vrook's rack, fires a magazine like a
          dream, and only the INSIDE gives the lie away. Strip it to the gas
          chamber and the action and read it against a gun built to last: a sound
          weapon vents and seats to spec; this one is cut thin and hot where it
          should be heavy, machined to foul and seize after a magazine's worth of
          fire — built to a clock, not worn to a fault. Find the place the
          "certified" issue was made to quit. `blaster repair`, a gunsmith's strip
          and read of a sidearm dressed up as sound — `chain attempt` when you can
          prove the fault was built in.
        completion:
          type: skill_check_passed
          skill: "blaster repair"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [You strip the "certified" blaster to the frame and the fraud comes clear
          in your hands: the gas chamber is cut to a thinner, hotter spec than the
          mark on the receiver certifies, the heat-seal is a cheaper compound that
          carbons up fast, and the whole action is machined to foul and seize inside
          a magazine of sustained fire — not a worn gun, not a maintenance failure,
          a sound-looking sidearm built to a clock to quit when it is leaned on. The
          stripped action on the licensing dock is proof a sound weapon and a
          counterfeit do not fail the same way, the kind of proof the outfitter left
          because it never meant a gunsmith to strip its sealed stock against the
          mark stamped on it. Proving the blaster built to fail isn't ending it: one
          rigged gun is a tradesbeing's word against a licensed seal, and the seal is
          the one with a stamp. You have to prove the issue rotten clean through —
          the armor too, not just the guns.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "You've proven the blaster built to fail — now the armor. The dead patrol rider's recovered 'issue' breastplate is held in the Police Station property locker; put it under the light and prove the plate a forged-marked counterfeit — use your `armor repair` skill, then `chain attempt`."

      - step: 3
        title: "Under the Light"
        location: police_station_main
        npc: "(none)"
        npc_role: contact
        teaches: ["armor repair"]
        objective: "At the Police Station, examine the dead rider's recovered 'issue' armor in the property locker and prove the plate a forged-marked counterfeit — an armor repair check."
        npc_intro: >
          [The under-staffed station's property locker holds the dead patrol
          rider's recovered kit, logged and waiting on the militia's claim — a desk
          clerk waves you through on the armorer's standing with barely a glance,
          and the twice-a-week Republic liaison is, as ever, not here.] A
          counterfeit plate read true is a counterfeit a licensing desk can act on;
          a plate read wrong is one more grieving rumor. The "issue" breastplate
          carries the proper proof-mark and the proper look — and a raider's
          slug-thrower punched it like tin. Put it under the light and read the
          plate behind the facing: ceramic-faced battle plate rings and resists; this
          is cast pot-metal under a thin ceramic wash, dense and dead and brittle,
          wearing a proof-mark struck to match the genuine die a hair off true.
          Read the metal, weigh it, and match the forged stamp against the mark a
          real plate carries — prove the armor a counterfeit and tie it to the same
          rotten issue as the gun, in terms a weapons-licensing desk cannot wave off.
          `armor repair`, the metallurgy and the maker's-mark eye to tell cast junk
          from battle plate — `chain attempt` when you can prove the plate forged.
        completion:
          type: skill_check_passed
          skill: "armor repair"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [You put the dead rider's breastplate under the light and read it true:
          the facing is a thin ceramic wash over a plate cast from cheap pot-metal
          alloy — dense, dead, brittle, nothing like the bonded battle plate the
          proof-mark on it certifies — and the mark itself is struck a hair off the
          genuine die, a forgery good enough for a glance and not for a gunsmith's
          loupe. It did not stop a slug because it was never made to; it was made to
          look like it would and to cost a tenth of what it claimed. You have the
          metal, the false facing, and the forged mark, set against the rigged
          blaster from the licensing dock — the whole of the issue proven rotten
          clean through, in terms a weapons-licensing desk cannot file as grief.
          Proving it isn't pulling the contract: the outfitter has held this line by
          being the licensed seal nobody could question, and the proof that ends that
          has to get across the quarter to the prefect's desk. The outfitter is not
          going to let it walk up the lane in your kit-bag.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "You've proven the armor a forged-marked counterfeit and tied it to the rigged issue — now get it to a desk. Carry the proof across the Government Quarter toward the prefect's licensing office, and stand off the outfitter's collector when he comes for it — `attack`, `dodge`."

      - step: 4
        title: "The Collector"
        location: mos_eisley_government_quarter
        npc: "Vurr Magh"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Carry the proof across the Government Quarter and stop Vurr Magh when the outfitter's collector comes for it — `attack`, `dodge`."
        npc_intro: >
          [The government quarter is a quieter stretch near the regional offices
          and the station, the buildings a little better kept, the law patrolling
          past in dusty pairs and staying, as it always does here, out of everyone's
          way — the open lane toward the prefect's licensing desk — and a broad,
          grey-furred Gotal in a spacer's coat steps out of a shaded doorway into
          your path, the twin cones on his head swiveling to fix on you, a worn
          blaster pistol on his hip and a quiet menace in how little he hurries.]
          Vurr Magh — the collector the outfitter keeps on Tatooine to keep the
          contract's quiet quiet, who leans on a clerk a payment behind and walks a
          witness back from a desk, and who rarely has to draw because a stamped seal
          and a dead rider's "bad maintenance" do his collecting for him. His cones
          read the proof in your kit-bag and the easy contempt of a being who feels a
          street before it moves goes flat. "That kit-bag stays in the quarter,
          friend. The failures are a maintenance matter — they don't go on any
          licensing desk up the lane." [He sets himself across the quarter between
          you and the prefect's office.] "Hand it over and walk back down, or you
          don't walk up. The outfitter's a patient outfit. I'm the part of it that
          isn't."
        completion:
          type: combat_won
          enemy_template: "rigged_issue_enforcer"
          enemy_count: 1
        npc_complete: >
          [Vurr Magh goes down in the open lane, the blaster spinning away across the
          packed dust, and the thin government-quarter crowd that sees the law walk
          past in pairs and learns nothing finds something else to look at. The way
          up the quarter stands clear. Take the proof with you — the rigged blaster's
          stripped action, the dead rider's forged-marked plate, the licensing-dock
          log folded in beside them — and there is nothing between here and the
          prefect's desk but the open lane, the fraud filed, and a militia line that
          can be re-armed with guns that fire for the first time since the outfitter
          won the contract.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The collector's down and the way up is clear — get the proof filed at the prefect's weapons-licensing desk, then go back to Senni Vrook at the Militia Headquarters."

      - step: 5
        title: "Good Guns"
        location: tatooine_militia_hq
        npc: "Senni Vrook"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Senni Vrook at the Tatooine Militia Headquarters with the fraud filed and the contract pulling."
        npc_intro: >
          [Senni Vrook is back at her bench when you come in, but the rack behind
          her is different already — the sealed "certified" crates hauled off to one
          side under a condemnation tag, the prefect's filed finding on a datapad in
          her small hands, and a few of her own honest rebuilds going back up on the
          line where the counterfeits came down.] "Filed. The issue named for what
          it is. The contract pulling as we speak, the real guns traced off the
          fence." [She clicks her snout at the condemned crates with a tradesbeing's
          flat satisfaction.] "A whole season they sold this line counterfeits and
          called the failures my maintenance, and put a rider in a box for it.
          `talk` to me and let me say it plain, while there is finally a desk with a
          stamp that has to hear it."
        completion:
          type: talk_to_npc
          npc: "Senni Vrook"
        npc_complete: >
          "Here is your fee — and worth twice the credits to hand it to the hand who
          stripped a 'certified' gun to the part it was built to quit on and read a
          forged mark off a plate cast in pot-metal, and carried the proof up an open
          lane to a desk that could act on it. A stripped action pulls a contract; a
          forged mark ends a racket. The counterfeits come down, the line gets guns
          that fire before the raiders come, the quartermaster's ledger carries the
          fraud instead of my name, and the outfit that meant to sell this militia
          its own dead and skim the difference sells nothing. Tatooine is a hard
          planet and a long-memoried one, and a frontier line learns fast who sent it
          out the gate with good gear and who sent it out with junk. When a line on
          this rock is handed a gun it cannot trust, there is a name they will send
          for now. Carry mine with it — and keep your own sidearm clean; I'd not have
          the hand that proved this carrying a gun I didn't strip myself."
        # graduation closes the arc; no extra on-completion side effects.
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The fraud is filed and the contract is pulling: the "certified" issue dies
          as a stripped action names it built to fail and a forged mark names the
          plate cast junk, a season of guns that quit becomes an arms-fraud on the
          licensing record, and a militia line that could only learn whether its own
          gear was sound from the outfit selling it learns it never needed the
          outfit's seal to read a gun true at all. A hand who can put a "certified"
          blaster on a bench and tell it to the part it was built to quit on, read a
          forged mark off a counterfeit plate, and stand in the lane when the
          collector comes has a way of being sent for — the Mos Eisley line carries a
          name now, out where the raiders come and a gun that fires is the difference.

  # ─────────────────────────────────────────────────────────────────────
  # GENERALIZED QUESTLINE — "The Salted Lane" (kuat_salted_lane)
  # The EIGHTEENTH accessible (non-t5, non-tutorial) kind:questline chain, the
  # SECOND set on KUAT — on the PASSENGER-TRANSIT face (the civilian spaceport
  # concourse, the shuttle bay, the orbital-ring transit hub, and the spaceport
  # transit lounge: kuat_spaceport_concourse / kuat_shuttle_bay /
  # kuat_ring_transit_hub / kuat_transit_lounge), reusing NONE of The Condemned
  # Hull's industrial shipyard berths (kuat_deporin_shipyards /
  # kuat_ileu_shipyards / kuat_customs_checkpoint / kuat_ring_cantina /
  # kuat_ring_factories / kuat_ring_machine_shops / kuat_ring_warehouses /
  # kuat_supply_station). Where The Condemned Hull worked the drydocks, this works
  # the TRAFFIC LANES — the busy civilian chokepoint where independent freighter
  # crews wait out KSF's strict inspection-and-traffic queue. A
  # CLEARANCE-FRAUD / STAGED-HIJACK racket: a "clearance broker" sells small
  # independent haulers forged transit-priority slots — a fast lane through the
  # queue a shoestring crew cannot afford to wait out — but the slots are SALTED,
  # squawking the ship onto a deviation vector through a dead stretch of the outer
  # ring where the broker's partnered hijack crew strips its cargo, logged by KSF
  # as a "navigation error" by an unlicensed independent so the loss is written
  # off and the crew eats the blame. A freighter captain lost a partner ship that
  # way and was sold a slot for her own next run — beaten by PILOT-GUNNER work:
  # fly the salted slot and HOLD the true lane against the deviation the doctored
  # code feeds the helm (space transports), work the freighter's gun and drive off
  # the hijack crew when it closes on the deviation point (starship gunnery), stand
  # off the broker's collector who comes for the flight recorder (combat), and get
  # the recorder and the salted code to the KSF traffic-authority desk. The
  # EIGHTEENTH distinct skill spread (space transports + starship gunnery — both
  # MECHANICAL), the FIRST accessible arc to reward the independent freighter
  # PILOT-GUNNER (the helm and the turret of a working hauler), mechanically
  # distinct from the two prior space/vehicle arcs: The Condemned Hull (space
  # transport REPAIR + astrogation, a starship engineer-navigator who works a
  # SEALED HULL on the bench) and The Sabotaged Run (sensors + repulsorlift
  # operation, a GROUND speeder racer). This is the cockpit under way — a lane to
  # hold and a gun to work, not a drive to strip or a track to read — proving a
  # crew's bought clearance was steering it into a hijack. The bored clone
  # garrison and constant-but-unobtrusive KSF presence the room descriptions
  # already name stay distant background; a clearance-slot racket runs on a
  # crooked broker and a hijack crew, not a war faction — the war stays offstage
  # the way every prior accessible arc keeps it. Reuses the live questline engine
  # (kind:questline + active_questline + existing event types + the four reward
  # funnels) with NO new engine code, no new slot/event type, no schema migration,
  # no new reward faucet, and NO map-coordinate or exit-graph change.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: kuat_salted_lane
    chain_name: "The Salted Lane"
    description: >
      On the civilian transit face of Kuat — the spaceport concourse and shuttle
      bay where independent freighter crews wait out the Kuati Security Forces'
      strict inspection-and-traffic queue before they can move cargo through the
      orbital ring — a Duros hauler captain named Jando Vekk has buried one partner
      already and is about to fly the same death himself. There is a man on the
      ring who sells what a shoestring crew can never afford to wait for: a transit
      PRIORITY SLOT, a clearance code that drops a small hauler to the front of the
      queue and out through the lanes ahead of the week-long line. Vekk's old wing
      partner bought one, flew it, and never came off the far side of the ring —
      stripped to the frame in a dead stretch of the outer lanes and logged by KSF
      as a "navigation error" by an unlicensed independent, the loss written off,
      the dead crew blamed for their own murder. Vekk is certain the slots are
      SALTED: the priority code does not speed the lane, it BENDS it — squawks the
      ship onto a quiet deviation vector that routes it straight through the dead
      stretch where the broker's partnered hijack crew is waiting to take it, every
      time, dressed up as the kind of nav error KSF expects of independents and
      never looks twice at. And now, with the same broker's slot burning a hole in
      his own manifest and a run he cannot afford to refuse, Vekk knows it the way
      a pilot knows a bad lane in his hands — but he is an unlicensed independent
      whose word is worth nothing against a KSF traffic log, and he cannot fly the
      salted slot, work the gun when the hijackers close, and stand off the man the
      broker sends all at once before the next crew flies it blind. He needs a
      neutral hand who can do the three things he cannot: take his freighter out on
      the salted slot and HOLD the true lane against the deviation the doctored code
      feeds the helm, proving the slot steers ships wrong; work the gun and drive
      off the hijack crew when it closes on the deviation point, proving the "nav
      error" a staged ambush; and carry the flight recorder and the salted code to
      the one desk on the ring a clearance racket answers to — before the broker's
      collector can take it back, and before the next independent crew is sold its
      own grave. A freelance favor — open to anyone, no faction required.
    archetype_label: "Freelance Pilot's Favor"
    faction_alignment: independent
    starting_zone: kuat_main_spaceport
    starting_room: kuat_spaceport_concourse
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["salted_lane_cleared"]
      drop_room: kuat_spaceport_concourse
      follow_up_hint: >
        The flight recorder and the salted code reach the KSF traffic-authority
        desk and the racket comes apart with them: the broker's priority slots are
        flagged for the deviation vector they always carried, the dead stretch of
        the outer ring is swept and the hijack crew taken off it, and the partner
        ship's loss — and a string of others like it — is pulled off the books as a
        "navigation error" and re-filed as the staged hijack it always was. The
        clearance broker who lived by a code KSF would never read against its own
        traffic log finds the one thing the racket needed buried — a flight
        recorder that flew the salted lane and held the true one, set beside the
        slot that bent it — read into the record at the desk he was certain it could
        never reach. The hijack crew that meant to strip one more independent in a
        lane the law wrote off buys nothing but a sweep. Word travels the transit
        ring the way it never travels a KSF desk: there is a hand who can fly a
        salted slot and feel where it is steering you, work the gun when the lane
        turns out to be an ambush, and stand in the way when the collector comes —
        and the independent crews who have been paying a broker to skip a queue and
        flying his slots into the dark stop believing that a clearance code in their
        hands has to be the lane it claims to be.

    steps:
      - step: 1
        title: "A Bad Lane"
        location: kuat_spaceport_concourse
        npc: "Jando Vekk"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Jando Vekk at the Kuat Spaceport Concourse."
        npc_intro: >
          [A lean, blue-skinned Duros leans against a pillar at the edge of the
          concourse where the independent crews wait out the queue, red eyes
          tracking the transit board with the flat patience of a pilot who has read
          a thousand of them, a worn flight bag at his feet and a clearance chit in
          his long fingers he keeps turning over like it might read different the
          next time.] "You fly? Then you'll understand this better than the desk
          will. I'm Jando Vekk. I buried my wing partner last cycle — Daro, good
          stick, twenty years on the lanes — and KSF wrote him off as a nav error,
          an independent who couldn't hold a vector. Daro could hold a vector in his
          sleep. He bought a priority slot off a broker on the ring, flew it, and
          came apart in a dead stretch of the outer lanes that a clean clearance
          would never have routed him through. `talk` to me. I've got the same man's
          slot in my hand and a run I can't refuse, and I am telling you that code is
          salted — and I cannot prove it and fly it and live, all at once."
        completion:
          type: talk_to_npc
          npc: "Jando Vekk"
        npc_complete: >
          [He turns the clearance chit so you can see the routing block burned into
          it.] "A priority slot is supposed to do one thing — drop you to the front
          of the queue and squawk you a clean fast lane out through the ring. Read
          this one. The vector it feeds the transponder isn't the fast lane; it's a
          bend — out through a dead stretch of the outer lanes nobody watches, every
          ship that flies it, like clockwork, because that is the clock the broker
          built into it. Daro didn't drift out there. He was STEERED out there, to a
          spot where a crew was waiting to strip him, and KSF logged it as his own
          bad flying because that is what they expect of us. I can feel a bad lane in
          my hands, but a feeling doesn't pull a broker's slots off the ring — a
          flight recorder does. Take my freighter out on this slot. Fly it, and HOLD
          the true lane against the deviation the code feeds the helm — prove to a
          recorder what I cannot prove to a desk: that the slot is steering ships
          wrong, on purpose."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Kuat Shuttle Bay where Jando Vekk's freighter is racked, take it out on the salted priority slot, and hold the true lane against the deviation the doctored code feeds the helm — use your `space transports` skill, then `chain attempt`."

      - step: 2
        title: "Hold the Lane"
        location: kuat_shuttle_bay
        npc: "(none)"
        npc_role: contact
        teaches: ["space transports"]
        objective: "From the Kuat Shuttle Bay, take Jando Vekk's freighter out on the salted slot and hold the true lane against the deviation the doctored code feeds the helm — a space transports check."
        npc_intro: >
          [Vekk's freighter is racked in a working corner of the shuttle bay, fueled
          and cleared to fly the slot, the salted priority code already loaded to the
          transponder and the queue dropping you to the front the instant it reads.] A
          salted lane only gives itself away to the hand on the yoke: the code squawks
          a clean fast vector to traffic control, but the moment you are under way it
          starts to BEND the helm — a soft, steady pull off the filed line and out
          toward a dead stretch of the outer ring, the kind of deviation a tired pilot
          rides without noticing because the instruments swear it is correct. Don't
          ride it. Fly the lane the chart says, not the one the code wants, and hold
          the true vector through the ring against a transponder feeding you wrong —
          feel where the slot is steering you and refuse it. `space transports`, a
          working pilot's hands on a freighter and a doctored slot fighting the yoke
          — `chain attempt` when you can hold the true lane and put the deviation on
          the recorder.
        completion:
          type: skill_check_passed
          skill: "space transports"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [You take the freighter out and the salted slot shows itself in your hands
          before the ring is an hour behind you: the transponder is squawking the
          filed fast lane to traffic control, but the autopilot trim the priority
          code loaded is feeding a slow, constant pull off that line — a deviation
          toward a dark stretch of the outer lanes that any pilot riding his
          instruments would follow straight in, certain he was dead on the filed
          vector. You hold the true lane by hand against it, the recorder logging the
          gap between the lane the slot squawked and the lane it was steering you to
          fly, and there is the proof Vekk could feel and never show a desk: the slot
          does not speed the queue, it bends the helm, every ship the same way, out
          to the same dead spot. Holding the lane isn't ending it — a deviation on a
          recorder is a bad code; it is not yet a hijack. The dead stretch the slot
          steers for is where the proof finishes, and there is a crew waiting in it.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "You've proven the slot bends the helm — now prove the dead stretch is an ambush. Hold the salted vector on toward the Ring Transit Hub's outer lanes, and when the hijack crew closes on the deviation point, work the freighter's gun and drive them off — use your `starship gunnery` skill, then `chain attempt`."

      - step: 3
        title: "The Far Side of the Ring"
        location: kuat_ring_transit_hub
        npc: "(none)"
        npc_role: contact
        teaches: ["starship gunnery"]
        objective: "Out past the Ring Transit Hub, hold the salted vector to draw the hijack crew, then work the freighter's gun and drive them off — a starship gunnery check."
        npc_intro: >
          [The ring transit hub falls behind and the filed traffic thins to nothing —
          the salted vector runs out into a dead stretch of the outer lanes the hub's
          tram-and-cargo bustle never reaches, a quiet patch of dark the broker's slot
          has been steering ships into for a year.] A deviation proves a bad code; a
          crew waiting on the deviation proves a hijack — and proving it means flying
          the salted lane right up to its end and letting the trap close, then not
          dying in it. They come off a powered-down hull tucked in the dead spot the
          moment your freighter holds the vector to the mark — a stripped raider built
          for taking soft independent cargo, fast and underarmed and certain of an
          easy hold — and the whole racket depends on no clearance code ever flying
          its own salted lane awake and ARMED. Hold the freighter steady, bring the
          gun on the hijack crew, and drive them off the lane they own — put the
          ambush itself on the recorder beside the deviation that fed you to it.
          `starship gunnery`, a working crew's hand on the freighter's gun against a
          hijacker who never expected to be shot back at — `chain attempt` when you
          have driven them off and logged the trap.
        completion:
          type: skill_check_passed
          skill: "starship gunnery"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [The hijack crew comes off the powered-down hull exactly where the salted
          slot steered you, fast and sure of a soft hold — and meets a freighter that
          flew the bent lane wide awake and brought its gun up to meet them. You hold
          the helm steady and work the gun, and the raider that has stripped a year of
          independents who rode their instruments into the dark breaks off a lane it
          was certain it owned and runs for the powered hull, the recorder logging the
          ambush sprung on the exact vector the priority code bent the helm toward.
          There is the whole of it now — the salted slot, the deviation it fed the
          yoke, and the crew waiting at the end of it — the kind of proof the broker
          left because he never thought a clearance code would fly its own dead lane
          armed and come back with the recorder running. But a recorder in a
          freighter's locker is not a recorder on the traffic-authority desk, and the
          broker has a man on the ring whose whole job is making sure the proof of a
          salted lane never comes off the ship that flew it.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "You've logged the salted slot, the deviation, and the ambush — now get the recorder to a desk. Bring the freighter back in and carry the flight recorder through the Spaceport Transit Lounge toward the KSF traffic-authority desk, and stand off the broker's collector when he comes for it — `attack`, `dodge`."

      - step: 4
        title: "The Collector"
        location: kuat_transit_lounge
        npc: "Draygo Sull"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Carry the flight recorder through the Spaceport Transit Lounge and stop Draygo Sull when the broker's collector comes for it — `attack`, `dodge`."
        npc_intro: >
          [The transit lounge is the soft, human end of the spaceport — comfortable
          seats, a view of the shipyard ring through the transparisteel, crews resting
          between flights — and the quiet way back from the bay toward the KSF
          traffic-authority desk runs straight through it. A heavyset Weequay in a
          flight-scarred jacket rises from a corner seat as you come through with the
          recorder under your arm, the leathery folds of his face unreadable, a worn
          blaster riding his hip with the ease of a being who collects more than he
          fights.] Draygo Sull — the collector the broker keeps on the ring to make
          sure a salted slot's proof never comes off the ship that flew it, who buys
          back a recorder with a quiet word and a worse threat and rarely has to draw
          because a KSF "nav error" log does his arguing for him. He has watched a
          freighter he expected to come back stripped come back armed instead, and the
          easy menace of a man who collects from the grieving and the written-off goes
          hard. "That recorder belongs to the broker, friend — you flew his slot, you
          flew his property. The far-side trouble's a nav matter; it doesn't go on any
          traffic desk." [He sets himself between you and the way to the KSF desk.]
          "Hand it over and walk back to your bay, or you don't walk to that desk. The
          broker's a patient man. I'm the part of him that came to collect."
        completion:
          type: combat_won
          enemy_template: "salted_lane_enforcer"
          enemy_count: 1
        npc_complete: >
          [Draygo Sull goes down between the lounge seats, the blaster spinning away
          under a row of crew chairs, and the resting crews who have learned not to
          see a collection on the ring find somewhere else to look. The way to the
          traffic-authority desk stands clear. Take the recorder with you — the salted
          slot logged beside the deviation it fed the helm and the ambush sprung at
          the end of it — and there is nothing between here and the KSF desk but the
          quiet lounge, the racket filed, and a wing of independent crews who can fly
          the ring without buying a slot that flies them into the dark.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The collector's down and the way to the desk is clear — get the flight recorder filed at the KSF traffic-authority desk, then go back to Jando Vekk at the Spaceport Concourse."

      - step: 5
        title: "A Clean Lane"
        location: kuat_spaceport_concourse
        npc: "Jando Vekk"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Jando Vekk at the Kuat Spaceport Concourse with the salted lane filed and the racket coming apart."
        npc_intro: >
          [Vekk is off the pillar when you come back through the concourse, standing
          straighter than a man who buried a partner has any right to, the broker's
          clearance chit gone from his fingers and a KSF filing receipt in its place,
          the transit board behind him running its honest queue.] "Filed. The slot
          read against its own salted vector, the dead stretch swept, the crew that
          was waiting in it taken off the ring. They're pulling Daro's loss off the
          books as we speak — re-filing a year of 'nav errors' as the hijacks they
          always were." [He looks at the receipt the way a pilot looks at a clean
          chart after a bad lane.] "A whole year that broker sold us a fast queue and
          flew us into the dark, and called the dead bad pilots. `talk` to me and let
          me say it plain, while there's finally a desk with a seal on it that has to
          hear it."
        completion:
          type: talk_to_npc
          npc: "Jando Vekk"
        npc_complete: >
          "Here is your fee — and worth twice the credits to hand it to the hand who
          flew a salted slot and felt where it was steering, worked the gun when the
          lane turned out to be an ambush, and stood in the lounge when the collector
          came for the proof. A held lane proves a bad code; a sprung ambush ends a
          racket. The slots come off the ring, the dead stretch gets swept, the crews
          stop flying a broker's fast queue into a crew waiting in the dark, and Daro
          stops being a bad pilot on a traffic log and goes back to being a man who
          was murdered for cargo. The lanes are a small world for all the dark in
          them, and an independent crew learns fast who sold it a clean queue and who
          sold it a salted one. When a crew on this ring is handed a clearance it
          can't trust, there's a name they'll send for now. Carry mine with it — and
          fly your own lanes by the chart, not the slot; I'd not have the hand that
          flew this one ride a vector it didn't hold itself."
        # graduation closes the arc; no extra on-completion side effects.
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The salted lane is filed and the racket is coming apart: the broker's
          priority slots die as a flight recorder names the deviation they fed the
          helm and the ambush sprung at the end of it, a year of independents' deaths
          becomes a string of staged hijacks on the traffic record, and a wing of
          crews who could only learn whether a clearance was clean from the man
          selling it learns it never needed his slot to fly the ring at all. A hand
          who can fly a salted slot and feel where it is steering, work the gun when
          the dead lane turns out to be a trap, and stand in the way when the
          collector comes has a way of being sent for — the Kuat transit ring carries
          a name now, out where the lanes run dark and a clean vector is the
          difference between a hold and a grave.

  # GENERALIZED QUESTLINE — "The Short Weight" (mos_eisley_short_weight)
  # The NINETEENTH accessible (non-t5, non-tutorial) kind:questline chain, the
  # SIXTH set on TATOOINE — and the FIRST ever set on the iconic Mos Eisley
  # docking bays — on the SPACEPORT FREIGHT-TERMINAL face: the big shipping
  # company's lobby, two working cargo bays, and the spacers' dockside cafe
  # (notsub_shipping_lobby / docking_bay_87 / docking_bay_86 / dockside_cafe),
  # reusing NONE of the five prior Tatooine arcs' rooms — The Crooked Wheel's
  # market district, The Dust-Sick's Jundland, The Sabotaged Run's speeder
  # circuit, The Long Haul's freight-haul margins, or The Rigged Issue's civic
  # compound. Where those worked the market, the wastes, the track, the haul
  # roads, and the officialdom, this works the BAY FLOOR — the busy cargo docks
  # where independent loading crews fill holds for whatever trader needs the
  # work. A SHORT-WEIGHT / RIGGED-LOADER (cargo-metrology) racket: a loading
  # contractor who holds the powered-loader pool serving the independent bays has
  # DOCTORED the loaders' mass-sensors to log every load out light — a slice of
  # each shipment the crews move comes up "short" at the far scale, the skimmed
  # cargo pulled by hand out of salted ballast pods staged in a quiet bay and run
  # offworld by the contractor's partner, and the shortfall written up as
  # "shrinkage" and pinned on the honest independent co-ops who handled it, so the
  # traders blame the crews, the crews lose their dock tickets, and the contractor
  # keeps the only loaders certified to work the bays. A veteran loader's co-op is
  # one complaint from being written off as thieves — beaten by STEVEDORE work:
  # run a powered loader through the contractor's own calibration cycle and hold a
  # true, known weight against the rigged sensor to prove the rig logs short on
  # purpose (powersuit operation), break the seal on a salted ballast pod by hand
  # and restack the dead weight that hides the skim to prove the shortfall theft
  # and not shrinkage (lifting), stand off the contractor's collector who comes for
  # the proof (combat), and get the loader trace and the salted pod's manifest to
  # the spaceport port-authority desk. The NINETEENTH distinct skill spread
  # (powersuit operation — Mechanical — + lifting — Strength), the FIRST accessible
  # arc to reward the DOCK STEVEDORE / CARGO-LOADER (a powered loader-rig and the
  # raw muscle behind it), mechanically distinct from every prior Mechanical arc,
  # all of which pilot or service a VEHICLE — The Sabotaged Run (sensors +
  # repulsorlift operation, a ground speeder racer), The Condemned Hull (space
  # transport repair + astrogation, a starship engineer-navigator), The Long Haul
  # (ground vehicle repair + operation, a wheelman-mechanic), and The Salted Lane
  # (space transports + starship gunnery, a freighter pilot-gunner): a powersuit is
  # a WORN powered rig, not a piloted craft. And distinct from the only prior
  # Strength-skill arc, The Driven Herd (beast riding + swimming, a wrangler in open
  # water): this is raw industrial LIFTING, a stevedore's back. The bored clone
  # garrison and twice-a-week Republic liaison the Mos Eisley room descriptions
  # already name stay distant background; a short-weight scam runs on a crooked
  # contractor and his fence, not a war faction — the war stays offstage the way
  # every prior accessible arc keeps it. Reuses the live questline engine
  # (kind:questline + active_questline + existing event types + the four reward
  # funnels) with NO new engine code, no new slot/event type, no schema migration,
  # no new reward faucet, and NO map-coordinate or exit-graph change.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: mos_eisley_short_weight
    chain_name: "The Short Weight"
    description: >
      On the spaceport freight-terminal face of Tatooine — the Mos Eisley docking
      bays where independent loading crews fill holds for whatever trader needs the
      work — an Aqualish veteran loader named Grett Bashan is about to watch six
      honest crews written off as thieves. There is a contractor on the docks who
      holds the powered-loader pool that serves the independent cargo bays, and the
      board in the Notsub Shipping lobby says Bashan's co-op has been losing cargo:
      "shrinkage," a slice off every load his crews move that comes up short at the
      far scale, run after run, the same clean cut gone. The traders have started
      taking their work to the contractor's crews and filing the complaints that
      will pull Bashan's people's dock tickets and their names with them. Bashan's
      crews are clean. What is not clean is the loaders themselves: the contractor
      has DOCTORED the rigs' mass-sensors to log every load out light, the skimmed
      weight pulled by hand out of salted ballast pods staged in a quiet bay and run
      offworld by his partner, and the difference written up as the honest crews
      stealing from the holds they fill. Bashan has put cargo on and off these bays
      for twenty years, and he can feel a loader logging short in the drift of the
      rig before a scale will admit it — but he is an unlicensed independent whose
      word is worth nothing against a "certified" sealed scale, and he cannot run the
      loader, break the salted pod, and stand off the contractor's man all in one
      shift before the next complaint costs his crews their tickets. He needs a
      neutral hand who can do the three things he cannot: take a powered loader
      through the contractor's own calibration cycle and HOLD a true, known weight
      against the rigged sensor, proving the rig logs short on purpose; break the
      seal on a salted ballast pod by hand and restack the dead weight that hides the
      skim, proving the shortfall theft and not shrinkage; and carry the proof to the
      one desk on the field a rigged scale answers to — before the contractor's
      collector can take it back, and before six clean crews are written off as
      thieves for good. A freelance favor — open to anyone, no faction required.
    archetype_label: "Freelance Loader's Favor"
    faction_alignment: independent
    starting_zone: tatooine_mos_eisley
    starting_room: notsub_shipping_lobby
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["short_weight_cleared"]
      drop_room: notsub_shipping_lobby
      follow_up_hint: >
        The loader's calibration trace and the salted pod's manifest reach the
        spaceport port-authority desk and the racket comes apart with them: the
        contractor's powered loaders are pulled off the independent bays and
        re-certified, the salted ballast pods flagged for the skim compartments they
        always carried, the run offworld traced and stopped, and a season of
        "shrinkage" pulled off Grett Bashan's co-op record and re-filed as the
        short-weight theft it always was. The contractor who lived by a scale the
        port-authority would never read against finds the one thing the racket needed
        buried — a loader trace that logged short under a weight a being could feel
        was heavy, set beside the salted pod the skim was pulled from — read into the
        record at the desk he was certain it could never reach. The collector who
        meant to walk one more co-op away from that desk buys nothing but a pulled
        scale. Word travels the bay floor the way it never travels a port-authority
        desk: there is a hand who can run a loader and feel it logging short, break a
        salted pod by hand when the rigs lock out, and stand in the way when the
        collector comes — and the independent crews who have been losing a slice off
        every load to a "certified" scale and getting blamed for the theft stop
        believing that a sealed figure at the bottom of a manifest has to be the
        weight they loaded.

    steps:
      - step: 1
        title: "Short at the Scale"
        location: notsub_shipping_lobby
        npc: "Grett Bashan"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Grett Bashan at the Notsub Shipping lobby."
        npc_intro: >
          [A broad, heavy-shouldered Aqualish stands apart from the freight clerks
          at the edge of the Notsub Shipping lobby, the tusked, four-eyed face of his
          species fixed on a shrinkage report posted to the board, his scarred work
          harness and the old settled strength in his huge hands marking twenty years
          of putting cargo on and off the docks.] "You move cargo? Then you'll read
          this better than the traders will. I'm Grett Bashan — I run a loading
          co-op, six honest crews on the independent bays. That board says my people
          are stealing: 'shrinkage,' a slice off every load we move that comes up
          short at the far scale. My crews don't steal. They fill a hold to the
          manifest and it weighs light at delivery, every run, the same cut gone.
          `talk` to me. I've got a contractor's sealed scale calling my crews thieves
          and complaints stacking up that'll pull their tickets, and I am telling you
          that scale is rigged — and I cannot prove it and break the pod and stand
          off his man, all at once."
        completion:
          type: talk_to_npc
          npc: "Grett Bashan"
        npc_complete: >
          [He sets one huge hand flat on the shrinkage report, his four eyes steady
          on the figure at the bottom of it.] "A loader is supposed to do one thing
          honest — log the weight that's on the forks, true. The contractor who holds
          the loader pool on these bays has doctored the mass-sensors to log every
          load out light. The weight the rig never counts doesn't evaporate — it's
          pulled, by hand, out of salted ballast pods staged in a quiet bay, and run
          offworld by his partner while my crews get written up for stealing the
          holds they loaded. I can feel a rig logging short in the drift of it under
          a known weight, but a feeling does not pull a contractor's scale — a loader
          trace does. Take one of his powered loaders through the calibration cycle.
          Run it, and HOLD a true, known weight against the sensor — make the rig log
          short while you can feel it heavy, and put on the trace what I cannot put on
          a desk: that the scale logs short on purpose."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to Docking Bay 87 where the contractor's loaders work the merchant cargo, take a powered loader through the calibration cycle, and hold a true weight against the rigged sensor to make the rig log short — use your `powersuit operation` skill, then `chain attempt`."

      - step: 2
        title: "A True Weight"
        location: docking_bay_87
        npc: "(none)"
        npc_role: contact
        teaches: ["powersuit operation"]
        objective: "In Docking Bay 87, take a powered cargo-loader through the contractor's calibration cycle and hold a true, known weight against the rigged mass-sensor — a powersuit operation check."
        npc_intro: >
          [Docking Bay 87 is one of the busy ones, holds open and merchant cargo
          stacked for the loaders, and one of the contractor's powered loader-rigs
          stands racked and powered at the edge of the floor, harness open, the
          calibration cycle queued the way the contractor's crews run it before a
          shift.] A rigged loader only gives itself away to the being wearing it: the
          mass-sensor logs whatever weight the cycle tells it to, clean and certified,
          but the rig itself does not lie — couple a load to the forks and the drive
          braces for the true mass against the figure the sensor swears, and the gap
          is there in your arms and the rig's strain if you hold it long enough to
          read. Don't run the cycle the contractor's way and trust the number. Set a
          true, known weight on the forks and HOLD it against the sensor — make the
          rig brace for what it really carries while the scale logs it light — and the
          loader's own maintenance trace catches the gap between the weight you can
          feel and the weight it logged. `powersuit operation`, a loader's hands in a
          powered rig and a doctored sensor logging a lie under a true mass — `chain
          attempt` when you can hold the weight and put the short on the trace.
        completion:
          type: skill_check_passed
          skill: "powersuit operation"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [You couple a known load to the forks and take the rig through the cycle,
          and the rigged loader shows itself the moment it braces: the drive sets for
          the true mass on the forks — you can feel the rig take the real weight — and
          the mass-sensor logs it light, a clean slice short of what your arms and the
          loader's own strain both swear is there, the calibration cycle dressing the
          lie as a certified reading. You hold the true weight against it long enough
          for the maintenance trace to catch the gap, and there is the proof Bashan
          could feel and never show a desk: the loader does not weigh honest, it logs
          short, the same slice off every load, on purpose. Holding the weight isn't
          ending it — a short on a trace is a rigged scale; it is not yet the cargo
          that was pulled. The weight the rig never logged went somewhere, into a
          salted pod in a quiet bay, and that is where the proof finishes.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "You've proven the loader logs short — now prove the skim is theft. Go to Docking Bay 86 where the salted ballast pods stage, break the seal on one by hand (the loaders lock out the moment the trace is pulled), and restack the dead weight that hides the skim compartment — use your `lifting` skill, then `chain attempt`."

      - step: 3
        title: "Dead Weight"
        location: docking_bay_86
        npc: "(none)"
        npc_role: contact
        teaches: ["lifting"]
        objective: "In Docking Bay 86, break the seal on a salted ballast pod by hand and restack the dead weight hiding the skim compartment — a lifting check."
        npc_intro: >
          [Docking Bay 86 is the quiet one, a smaller pit off the main floor where the
          contractor stages the ballast pods between runs — and the instant the loader
          trace was pulled, every powered rig on the field locked out under the
          contractor's certification, so the proof has to finish the way the docks
          finished cargo before there were loaders: by hand.] A short on a trace is a
          rigged scale; the cargo pulled out of it is the theft — and the skim rides
          here, packed under honest dead-weight ballast inside a sealed pod so the pod
          scales true while a compartment in its core carries the weight no loader ever
          logged. No rig will lift the ballast for you now; the seal is a hand seal and
          the dead weight is a back's work. Break the pod's seal, haul out the ballast
          slabs stacked over the core, and restack them clear — get down to the skim
          compartment and the cargo pulled from a season of "short" loads, and prove
          the shortfall was never shrinkage. `lifting`, a stevedore's back against a
          pod built to scale honest over a buried skim — `chain attempt` when you've
          cleared the dead weight and opened the skim.
        completion:
          type: skill_check_passed
          skill: "lifting"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [You break the hand seal and start hauling, and the salted pod gives up the
          racket slab by slab: honest ballast stacked over a core compartment, dead
          weight set there so the pod scales true to its manifest while the slice
          pulled from every short load rides hidden underneath. You clear the ballast
          and restack it off the core by hand, and there is the skim — cargo lifted
          out of holds that weighed light at the far scale, packed away to run
          offworld, the weight the rigged loaders never logged sitting where no
          shrinkage report could ever put it. There is the whole of it now: the loader
          that logs short and the cargo pulled out of the short — the kind of proof
          the contractor left because he never thought a co-op he'd written off as
          thieves would run his loader, feel it logging short, and break a salted pod
          by hand to find what the scale never counted. But a trace and a broken pod
          on a bay floor are not a trace and a manifest on the port-authority desk,
          and the contractor has a man on the docks whose whole job is making sure the
          proof of a short-weight load never comes off the floor that carried it.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "You've logged the short and opened the skim — now get the proof to a desk. Carry the loader trace and the salted pod's manifest through the Dockside Cafe toward the spaceport port-authority desk, and stand off the contractor's collector when he comes for it — `attack`, `dodge`."

      - step: 4
        title: "The Collector"
        location: dockside_cafe
        npc: "Drozz Kael"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Carry the loader trace and the salted pod's manifest through the Dockside Cafe and stop Drozz Kael when the contractor's collector comes for it — `attack`, `dodge`."
        npc_intro: >
          [The dockside cafe is the easy, human end of the freight terminal — dim
          light, cold drinks, spacers and loaders resting between runs — and the quiet
          way from the bays toward the spaceport port-authority desk runs straight
          through it. A heavy-browed Klatooinian rises from a back table as you come
          through with the trace and the manifest under your arm, the leathery,
          deep-creased hide of his face unreadable, a worn blaster riding his hip with
          the ease of a being who collects more than he fights.] Drozz Kael — the man
          the loading contractor keeps on the docks to make sure a short-weight load's
          proof never comes off the bay floor, who walks a co-op away from the
          port-authority desk with a quiet word and a worse threat and rarely has to
          draw because a sealed scale and a shrinkage report do his arguing for him.
          He has watched a loader he expected to lose its tickets quietly turn around
          and pull the trace instead, and the easy menace of a man who collects from
          the written-up and the run-off goes hard. "That trace belongs to the
          contractor, friend — you ran his loader, you pulled his property. The
          shortfall's a shrinkage matter; it doesn't go on any port-authority desk."
          [He sets himself between you and the way to the desk.] "Hand it over and walk
          back to the bays, or you don't walk to that desk. The contractor's a patient
          man. I'm the part of him that came to collect."
        completion:
          type: combat_won
          enemy_template: "short_weight_enforcer"
          enemy_count: 1
        npc_complete: >
          [Drozz Kael goes down between the cafe tables, the blaster spinning away
          under a bench, and the spacers who have learned not to see a collection on
          the docks find somewhere else to look. The way to the port-authority desk
          stands clear. Take the proof with you — the loader trace that logged short
          under a true weight beside the salted pod's manifest and the skim pulled out
          of it — and there is nothing between here and the desk but the quiet cafe,
          the racket filed, and a co-op of clean crews who can fill a hold without
          losing a slice of it to a scale that calls them thieves.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The collector's down and the way to the desk is clear — get the loader trace and the salted pod's manifest filed at the spaceport port-authority desk, then go back to Grett Bashan at the Notsub Shipping lobby."

      - step: 5
        title: "An Honest Scale"
        location: notsub_shipping_lobby
        npc: "Grett Bashan"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Grett Bashan at the Notsub Shipping lobby with the short weight filed and the racket coming apart."
        npc_intro: >
          [Bashan is off the board when you come back through the lobby, standing
          straighter than a man one complaint from losing his crews has any right to,
          the shrinkage report gone from the board and a port-authority filing receipt
          in his huge hand, the freight clerks behind him running an honest manifest.]
          "Filed. The loader pulled and read against its own short trace, the salted
          pods flagged, the run offworld stopped, the crew that pulled the skim taken
          off the docks. They're pulling my co-op's 'shrinkage' off the record as we
          speak — re-filing a season of it as the short-weight theft it always was."
          [He looks at the receipt the way a loader looks at a scale that finally reads
          true.] "A whole season that contractor sold the field a sealed scale and
          called my clean crews thieves to cover it. `talk` to me and let me say it
          plain, while there's finally a desk with a seal on it that has to hear it."
        completion:
          type: talk_to_npc
          npc: "Grett Bashan"
        npc_complete: >
          "Here's your fee — and worth twice the credits to hand it to the hand who
          ran a loader and felt it logging short, broke a salted pod by hand when the
          rigs locked out, and stood in the cafe when the collector came for the
          proof. A short on a trace proves a rigged scale; the cargo out of the pod
          ends a racket. The loaders come off the bays and get re-certified, the
          salted pods get flagged, the crews stop losing a slice of every load to a
          'certified' scale, and my six get their tickets and their names back instead
          of a shrinkage report that called them thieves. The bay floor is a small
          world for all the cargo that moves across it, and a loading crew learns fast
          who sold it an honest scale and who sold it a short one. When a co-op on
          these docks is handed a manifest it can't trust, there's a name they'll send
          for now. Carry mine with it — and weigh your own loads by what's on the
          forks, not what the scale logs; I'd not have the hand that read this one
          trust a figure it couldn't feel was true."
        # graduation closes the arc; no extra on-completion side effects.
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The short weight is filed and the racket is coming apart: the contractor's
          loaders die as a calibration trace names the short they logged and the
          salted pod names the skim pulled out of it, a season of one co-op's
          "shrinkage" becomes a short-weight theft on the port-authority record, and a
          floor of independent crews who could only learn whether a scale was honest
          from the man who certified it learns it never needed his loaders to fill a
          hold true at all. A hand who can run a loader and feel it logging short,
          break a salted pod by hand when the rigs lock out, and stand in the way when
          the collector comes has a way of being sent for — the Mos Eisley docks carry
          a name now, out where the cargo moves and an honest scale is the difference
          between a clean crew and a name as thieves.

  # ─────────────────────────────────────────────────────────────────────
  # GENERALIZED QUESTLINE — "The Wreckers' Light" (nar_shaddaa_wreckers_light)
  # The TWENTIETH accessible (non-t5, non-tutorial) kind:questline chain, the
  # SECOND set on NAR SHADDAA — and the FIRST on the CORELLIAN-SECTOR / PROMENADE
  # DOCKS face: the old Corellian spacer enclave, the information-broker's comm-feed
  # den, the leased Promenade trade tower, and the hollowed-spire market
  # (old_corellian_quarter / the_grid / promenade_corporate_tower / vertical_bazaar),
  # reusing NONE of The Wasting Ward's refugee-and-undercity rooms — every room fresh
  # to the corpus. Where that worked the undercity warrens, this works the SPACER
  # DOCKS — the trade-tower district and old captains' enclave of the Smugglers'
  # Moon's busiest approach. A FALSE-BEACON / WRECK-LURING (salvage) racket: a
  # freelance salvage outfit, Coreward Salvage & Reclamation, plants spoofed distress
  # and navigation beacons on the outer Corellian-sector approach — calls that read as
  # a foundering ship to any decent spacer, set on a bearing that drags whoever
  # answers them off the charted corridor into the Saljenn Drift, a derelict field and
  # gravity-shadow that kills a ship that strays in. The outfit logs the dead ship as
  # a fresh "derelict," files a salvage claim, and strips and fences the hull, while
  # the dock authority writes each loss up as one more independent who flew the Drift
  # on bad piloting and the approach earns a name as a killing lane that herds honest
  # traffic onto the outfit's own escort service. A captain who answered one of those
  # lights and lost his ship and two crew in the Drift is grounded and unheard —
  # beaten by SIGNALS-AND-LANES work: work the information-broker's comm-feed grid to
  # capture the spoofed distress beacon and triangulate the transmitter that fakes it,
  # proving the call a plant and not a foundering ship (communications), lay the
  # outfit's filed claim coordinates over the system's true approach lanes to prove
  # every claimed wreck sits off the corridor on the beacon's drag-bearing inside the
  # Drift, engineered and not accident (planetary systems), stand off the outfit's
  # claims-agent who comes for the proof (combat), and get the beacon trace and the
  # claim overlay to the dock authority's claims board. The TWENTIETH distinct skill
  # spread (communications — Mechanical — + planetary systems — Knowledge), the FIRST
  # accessible arc to reward the SIGNALS-AND-LANES INTEL build (a comm board and a
  # chart table), mechanically distinct from the only prior arc to work a sensor/comm
  # feed — The Sabotaged Run (sensors + repulsorlift operation, a ground speeder racer
  # reading doctored telemetry, who works SENSORS not the comm set and drives a
  # repulsor speeder not a comm trace) — and from the only prior arc to plot the void —
  # The Condemned Hull (space transport repair + astrogation, a starship
  # engineer-navigator who plots a HYPERSPACE JUMP and services a sealed hull, not a
  # star system's sublight approach lanes and hazards). The Hutt-front dock authority
  # that watches the approach for Republic interdiction (named in the upper-dock and
  # Grid room text) stays distant background — and is the pragmatic local power a
  # freelance outfit poaching the moon's own approach lanes runs afoul of in the end —
  # the way every prior accessible arc keeps the war offstage. Reuses the live
  # questline engine (kind:questline + active_questline + existing event types + the
