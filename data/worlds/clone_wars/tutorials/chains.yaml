  - chain_id: tatooine_market_kept_watch
    chain_name: "The Kept Watch"
    description: >
      On the Mos Eisley market shop row — the row of independent storefronts off the
      spaceport, a general store, a banking concern, a weapon shop, and the Jawa traders'
      stalls — a retired sector-watch deputy named Oren Vask keeps a store and knows the
      break-ins are staged and cannot prove it. There is a leased "civil patrol" outfit
      holding a Mos Eisley town watch license, Vorrun Civil Patrol, and it sells the row
      protection against break-ins and vandalism, then stages those break-ins itself on the
      shops that will not pay or will not renew: it opens locks it does not force, damages
      the insured stock and never the till, keeps the patrol a street away when it happens
      and first on the scene after, and files a stamped incident report before the dust
      settles — padding the reports to justify a rising fee and to drive the holdouts out
      so its own front buyers can take the emptied stalls, the shops robbed by the watch
      they pay to be safe from while the town reads the reports as honest patrol work. Vask
      turned in a deputy's badge years ago and has kept Lup's General Store on the row ever
      since, and he wrote a great many real break-in reports in his years on the watch and
      knew these for staged the first time he saw one. But a retired deputy with no badge
      does not get a licensed outfit's reports pulled on his say-so, and he cannot pull the
      reports and prove them staged, set the interception that catches the next staged hit,
      and stand off the outfit's lead patroller all in one watch before the next holdout's
      shop burns. He needs a neutral hand who can do the three things he cannot: pull Vorrun
      Civil Patrol's filed incident reports at the banking concern where the shops lodge
      their loss claims and read them against how a real enforcement scene is documented, to
      prove the break-ins staged and not real; read the outfit's patrol and collection
      pattern and set the interception at the next holdout's shop so the staged hit is
      caught in the act and the proof cannot be carried off; and carry the proof to the one
      desk a town watch license answers to — before the outfit's patroller can take it back,
      and before the next holdout's shop goes up. A freelance favor — open to anyone, no
      faction required.
    archetype_label: "Freelance Deputy's Favor"
    faction_alignment: independent
    starting_zone: tatooine_market
    starting_room: lups_general_store
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["kept_watch_cleared"]
      drop_room: lups_general_store
      follow_up_hint: >
        The report audit and the in-the-act proof reach the Mos Eisley licensing prefect
        and the racket comes apart with them: Vorrun Civil Patrol's reports are read for
        the staged break-ins they cover, the outfit's town watch license pulled, the shops'
        protection fees refunded, the holdouts' losses laid at the outfit's own door, and
        its front buyers' claims on the emptied stalls voided. The outfit that lived by
        break-ins the town read as real and reports no one ever laid beside its own
        duty-log finds the one thing the racket needed buried — its filed reports read
        against real procedure, set beside a staged hit caught in the act — read into the
        record at the desk it was certain it could never reach. The patroller who meant to
        walk one more holdout's shop into ash collects nothing but a pulled license. Word
        travels the shop row the way it never travels the prefect's office: there is a hand
        who can read a staged break-in off a stamped report, set the trap that catches the
        watch at its own work, and stand in the way when the patroller comes — and the
        shopkeepers who have been paying a watch to break into the row next door stop
        believing the break-ins are real just because the report is filed in order.

    steps:
      - step: 1
        title: "The Watch That Robbed the Row"
        location: lups_general_store
        npc: "Oren Vask"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Oren Vask behind the counter of Lup's General Store on the Mos Eisley market shop row."
        npc_intro: >
          [A spare, grey-templed human stands behind the counter of a general store gone
          quiet, the shelves thinner than they were and the door barred with a length of
          pipe within reach — but he stands square to the door the way a man stands who
          once walked a beat.] "You can read a scene? Then you'll read these straighter
          than the prefect will. I'm Oren Vask — twenty years on this sector's watch
          before I hung up the badge for this counter. `talk` to me. Vorrun Civil Patrol
          came around with a town license and a fee for protection, and the shops that pay
          stay whole and the shops a contract behind get broken into. I wrote a hundred
          real break-ins in my time. These aren't break-ins — and the paper's all in
          order, so the prefect calls it honest patrol work and I can't prove it off the
          reports and set the trap and stand off Vorrun's man, all at once."
        completion:
          type: talk_to_npc
          npc: "Oren Vask"
        npc_complete: >
          [He sets a worn store ledger on the counter beside a Vorrun Civil Patrol fee
          notice, one finger moving down the column of shops that paid against the column
          that got hit.] "There's who pays, and there's who burned, and they're the same
          list a contract behind — every time. The locks get opened, not forced. The
          damage is tidy and it's always the insured stock, never the till. The patrol's
          a street away when it happens and first on the scene after, and the report's
          stamped before the dust settles. That's the watch robbing the shops it's paid to
          guard. The outfit files its reports at Zygian's, with the shops' loss claims — go
          there and pull them, and read them against how a real scene gets written. You'll
          see the staging in the paper. Put that where a prefect has to read it."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to Zygian's Banking Concern, where the shops lodge their loss claims and Vorrun Civil Patrol files its incident reports, and pull the reports — read them against how a real enforcement scene is documented to prove the break-ins were staged, not real. Use your `law enforcement` skill, then `chain attempt`."

      - step: 2
        title: "The Reports That Read the Same"
        location: zygians_banking
        npc: "(none)"
        npc_role: contact
        teaches: ["law enforcement"]
        objective: "At Zygian's Banking Concern, pull Vorrun Civil Patrol's filed incident reports and read them against real enforcement procedure to prove the break-ins were staged — a law enforcement check."
        npc_intro: >
          [Zygian's Banking Concern is where the row's shops lodge their loss claims and
          where a licensed patrol files its incident reports, and a patrol's report is a
          thing of ordinary record: a scene noted, a forced entry described, a loss
          itemized, a patrol response logged — and that is exactly the cover, a staging
          dressed as an honest scene write-up.] A real break-in leaves a real scene: the
          lock forced where the report says forced, the entry where a thief would make one,
          the loss where the easy money is, the report filed after a patrol that was
          somewhere else. These do not. Pull Vorrun's filed reports and read them the way a
          watch officer reads a scene the patrol wrote up — the "forced" locks against
          what a forced lock actually leaves, the timestamps against when the patrol logs
          put its people on the row, the loss against what a real thief takes, the MO across
          a dozen "unrelated" hits that all read the same hand. `law enforcement`, a watch
          officer's eye for a scene and a report that lies by procedure and not by forgery —
          `chain attempt` when you've read the reports and proven the break-ins staged.
        completion:
          type: skill_check_passed
          skill: "law enforcement"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [You pull the filed reports and read them the way you would read a scene, and the
          racket shows itself in the procedure: not one "forced" lock leaves the splintering
          a forced lock leaves; every entry is made where a key-holder would enter, not
          where a thief would; every loss is the insured stock the claim pays out on and
          never the till a real thief empties first; and the report timestamps put the
          patrol filing the scene at hours its own duty-log has it three streets away — and
          the same hand wrote every one, the same phrasing, the same tidy scene, a dozen
          "unrelated" break-ins that are one patrol's signature repeated. There is the proof
          Vask could read and never make heard: the break-ins are the watch's own work,
          staged on the shops a contract behind and written up as real. But a report audit
          is not a staged hit caught in the act, and the outfit runs a clockwork patrol that
          will burn the next holdout on schedule — and a staged break-in caught while it
          happens, laid beside your audit, is what turns a suspicious stack of reports into
          a proven racket.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "You've proven the break-ins staged on paper — now catch one in the act. Go to Kayson's Weapon Shop, the holdout that refused to renew and is next on the outfit's schedule, read the patrol's pattern, and set the interception so the staged hit is caught as it happens — use your `tactics` skill, then `chain attempt`."

      - step: 3
        title: "The Trap at the Holdout"
        location: kaysons_weapon_shop
        npc: "(none)"
        npc_role: contact
        teaches: ["tactics"]
        objective: "At Kayson's Weapon Shop, read Vorrun Civil Patrol's patrol pattern and set the interception so the staged break-in is caught in the act and the proof cannot be carried off — a tactics check."
        npc_intro: >
          [Kayson's Weapon Shop is the row's holdout — it would not renew Vorrun's fee, and
          a holdout a contract behind is a shop with a "break-in" coming, on a schedule the
          outfit keeps like clockwork. The patrol runs the same beat the same hours; the
          staging hits the same dead window when the patrol is logged elsewhere; the
          junior watchman who does the torching comes and goes the same approach every
          time.] You do not need to guess when; you need to read the beat and be where the
          watchman will be, with the proof of it in hand before he can carry it off. Read
          the patrol's pattern off what it does — the dead window in the duty-log, the
          approach the staging uses, the way the "first responder" arrives — and set the
          interception so the staged hit at Kayson's is caught as it happens and the proof
          is yours, not the outfit's to spirit away. `tactics`, a watch officer's read of a
          beat and the anticipation to be one step ahead of it — `chain attempt` when
          you've set the trap and caught the staged hit in the act.
        completion:
          type: skill_check_passed
          skill: "tactics"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [You read the beat the way the watchman who keeps it never expects an outsider to
          and you are waiting at Kayson's in the dead window when he comes — the junior
          watchman in a patrol jacket, with the outfit's own opener and a can of the tidy
          accelerant that only ever touches insured stock, doing at the holdout exactly what
          the reports describe a thief doing, an hour before the patrol's own log will have
          him three streets off "responding." You take it cold — the watchman, the opener,
          the accelerant, the half-written report already in his jacket dated to a break-in
          that has not happened yet — and the staging stands caught in the act, the one
          thing the stack of filed reports could never be argued past. Now the audit has the
          break-in caught while it happened, the suspicious stack is a proven racket, and
          there is a watchman who staged it standing in his own patrol jacket. But a report
          audit and a caught watchman on the row are not a report audit and a caught
          watchman on the prefect's desk, and the outfit has a man whose whole job is making
          sure a staged break-in never gets read as anything but real.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "You've proven the break-ins staged and caught one in the act — now get the proof to a desk. Carry the report audit and the caught-in-the-act proof through the Jawa traders' stall lane toward the Mos Eisley licensing prefect, and stand off the outfit's lead patroller when he comes for it — `attack`, `dodge`."

      - step: 4
        title: "The Lead Patroller"
        location: jawa_traders
        npc: "Dussek Rao"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Carry the report audit and the in-the-act proof through the Jawa traders' stall lane and stop Dussek Rao when the outfit's lead patroller comes for it — `attack`, `dodge`."
        npc_intro: >
          [The Jawa traders' stall lane is a crowded run of droid parts and salvage and
          haggling under patched awnings, and the way from the holdout toward the Mos Eisley
          licensing prefect crosses it. A broad, leather-skinned Weequay steps out from
          between the stalls as you come through with the report audit and the caught
          watchman's proof under your arm, a worn blaster riding under a patrol jacket with
          a Vorrun Civil Patrol flash at the shoulder, the unhurried weight of a being who
          collects more than he fights.] Dussek Rao — the lead patroller Vorrun keeps on the
          row to make sure a shop that pays stays paid, a street away when a holdout burns
          and first through the door after with a report half-written. He has watched a
          retired deputy he expected to keep his head down put an outsider onto the reports,
          and the easy menace of a man who collects from the frightened goes hard. "That's
          outfit paper you're carrying, friend — our reports, our license. The break-ins are
          real; the row's lucky to have a watch at all, the way this town runs. It doesn't
          go on any prefect's desk." [He sets himself across the lane between you and the way
          out.] "Hand it over and walk back out, or you don't walk to that desk. The
          outfit's a patient sort. I'm the part of it that came to collect."
        completion:
          type: combat_won
          enemy_template: "kept_watch_enforcer"
          enemy_count: 1
        npc_complete: >
          [Dussek Rao goes down in the dust of the stall lane, the blaster spinning away
          under a Jawa cart, and the traders who have learned, the way the shopkeepers
          learned, not to watch a collection on the row find somewhere else to look. The
          way out toward the prefect's desk stands clear. Take the proof with you — the
          filed reports read against real procedure beside the staged break-in caught in the
          act — and there is nothing between here and the desk but the lane, the racket
          proven, and a row that can have its watch pulled.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The patroller's down and the way out is clear — get the report audit and the caught-in-the-act proof filed with the Mos Eisley licensing prefect, then go back to Oren Vask at Lup's General Store."

      - step: 5
        title: "The Row's Watch Back"
        location: lups_general_store
        npc: "Oren Vask"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Oren Vask at Lup's General Store with the staged-protection racket filed and coming apart."
        npc_intro: >
          [Vask is standing square to the door when you come back, the barred pipe set aside
          and a prefect's licensing notice in his hand, watching the row's foot traffic pick
          up past his window with the look of a man reading a beat that has finally gone
          quiet the right way.] "Filed. Vorrun Civil Patrol's reports read for the staged
          break-ins they covered, the license pulled, the fees coming back to the shops, the
          holdouts' losses laid at the outfit's own door, its buyers' claims on the empty
          stalls voided. The prefect's no friend of this row — but a protection outfit
          forging reports under a town watch license is the town's own license made
          worthless, and that the prefect would not have." [He turns the notice over the way
          a watch officer checks a scene one last time.] "A season that outfit broke into
          this row and called it a watch, and the paper was all in order, so it was honest.
          `talk` to me and let me say it plain, while there's finally a desk with a stamp on
          it that has to hear it."
        completion:
          type: talk_to_npc
          npc: "Oren Vask"
        npc_complete: >
          "Here's your fee — what a quiet store on a shaken-down row still turns, and worth
          twice the credits to hand it to the hand who read a staged break-in off a stamped
          report, set the trap that caught the watch at its own work, and stood in the lane
          when the patroller came for the proof. A report audit proves a break-in false; a
          staged hit caught in the act ends a racket. The license gets pulled, the shops get
          their fees and their losses back, the next holdout stops paying a watch to break
          into the row next door, and a season of shopkeepers who could only pay or burn get
          read for the marks they were. The row's a small world for all the traffic that
          crosses it, and a shop learns fast who read a staged report straight and who kept
          the watch that robbed them. When a shopkeeper on this row gets a fee notice and a
          patrol that's always a street away, there's a name they'll send for now. Carry
          mine with it — and read a break-in by what the scene shows, not by how good the
          report looks; I'd not have the hand that proved this one take a watch on faith."
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The shop row's watch is filed pulled and the racket is coming apart: Vorrun Civil
          Patrol's protection dies as a report audit proves the break-ins staged and a
          staged hit caught in the act names the patrol's own work, a season of one outfit's
          "honest patrols" becomes a forgery racket on the town's licensing record, and a
          row of shopkeepers who could only learn whether a break-in was real by being
          robbed learns to read the scene before they pay the watch. A hand who can read a
          staged break-in off a stamped report, set the trap that catches the watch at its
          own work, and stand in the way when the patroller comes has a way of being sent
          for — the Mos Eisley shop row carries a name now, out where the storefronts stand
          and an honest scene is the difference between a watch and a robbery with a license.

  # ─────────────────────────────────────────────────────────────────────
  # GENERALIZED QUESTLINE — "The Buried Block" (coruscant_buried_block)
  # The TWENTY-THIRD accessible (non-t5, non-tutorial) kind:questline chain, the FOURTH set
  # on CORUSCANT — and the FIRST on the SOUTHERN UNDERGROUND / undercity face (the
  # southern_underground zone): the deep lower-city under the towers — a tenement stack, a
  # descent shaft down into the dark, the deepest sealed level, and the lower-city black
  # market (underground_tenement_block / lower_descent / southern_underground / lower_market),
  # reusing NONE of The False Provenance's Monumental-District rooms, The Sealed Ledger's
  # Commercial-District rooms, or The Twisted Word's Entertainment-District rooms — every room
  # fresh to the corpus, and the undercity has never carried an accessible questline before.
  # Where those worked the monuments, the works district, and the Gilded Cage, this works the
  # DEEP — the dark levels under the city's floor. A FALSE-DERELICTION / ENTRAPMENT-FOR-SALVAGE
  # racket: a deep-level salvage-and-redevelopment outfit, Sennat Reclamation, filed a
  # dereliction survey with the Lower City Reclamation Board declaring an inhabited deep
  # tenement pocket (the Warren-Nine block) structurally abandoned and uninhabited, won a
  # salvage-and-redevelopment claim on it, then collapsed and welded the block's only
  # serviceable access shaft to enforce the lie — sealing the residents in below so none could
  # surface to contest the survey — while its strip crew works the level and the sealed run
  # short of air and water. A forty-year lower-city conduit climber who knows the dark shaft
  # network and has kin sealed in below is too old to make the descent and unheard against a
  # filed survey — so the racket is broken by DEEP-DESCENT / ENDURANCE-RESCUE work: go down
  # the sealed access by the broken conduit shafts the crew thinks impassable (climbing/
  # jumping), endure the deep level's foul air and heat to reach the Warren-Nine pocket and
  # clear and hold a route to bring the trapped residents up (stamina), stand off the crew's
  # enforcer posted at the lower-city black market who comes for the freed and the proof
  # (combat), and get the freed residents and the proof of habitation to the Lower City
  # Reclamation Board. The TWENTY-THIRD distinct skill spread (climbing/jumping + stamina —
  # both Strength, the FIRST both-Strength spread of the corpus), the FIRST accessible arc to
  # reward the DEEP-DESCENT / ENDURANCE-RESCUE / FREE-CLIMBER build (the broken shaft and the
  # held route), and the FIRST physical rescue — mechanically and thematically distinct from
  # the only prior rescue, The Lost Courier (a kidnap-trace worked by investigation, a single
  # person ransomed), and from the only prior false-status-seizure, The Condemned Hull (space
  # transport repair + astrogation, a shipwright-navigator who falsely declares a SOUND ship a
  # derelict to scrap it). This declares an INHABITED level a derelict to seize and strip it,
  # and is worked by going down the dark after the people the lie buried. The Senate, the
  # Jedi, and the Republic war effort overhead have no reach this deep and never appear, and
  # the outfit is run afoul of in the end by the lower-city's own Coruscant Works reclamation
  # board, which will not have a salvage outfit fake a level derelict and seal its residents
  # in — the way every prior accessible arc keeps the larger powers offstage. Reuses the live
  # questline engine (kind:questline + active_questline + existing event types + the four
  # reward funnels) with NO new engine code, no new slot/event type, no schema migration, no
  # new reward faucet, and NO map-coordinate or exit-graph change.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: coruscant_buried_block
    chain_name: "The Buried Block"
    description: >
      In the Coruscant southern underground — the deep lower-city levels under the towers, a
      tenement stack over a descent shaft, the dark sealed level below, and the lower-city
      black market where the deep comes up — an old conduit climber named Tomar Hess knows a
      block of people has been sealed in below and cannot prove it. There is a deep-level
      salvage-and-redevelopment outfit, Sennat Reclamation, and it filed a dereliction survey
      with the Lower City Reclamation Board declaring the Warren-Nine block — an inhabited
      tenement pocket with forty-odd people still living in it — structurally abandoned and
      uninhabited, and won a salvage-and-redevelopment claim on it; then, the day the survey
      went in, the crew collapsed and welded the block's only serviceable access shaft to
      enforce the lie, sealing the residents in below so none could surface to call the survey
      false, and put a strip crew to work the level while the sealed run short of air and
      water. Hess has kept a room in the stack above for forty years and went down its shafts
      for a living, and he knows the dark conduit network the crew never bothered to map and
      a back route down through the old utility conduits they left for impassable. But a
      climber gone grey in the knees cannot make that descent, endure the deep, clear and hold
      a route for forty people, and stand off the crew's posted enforcer all in one go, and a
      squatter's word against a filed survey is the word of one more lower-city nobody. He
      needs a neutral hand who can do the three things he cannot: go down the sealed access by
      the broken conduit shafts the crew thinks impassable; reach the Warren-Nine pocket
      through the deep's foul air and bring the trapped residents up; and carry the freed and
      the proof of their habitation to the one desk that can void the claim — before the survey
      goes final and the block is gone for good. A freelance favor — open to anyone, no faction
      required.
    archetype_label: "Freelance Climber's Favor"
    faction_alignment: independent
    starting_zone: southern_underground
    starting_room: underground_tenement_block
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["buried_block_cleared"]
      drop_room: underground_tenement_block
      follow_up_hint: >
        The freed residents and the proof of habitation reach the Lower City Reclamation Board
        and the racket comes apart with them: forty living people are the survey's lie made
        flesh, the dereliction claim is voided, Sennat Reclamation's salvage-and-redevelopment
        rights are pulled, the sealing of an inhabited level is laid at the outfit's own door,
        and the offworld redeveloper's purchase of the cleared block falls through. The outfit
        that lived by a sealed block that surfaced nothing — no resident, no witness, no proof
        the survey lied — finds the one thing the racket needed buried come up the stairs
        breathing: forty people the survey swore were never there, set down at the desk it was
        certain they could never reach. The enforcer who meant to keep one more level sold
        collects nothing but a pulled claim. Word travels the lower city the way it never
        travels a board's claims record: there is a hand who will go down a sealed shaft after
        the people a survey buried, last in the deep long enough to bring them up, and stand
        the choke when the crew comes — and the lower-city dwellers who have learned not to ask
        where a salvage outfit puts a seal stop believing a level is empty just because the
        survey is filed in order.

    steps:
      - step: 1
        title: "The Level With Lights in Its Windows"
        location: underground_tenement_block
        npc: "Tomar Hess"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Tomar Hess on the lip of a dead service hatch in the Southern Underground tenement stack."
        npc_intro: >
          [A wiry, grey-cropped human sits on the lip of a dead service hatch with a coil of
          old conduit line across his knees, his hands moving on it out of forty years of
          habit, and he reads you the way a man reads a shaft before he trusts it.] "You can
          go down? Then you'll do what I can't, and the board won't. I'm Tomar Hess — forty
          years I went down these shafts when the lower city needed a main fixed three levels
          under anywhere anyone else would go. `talk` to me. The Warren-Nine block below had
          lights in its windows a season ago — forty people, my sister's family among them.
          Then Sennat Reclamation filed a survey that calls it abandoned, and the day the
          survey went in they dropped the access shaft and welded it. You don't abandon a
          level and then seal it. You seal it and call it empty after, with the people still
          inside — and a filed survey beats a squatter's word every day of the week."
        completion:
          type: talk_to_npc
          npc: "Tomar Hess"
        npc_complete: >
          [He lays the coil of conduit line out across the dead hatch and traces a run of it
          down with one finger, the way a man traces a shaft he climbed in the dark.] "The
          good access is collapsed and welded — the crew made sure. But there's an old utility
          conduit they left for impassable because they never went down it, and I did, a
          hundred times. It still goes down. A climber could take it — I can't, not on these
          knees, not down and back up with forty people and a fight at the top. Go down it.
          Reach the block. Bring them up where Sennat swears there's nobody to bring. Forty
          living people the survey says were never there — that's the one thing that voids his
          claim, and it's sealed under our feet running out of air."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Lower City Descent, where the Warren-Nine block's access shaft was collapsed and welded, and take the old utility conduit down — the broken shaft route the salvage crew left for impassable. Use your `climbing/jumping` skill, then `chain attempt`."

      - step: 2
        title: "The Conduit They Left for Impassable"
        location: lower_descent
        npc: "(none)"
        npc_role: contact
        teaches: ["climbing/jumping"]
        objective: "At the Lower City Descent, take the old utility conduit down past the collapsed and welded access shaft to reach the sealed Warren-Nine block — a climbing/jumping check."
        npc_intro: >
          [The Lower City Descent is where the Warren-Nine block's access shaft used to run,
          and the crew did its work here: the shaft dropped and welded over, a slab of fused
          spoil where a stairway was, and a Sennat Reclamation seal-tag stamped across it that
          calls the level below condemned and closed. The good way down is gone on purpose.]
          But the stack is older than the survey, and an old conduit climber knew runs no
          salvage crew ever maps — a utility conduit beside the dead shaft, half-collapsed,
          its ladder rungs sheared, the kind of broken drop a crew writes off as impassable
          because they never went down it and would not. It still goes down. Take it: find the
          rungs that hold and the runs that don't, swing the dead gaps where the ladder is
          gone, and work the broken conduit down past the welded shaft into the dark of the
          sealed level. `climbing/jumping`, a conduit climber's nerve on a drop everyone else
          calls closed — `chain attempt` when you've taken the conduit down to the block.
        completion:
          type: skill_check_passed
          skill: "climbing/jumping"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [You take the broken conduit the way Hess swore it could be taken — the rungs that
          hold, the dead gaps swung, the half-collapsed runs ridden down past the welded slab
          where the crew was sure no one would follow — and the conduit lets you out into the
          dark of the Warren-Nine block, below the seal, where the survey says there is nothing
          and no one. There is everything and everyone: a deep tenement pocket with its power
          cut and its access dropped, forty-odd people sealed in it a season, their water
          rationed to nothing and the air gone thick and foul, waiting in the dark under a
          level a salvage crew has already sold. The descent the crew called impassable is the
          one way in and the one way out, and it is a long, foul climb back up with people
          who have not eaten in days — but the lie is broken the instant you stand in the
          block: it is not abandoned, and it never was. Now they have to be brought up through
          the deep, and that is the part that breaks a strong back, not the climb.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "You've reached the sealed block — now bring its people out. In the deep of the Southern Underground, endure the block's foul air and heat and clear and hold a route up the conduit to bring the trapped residents to the surface — use your `stamina` skill, then `chain attempt`."

      - step: 3
        title: "The Long Way Up"
        location: southern_underground
        npc: "(none)"
        npc_role: contact
        teaches: ["stamina"]
        objective: "In the deep of the Southern Underground, endure the sealed block's foul air and heat and clear and hold a route up the conduit to bring the trapped Warren-Nine residents to the surface — a stamina check."
        npc_intro: >
          [The deep of the Southern Underground is a hard place to last in: the Warren-Nine
          block's air is gone foul with a season of forty people and no circulation, the heat
          off the recycler stacks three levels under sits on everything, and the only way out
          is the broken conduit you came down — a long, vertical, hand-over-hand haul with the
          weak and the old and the children of a sealed level who cannot make it on their own.]
          This is not a climb you win with nerve; it is one you win by not stopping — clearing
          the choked runs and the collapsed gaps in the conduit a body at a time, taking the
          load of the ones who cannot climb, and going up and back down and up again through
          the foul air and the heat until the whole block is above the seal. It is the part
          Hess could not do, grey in the knees, and it is the part the crew counted on no one
          doing: lasting in the deep long enough to bring forty people up a broken shaft.
          `stamina`, the lungs and the back to keep going up the dark when stopping is easier
          — `chain attempt` when you've held the route and brought the block up.
        completion:
          type: skill_check_passed
          skill: "stamina"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [You last in the deep the way the crew was sure no one would — clearing the choked
          runs a body at a time, shouldering the load of the ones who cannot climb, going up
          and back down and up again through the foul air and the recycler heat until your
          lungs burn and your arms are dead and the whole Warren-Nine block stands above the
          seal, blinking in the dim of the levels the survey swore they had left forever. Forty
          living people, up out of a level a salvage crew sold as empty, every one of them the
          lie made flesh: the survey said abandoned and uninhabited, and here is the block,
          breathing, brought up a shaft the crew welded shut. The proof cannot be argued past
          now — it is people, not paper. But there is the surface yet to cross to the
          Reclamation Board, and Sennat keeps a man on the routes where the deep comes up, to
          make sure a block he has already sold never surfaces anything but salvage.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "You've brought the block up — now get it to a desk. Bring the freed residents and the proof of their habitation through the Lower City Black Market toward the Lower City Reclamation Board, and stand off the salvage outfit's enforcer when he comes to drive them back down — `attack`, `dodge`."

      - step: 4
        title: "The Choke at the Market"
        location: lower_market
        npc: "Brunt Kosh"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Bring the freed Warren-Nine residents through the Lower City Black Market and stop Brunt Kosh when the salvage outfit's enforcer comes to drive them back down — `attack`, `dodge`."
        npc_intro: >
          [The Lower City Black Market is a low, crowded choke of stalls and salvage where the
          deep levels surface, and the way from the conduit toward the Lower City Reclamation
          Board comes up through it. A heavy, tusked Aqualish shoulders off a stall post as you
          come up with the Warren-Nine block's people behind you and the proof of them in hand,
          a worn blaster under a salvage crew's grimed jacket and a Sennat Reclamation tag at
          his collar, the flat patience of a being paid to make sure nothing comes up a
          stairwell it shouldn't.] Brunt Kosh — the enforcer Sennat posts where the deep comes
          up, to walk the curious back down and keep a sold level surfacing nothing. He has
          watched an outsider come up a conduit the crew swore was impassable, the wrong way,
          with the sealed level breathing behind them, and the easy menace of a man who keeps a
          choke goes hard. "That's a sealed level you're bringing up, friend — Sennat's claim,
          Sennat's salvage. The block's abandoned; there's nobody down there and there never
          was, the way the survey reads. It doesn't go up to any board." [He sets himself
          across the choke between you and the way out.] "Take them back down and walk out, or
          you don't walk to that desk. Sennat's a patient outfit. I'm the part of it that keeps
          a level sold."
        completion:
          type: combat_won
          enemy_template: "buried_block_enforcer"
          enemy_count: 1
        npc_complete: >
          [Brunt Kosh goes down in the press of the market, the blaster knocked spinning under
          a salvage stall, and the lower-city traders who have long since learned not to watch
          where a crew puts a seal find somewhere else to look. The way up toward the
          Reclamation Board stands clear, and the Warren-Nine block stands behind you,
          breathing, on the surface. Take them on — forty people up out of a level a survey
          swore was empty — and there is nothing between here and the board's desk but the
          stairs, the claim broken, and a block the lower city can have its people back in.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The enforcer's down and the way up is clear — get the freed residents and the proof of their habitation to the Lower City Reclamation Board, then go back to Tomar Hess in the tenement stack."

      - step: 5
        title: "The Block Back in the Light"
        location: underground_tenement_block
        npc: "Tomar Hess"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Tomar Hess in the Southern Underground tenement stack with the Warren-Nine block freed and the dereliction claim coming apart."
        npc_intro: >
          [Hess is on his feet when you come back, the coil of conduit line hung up on its peg
          and a Reclamation Board notice in his hand, watching the stack's foot traffic move
          again past the rooms that were dark a season — and there is his sister's family among
          it, up out of the deep.] "Up. All of them. The board read forty living people off a
          level its own survey called empty, voided the claim, pulled Sennat's salvage rights,
          laid the sealing of an inhabited block at the outfit's own door — and the offworld
          buyer's purchase of the cleared level fell through the moment the level wouldn't stay
          cleared. The board's no friend of the deep — but a salvage outfit that fakes a level
          derelict and seals its people in to enforce the lie has made the board's own claims
          record a fraud, and that the board would not have." [He turns the notice over the way
          a climber checks a knot one last time.] "A season they sealed a block of people in
          the dark and called it empty, and the survey was all in order, so it was honest.
          `talk` to me and let me say it plain, now there's a desk that has to hear it."
        completion:
          type: talk_to_npc
          npc: "Tomar Hess"
        npc_complete: >
          "Here's your fee — what a stack-bound old climber's saved against a dark day, and
          worth twice the credits to hand it to the hand that went down a shaft I can't take
          anymore and brought my sister's family back up into the light. A survey can call a
          level empty; forty people up a welded shaft says it lied. The claim's pulled, the
          block gets its people back, the next survey that calls a deep level abandoned gets
          read against the lights in its windows, and a season of folk sealed in the dark to
          make a salvage claim true get counted for the living they always were. The lower
          city's a deep place and word goes down it slow, but it goes — a shop, a stack, a
          level learns fast who'll go down a sealed shaft after the buried and who'll weld it
          shut and call it empty. When a block in this underground gets a dereliction notice
          and a crew with a welding torch, there's a name they'll send for now. Carry mine with
          it — and read a level by the lights in its windows, not by how clean the survey reads;
          I'd not have the hand that brought this block up take a sealed shaft on faith."
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The Warren-Nine block is up out of the dark and the racket is coming apart: Sennat
          Reclamation's claim dies as forty living people void the dereliction survey and the
          sealing of an inhabited level becomes a reclamation fraud on the board's own claims
          record, a season of folk buried under a sold level are counted for the living they
          were, and a lower city that had learned not to ask where a salvage crew puts a seal
          learns to read a level by the lights in its windows. A hand who will go down a sealed
          shaft after the people a survey buried, last in the deep long enough to bring them
          up, and stand the choke when the crew comes has a way of being sent for — the
          Coruscant underground carries a name now, down where the deep levels run under the
          city's floor and an honest survey is the difference between a derelict and a grave.

  # GENERALIZED QUESTLINE — "The Cut Coil" (mos_eisley_cut_coil)
  # The TWENTY-FOURTH accessible (non-t5, non-tutorial) kind:questline chain, the SEVENTH set
  # on TATOOINE — on the Mos Eisley STREET face (the tatooine_mos_eisley zone), on a FRESH
  # FOUR-ROOM CLUSTER no chain has touched: the quiet South End repair-shop row, the Dowager
  # Queen wreckage scrap corner, the industrial North End garage district, and the busy
  # Spaceport Row (mos_eisley_south_end / dowager_queen_corner / mos_eisley_north_end /
  # mos_eisley_spaceport_row), reusing NONE of the prior Tatooine arcs' rooms (The Crooked
  # Wheel's market district, The Dust-Sick's Jundland, The Sabotaged Run's speeder circuit, The
  # Long Haul's haul-road and power station, The Rigged Issue's civic compound, The Short
  # Weight's spaceport docking bays, or The Kept Watch's market shop row) — every room fresh to
  # the corpus. At twenty-four arcs and a finite set of combat-capable (non-SECURED) rooms no
  # untouched zone with four contested rooms remains, so the discipline this slice keeps is the
  # honest one still available: a fresh ROOM CLUSTER, not a fresh face. A SABOTAGE-FOR-IMPOUND /
  # PRODUCT-TAMPERING consumer-fraud racket — the FIRST accessible arc in which the racket
  # DAMAGES the very thing it is paid to fix: a Mos Eisley repulsorlift repair garage, Hax
  # Vortassa's lift & tune, books in working folks' speeders and, on the owners it judges a tow
  # and a fee away from going under, nicks a repulsor coil on the bench — a file-line cut into
  # the winding too fine to see, set to hold a week and then drop the lift drive dead in the
  # lanes — then tows the stranded speeder in with its own recovery droid, books a ruinous
  # repair against the fault it built, and strips the speeders the owners must sign over, gutting
  # the recovery droid's tow log after every rigged job so nothing ties the breakdowns to the
  # bench. A fifty-year Sullustan mechanic who read the cut coil for what it is is a beaten rival
  # whose word means nothing against a licensed garage's clean records and who the yard would
  # walk off the lot — so the racket is broken by GARAGE-MECHANIC work: get into the scrap corner
  # and read a towed-in speeder's lift drive for the deliberate cut (repulsorlift repair),
  # rebuild the garage's gutted recovery droid in its North End yard until it gives up the tow-
  # and-job log the racket erased (droid repair), stand off the yard's enforcer who comes for the
  # droid and the proof on Spaceport Row (combat), and get the cut coil and the droid's log to
  # the Mos Eisley vehicle-licensing prefect. The TWENTY-FOURTH distinct skill spread
  # (repulsorlift repair + droid repair — both Technical, the SECOND both-Technical spread after
  # The Rigged Issue's armorer's bench but a wholly distinct pair and work), the FIRST accessible
  # arc to reward the GARAGE-MECHANIC / vehicle-and-droid REPAIR build — mechanically distinct
  # from every prior repair/operation arc: The Rigged Issue (blaster + armor repair, PERSONAL
  # ARMS on the bench), The Condemned Hull (space transport repair + astrogation, a STARSHIP
  # engineer-navigator), The Long Haul (ground vehicle repair + operation, a wheelman who DRIVES
  # what he fixes), The Sabotaged Run (sensors + repulsorlift OPERATION, a racer in the COCKPIT);
  # and where the only prior droid work re-FLASHES a droid's behavior (software), this REPAIRS a
  # droid the racket physically GUTTED (hardware) to restore a wiped witness. Tatooine is
  # Hutt-fringe with no Republic presence to keep offstage at all, and the garage is run afoul
  # of in the end by the town's own Mos Eisley vehicle-licensing prefect, which will not have a
  # licensed repair shop condemn the speeders it was paid to mend and impound them on a
  # manufactured fault — the way every prior accessible arc keeps the larger powers offstage.
  # Reuses the live questline engine (kind:questline + active_questline + existing event types +
  # the four reward funnels) with NO new engine code, no new slot/event type, no schema
  # migration, no new reward faucet, and NO map-coordinate or exit-graph change.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: mos_eisley_cut_coil
    chain_name: "The Cut Coil"
    description: >
      In the streets of Mos Eisley — a one-bench repair shop in the quiet South End, the old
      colony-ship wreckage corner where towed speeders are scrapped, the industrial North End
      where the garage keeps its yard, and the busy Spaceport Row between the lot and the
      licensing desk — an old Sullustan mechanic named Nilo Sabb knows the new garage on the
      strip is wrecking the speeders it is paid to fix, and cannot prove it. Hax Vortassa's lift
      & tune underprices every honest bench in the quarter, then, on the working-folk owners it
      judges a tow and a fee away from going under, nicks a repulsor coil on the bench — a
      file-line cut into the winding, fine as a hair and dead straight, set to hold a week of
      running and then drop the lift drive dead in the lanes. When the speeder strands, the
      garage's own recovery droid tows it to the wreckage-corner scrap lot, the garage books a
      repair worth more than the speeder against the fault it built, and the owners who cannot
      pay sign it over to be stripped and resold — the recovery droid's tow log gutted after
      every rigged job, its memory module yanked and crushed, so nothing ties the breakdowns to
      the bench. Sabb has fixed this quarter's speeders and droids for fifty years and opened a
      neighbor's towed-in lifter and found the cut coil for what it was, but a beaten rival's
      word against a licensed garage's clean service records is one more sore loser's grudge,
      and the yard would walk him off the property before he reached a bench. He needs a neutral
      hand who can do the three things he cannot: get into the scrap corner and read a towed-in
      speeder's lift drive for the deliberate cut; rebuild the garage's gutted recovery droid
      until it gives up the tow log the racket erased; and carry the cut coil and the droid's
      log to the one desk that can pull the garage's license — before the next signed-over
      speeders are stripped for good. A freelance favor — open to anyone, no faction required.
    archetype_label: "Freelance Mechanic's Favor"
    faction_alignment: independent
    starting_zone: tatooine_mos_eisley
    starting_room: mos_eisley_south_end
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["cut_coil_cleared"]
      drop_room: mos_eisley_south_end
      follow_up_hint: >
        The cut coil and the recovery droid's tow log reach the Mos Eisley vehicle-licensing
        prefect and the garage comes apart with them: a coil cut to fail in a speeder the garage
        tuned, and the garage's own droid logging the tow of the speeder it rigged, is fraud no
        clean service record can paper over. Hax Vortassa's repair license is pulled, the
        signed-over speeders the prefect can show were rigged go back to their owners or are
        bought back at the fraud's cost, the impound-and-strip is laid at Vortassa's own door,
        and the offworld fence's pipeline of cheap stripped speeders dries up. The garage that
        lived on speeders that stranded on their own bad luck and droids that remembered nothing
        finds the one thing the racket needed buried come up the Row: a coil with a file-line in
        it and a droid that remembers exactly what it was towing when they pulled its memory.
        The enforcer who meant to keep the lot clean collects nothing but a pulled license. Word
        travels the quarter the way it never travels a licensing record: there is a hand who
        will walk a crooked garage's lot, read the cut a clean tune hides, bring a gutted droid
        back to make it talk, and stand the Row when the recovery crew comes — and the working
        folk of the South End who had learned to take the cheap service and eat the bad luck
        stop believing a tuned speeder dies in a week on its own.

    steps:
      - step: 1
        title: "The File-Line in the Winding"
        location: mos_eisley_south_end
        npc: "Nilo Sabb"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Nilo Sabb in the doorway of his one-bench repair shop in the Mos Eisley South End."
        npc_intro: >
          [A round-eyed old Sullustan in a grease-blacked apron sits on a coil-crate in the
          doorway of a one-bench shop, a sectioned repulsor coil turning slow in his blunt
          fingers, and he reads you the way a man reads a coil before he trusts it.] "You know
          your way around a lift drive? Then you'll do what I can't, and the prefect won't. I'm
          Nilo Sabb — fifty years I've fixed this quarter's speeders and droids, and I know what
          wear looks like in a coil. `talk` to me. This—" [he turns the sectioned coil so the
          lane-light catches the winding] "—isn't wear. That's a file-line, fine as a hair and
          dead straight, cut to hold a week and then drop the drive. Hax Vortassa's garage tunes
          a neighbor's lifter clean, it strands in the lanes seven days on, the garage's droid
          tows it in, and the bill's more than the speeder — so they sign it over. That's not
          bad luck. That's a coil cut to fail, and a rival's word against their clean records is
          one more grudge the prefect's heard a hundred times."
        completion:
          type: talk_to_npc
          npc: "Nilo Sabb"
        npc_complete: >
          [He sets the cut coil on the crate between you and lays a blunt finger along the
          file-line.] "I opened a neighbor's towed-in lifter for a second opinion and found this,
          and I've watched it happen up and down the South End since — a clean tune, a dead drive
          a week on, a tow, a ruinous bill, a speeder signed away. But I'm the rival they
          underpriced, and I can't walk that lot; the yard would have me off the property before
          I reached a bench. You can. They scrap the speeders they tow at the old wreckage corner
          — the Dowager Queen, where the Jawas pick over droids. Get to one of the towed-in
          speeders there and read its lift drive. The cut's in the coil if you know to look.
          Prove a tuned drive was cut to die, and you've got the first half of what pulls a
          license."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Dowager Queen wreckage corner, where the garage scraps the speeders its recovery droid tows in, get into one of the towed-in speeders, and read its lift drive for the deliberate cut in the repulsor coil. Use your `repulsorlift repair` skill, then `chain attempt`."

      - step: 2
        title: "Read the Drive"
        location: dowager_queen_corner
        npc: "(none)"
        npc_role: contact
        teaches: ["repulsorlift repair"]
        objective: "At the Dowager Queen wreckage corner, get into one of the garage's towed-in speeders and read its lift drive to find the deliberate cut filed into the repulsor coil — a repulsorlift repair check."
        npc_intro: >
          [The Dowager Queen corner is where Mos Eisley scraps what it tows: the old colony-ship
          wreckage with blockhouses built around it, Jawas picking over droids, and, off to one
          side behind a chain run, the garage's scrap lot — a row of working-folk speeders towed
          in "broken down," waiting to be stripped, a Hax Vortassa lift & tune tag wired to each
          one. The garage swears every one of them simply wore out.] Get in under one before the
          Jawas or the yard crew take notice, pull the lift-drive cowling, and read the repulsor
          coil the way Sabb read his. Wear spreads — a worn coil pits and dulls all along the
          winding. Sabotage is local and deliberate: a single clean file-line cut across the
          winding, fine as a hair and dead straight, set to carry the load a week and then arc
          out and drop the drive. Find the cut and you've proven the breakdown was built into a
          speeder the garage tuned, not bad luck the owner brought on. `repulsorlift repair`, a
          mechanic's eye for the difference between a worn coil and a cut one — `chain attempt`
          when you've read the drive and found the file-line.
        completion:
          type: skill_check_passed
          skill: "repulsorlift repair"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [You pull the cowling on a towed-in lifter and read its drive the way Sabb swore it
          could be read — and there it is, in the second coil: a single file-line laid clean
          across the winding, dead straight, no pitting around it, no wear anywhere near it, a
          cut a hand made on a bench with a fine file and a steady eye. A worn coil dies all over
          at once; this one was murdered in one place, set to hold exactly long enough for the
          owner to drive off trusting the tune and then to arc and drop the drive a week down the
          road, far from the garage and any blame. You work the cut coil free and pocket it — the
          proof in the metal, the file-line no service record can explain. But a coil is only
          half of it: the coil says a speeder was cut to fail, and the garage will say it never
          touched this one. What ties the cut speeders to the bench is the garage's own recovery
          droid, that towed every one of them in and logged every tow — which is exactly why
          they gut it after each job.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "You've got the cut coil — now make the droid talk. In the garage's North End yard, find the recovery droid the racket gutted after its last tow and rebuild it until it gives up the tow-and-job log tying the cut speeders to the bench — use your `droid repair` skill, then `chain attempt`."

      - step: 3
        title: "The Droid That Remembers"
        location: mos_eisley_north_end
        npc: "(none)"
        npc_role: contact
        teaches: ["droid repair"]
        objective: "In the garage's industrial North End yard, find the recovery droid the racket gutted and rebuild it until it gives up the tow-and-job log that ties the cut speeders to the bench — a droid repair check."
        npc_intro: >
          [The North End is Mos Eisley's industrial face — warehouses, shipping offices, factory
          compounds — and Hax Vortassa's garage keeps its recovery yard here, the tow rigs parked
          under a sun shade and, slumped against the back wall where they left it after the last
          job, the recovery droid: a squat, treaded hauler-droid with its access panel hanging
          open and its logic-and-memory module half torn out and crushed, gutted so it can never
          say what it towed.] The racket runs on this droid remembering nothing — but a gutted
          droid can be rebuilt, and a rebuilt droid remembers what it was carrying when its
          memory was pulled. Reseat what's left of the module, splice past the crushed cells,
          rebuild its logic enough to bring it back online, and walk it back through the damage
          to the tow-and-job log under the wipe: every rigged speeder it towed, every job number,
          every signed-over plate. `droid repair`, the hands to bring a deliberately gutted droid
          back to life and the patience to recover what it was meant to forget — `chain attempt`
          when the droid's back up and the tow log's yours.
        completion:
          type: skill_check_passed
          skill: "droid repair"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [You work the gutted droid the way the garage was sure no one would bother to — reseat
          the half-crushed module, splice past the dead cells, rebuild the logic a board at a
          time until the treads twitch and the optic flickers up and the droid comes back online,
          confused and faithful, with the last thing it was doing still queued under the wipe.
          And it remembers: the tow-and-job log surfaces a job at a time — every rigged speeder
          it hauled in off the lanes, every job number the garage booked the ruinous repair
          against, every plate signed over to the scrap corner — the garage's own droid logging,
          in the garage's own job numbers, the tow of every speeder the bench cut to fail. The
          coil says a speeder was cut; the log says this garage cut these speeders and towed them
          in to strip. Put the two together and there is no clean service record left to hide
          behind. But the droid rolling at your heel and the coil in your hand are exactly what
          the garage cannot let walk off its lot, and Spaceport Row runs between here and the
          prefect — and Vortassa keeps a man on the Row for just this.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "You've got the coil and the droid's log — now get them to a desk. Carry the cut coil and the rebuilt recovery droid up Spaceport Row toward the Mos Eisley vehicle-licensing prefect, and stand off the garage's enforcer when he comes to take the proof back — `attack`, `dodge`."

      - step: 4
        title: "The Man on the Row"
        location: mos_eisley_spaceport_row
        npc: "Vagh Sarko"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Carry the cut coil and the rebuilt recovery droid up Spaceport Row and stop Vagh Sarko when the garage's enforcer comes to take the proof back — `attack`, `dodge`."
        npc_intro: >
          [Spaceport Row is the busy strip between the garage's North End lot and the town's
          licensing offices, all freight pylons and foot traffic and idling speeders. A
          leather-skinned, braid-locked Weequay shoulders off a pylon as you come up with the cut
          coil in one hand and the rebuilt recovery droid rolling at your heel, a worn blaster
          under a grimed coverall and a Hax Vortassa lift & tune patch at his shoulder, the flat
          patience of a being paid to make sure nothing leaves the garage's lot it shouldn't.]
          Vagh Sarko — the recovery crew's enforcer, the hand who rides the tow rig and keeps the
          lot clean. He has watched an outsider read a drive the garage swore was worn out and
          bring its gutted droid back up the way it was never meant to come, and the easy menace
          of a man who keeps a lot goes hard. "That coil came off a worn-out speeder, friend —
          Vortassa's lot, Vortassa's salvage. Drive was finished; owner couldn't pay; it's ours,
          clean as the service record reads. And that droid never logged a thing — we made sure.
          It doesn't go up to any prefect." [He sets himself across the Row between you and the
          licensing desk.] "Hand it back and shut the droid down and walk off the Row, or you
          don't walk to that desk. Vortassa runs a patient shop. I'm the part of it that keeps
          the lot clean."
        completion:
          type: combat_won
          enemy_template: "cut_coil_enforcer"
          enemy_count: 1
        npc_complete: >
          [Vagh Sarko goes down in the dust of Spaceport Row, the blaster knocked spinning under
          an idling freight skiff, and the foot traffic that has long since learned not to watch
          where a garage keeps its lot finds somewhere else to look. The way up the Row toward
          the licensing prefect stands clear, the cut coil still in your hand and the recovery
          droid still rolling faithfully at your heel with its tow log intact. Take them on — a
          coil with a file-line in it and a droid that remembers exactly what it towed — and
          there is nothing between here and the prefect's desk but the strip, the racket's lie
          coming apart in your hands.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The enforcer's down and the Row is clear — get the cut coil and the recovery droid's tow log to the Mos Eisley vehicle-licensing prefect, then go back to Nilo Sabb at his South End shop."

      - step: 5
        title: "The Lot Cleaned Out"
        location: mos_eisley_south_end
        npc: "Nilo Sabb"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Nilo Sabb at his South End shop with the cut coil and the droid's log delivered and the garage's license coming apart."
        npc_intro: >
          [Sabb is on his feet when you come back, the sectioned coil hung up on its board and a
          licensing notice in his blunt hand, watching the South End's foot traffic move past the
          neighbors' doors — and there's a recovered lifter up on a neighbor's stand again,
          running.] "Done. The prefect read a file-line cut into a coil off a speeder Vortassa
          tuned, and the garage's own droid logging, in the garage's own job numbers, the tow of
          every speeder it cut — and pulled the license that morning. The signed-over speeders
          the log proves were rigged go back to their owners or get bought back at the fraud's
          cost, the impound-and-strip's laid at Vortassa's own door, and the offworld buyer's
          pipeline of cheap stripped speeders dried up the day the lot went quiet. The prefect's
          no friend of adjudicating one more garage grudge — but a licensed shop that condemns
          the speeders it was paid to mend and tows them off to strip has made the town's own
          licensing record a fraud, and that the prefect would not have." [He turns the notice
          over the way a mechanic checks a coil one last time.] "A season they wrecked the
          speeders they were paid to fix and called it bad luck, and the service records were all
          clean, so it was honest. `talk` to me and let me say it plain, now there's a desk that
          had to hear it."
        completion:
          type: talk_to_npc
          npc: "Nilo Sabb"
        npc_complete: >
          "Here's your fee — what a one-bench mechanic's put by, and worth twice the credits to
          hand it to the hand that walked the lot I couldn't and read the cut a clean tune hid. A
          service record can call a speeder worn out; a file-line cut clean across the winding
          says it was murdered on the bench. The license is pulled, the neighbors get their
          speeders back, the next garage that tunes a lifter clean and watches it die in a week
          gets read against the file-line in the coil, and a season of working folk who signed
          their only speeder over for bad luck get it back for the fraud it was. Word goes slow up
          a quarter and fast down a strip — a shop, a corner, a row learns quick who'll walk a
          crooked lot after the cut a garage hides and who'll tow your speeder off and call it
          worn out. When a garage in this town starts losing its customers' speeders to a week of
          bad luck, there's a name they'll send for now. Carry mine with it — and read a drive by
          the cut in the metal, not by how clean the service record reads; I'd not have the hand
          that cleaned out that lot take a tuned speeder on faith."
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The garage is shut and the racket is coming apart: Hax Vortassa's license dies as a cut
          coil and the garage's own tow log prove the breakdowns were built on the bench, the
          signed-over speeders go back to the working folk who were robbed of them, the impound-
          and-strip becomes a fraud on the town's own licensing record, and a quarter that had
          learned to take the cheap service and eat the bad luck learns to read a drive by the
          cut in the coil. A hand who will walk a crooked garage's lot, read the file-line a
          clean tune hides, bring a gutted droid back to make it talk, and stand the Row when the
          recovery crew comes has a way of being sent for — Mos Eisley carries a name now, down
          on the strip where an honest tune is the difference between a speeder fixed and a
          speeder cut to fail.

  # ─────────────────────────────────────────────────────────────────────
  # GENERALIZED QUESTLINE — "The Fouled Sump" (coruscant_fouled_sump)
  # The TWENTY-FIFTH accessible (non-t5, non-tutorial) kind:questline chain, the SIXTH set on
  # CORUSCANT — on the Commercial District / "Coruscant Works" face (the commercial_district
  # zone), on a FRESH FOUR-ROOM CLUSTER no chain has touched: the Engineering Corps habitation
  # block whose recyclers draw the poisoned level, the Central Power Grid Station over the dead
  # coolant sump, the gartro-choked structural void where the waste is dumped, and the Mid-Level
  # Market Street between the void and the inspectorate (commercial_district_hab /
  # commercial_district_power_grid / gartro_rookery / mid_market_street), reusing NONE of the
  # prior Coruscant arcs' rooms (The Lost Courier's southern-underground rooms, The False
  # Provenance's Monumental-District rooms, The Sealed Ledger's OTHER Commercial-District rooms,
  # The Twisted Word's Entertainment-District rooms, or The Buried Block's undercity rooms) —
  # every room fresh to the corpus. The Sealed Ledger already set an arc in the
  # commercial_district zone (on commercial_district_atmospheric / commercial_district_main /
  # dexters_diner / mid_transit_hub), so this is honestly the SECOND arc on that face, NOT a
  # fresh face; what is fresh is the four-room CLUSTER. At twenty-five arcs and a finite set of
  # combat-capable (non-SECURED) rooms no untouched zone with four contested rooms remains, so
  # the discipline this slice keeps is the honest one still available: a fresh ROOM CLUSTER, not
  # a fresh face. An ILLEGAL-DUMPING / DISPOSAL-FRAUD cover-up — the FIRST accessible arc in
  # which the racket is an environmental / contamination cover-up, the harm carried in the air
  # and water of a hab block rather than in a single mark's purse: a Coruscant Works hazardous-
  # waste disposal contractor, Drell Reclamation, holds the commercial district's licensed
  # disposal contract — paid to haul the works' spent coolant and heavy-metal sludge and reactor-
  # cell tailings out to the proper offworld reclamation yards — and instead walks its rigs down
  # into a dead service void under the district (the abandoned coolant sump beneath the Central
  # Power Grid Station and the gartro-choked shaft below it) and dumps the drums there for free,
  # pocketing the haul-and-process fees and filing clean reclamation manifests for runs that
  # never left the level; the void it dumps into is exactly the level the Engineering Corps hab
  # block's air-and-water recyclers draw from, so a season of dumped sludge has surfaced in the
  # block — the water gone metallic, the children sickening, the plumbing corroding — all written
  # off as old infrastructure. A thirty-year Besalisk works heavy-rig operator turned hab-block
  # maintenance steward who traced the metallic draw down his rig routes to the sump and read the
  # dumped drums for what they are is a lone works hand whose word means nothing against a
  # licensed contractor's clean manifests and whom the disposal crew would run off the grid
  # station — so the racket is broken by HEAVY-EQUIPMENT OPERATOR work: take the works' own cargo-
  # walker down the flooded sump floor under the grid station and bring up a dumped drum where no
  # wheel or lift can go (walker operation), fly a hover cargo-rig down into the gartro void below
  # to recover the outfit's abandoned hover-sled and its routing log, the record that ends every
  # "reclamation" run in the void instead of the yard (hover vehicle operation), stand off the
  # disposal crew's enforcer who comes for the drum and the log on the Mid-Level Market Street
  # (combat), and get the contaminated drum and the routing log to the Coruscant Works
  # environmental inspectorate. The TWENTY-FIFTH distinct skill spread (walker operation + hover
  # vehicle operation — both Mechanical, the THIRD both-Mechanical spread after The Sabotaged
  # Run's sensors + repulsorlift OPERATION and The Salted Lane's space transports + starship
  # gunnery, but a wholly distinct pair and work), the FIRST accessible arc to reward the HEAVY-
  # EQUIPMENT / INDUSTRIAL-VEHICLE OPERATOR build, the FIRST to use WALKER OPERATION, the FIRST to
  # use HOVER VEHICLE OPERATION, and the FIRST DUAL-VEHICLE-OPERATION spread — mechanically
  # distinct from every prior vehicle arc: The Long Haul (ground vehicle repair + OPERATION, a
  # wheelman who DRIVES and FIXES one ground hauler), The Sabotaged Run (sensors + repulsorlift
  # OPERATION, a racer in the COCKPIT). The Senate, the Jedi, and the Republic war overhead have
  # no reach down in a mid-level works district and never appear, and the outfit is run afoul of
  # in the end by the district's own Coruscant Works environmental inspectorate, which will not
  # have a licensed disposal contractor dump the hazardous waste it was paid to haul to
  # reclamation into the level the hab block draws from — the way every prior accessible arc keeps
  # the larger powers offstage. Reuses the live questline engine (kind:questline + active_questline
  # + existing event types + the four reward funnels) with NO new engine code, no new slot/event
  # type, no schema migration, no new reward faucet, and NO map-coordinate or exit-graph change.
  # ─────────────────────────────────────────────────────────────────────
  - chain_id: coruscant_fouled_sump
    chain_name: "The Fouled Sump"
    description: >
      In the works levels of Coruscant — a habitation block of works families, the power grid
      station over a dead coolant sump, the gartro-choked void below it where the dumping goes,
      and the mid-level market street between the void and the inspectorate — an old Besalisk
      operator named Burlo Vethic knows the licensed disposal contractor is poisoning the level
      his hab block drinks from, and cannot prove it. Drell Reclamation holds the commercial
      district's hazardous-waste disposal contract — paid to haul the works' spent coolant and
      heavy-metal sludge and reactor-cell tailings out to the proper offworld reclamation yards —
      and instead walks its rigs down into the dead service void under the district and dumps the
      drums there for free, pocketing the haul-and-process fees and filing clean reclamation
      manifests for runs that never left the level. The void it dumps into is exactly the level
      the Engineering Corps hab block's air-and-water recyclers draw from, so a season of dumped
      sludge has surfaced in the block: the recycled water gone metallic, the children coughing,
      the plumbing corroding from inside — all written off as old infrastructure finally giving
      way. Vethic has run this district's heavy cargo-walkers and hover-rigs for thirty years and
      traced the metallic draw down his rig routes to the sump and took a walker down and found
      the drums for what they were, but a works maintenance hand's word against a licensed
      contractor's clean manifests is one more complaint the inspectorate has filed, and Drell's
      crew posts the grid station and would run a slow old operator off the moment he took a rig
      down. He needs a neutral hand who can do the three things he cannot: take the works' own
      cargo-walker down the flooded sump floor and bring up a dumped drum; fly a hover-rig down
      into the void and recover the outfit's own routing log; and carry the drum and the log to
      the one desk that can pull the contract — before the next season of sludge goes down the
      recyclers' draw. A freelance favor — open to anyone, no faction required.
    archetype_label: "Freelance Operator's Favor"
    faction_alignment: independent
    starting_zone: commercial_district
    starting_room: commercial_district_hab
    prerequisites:
      - chargen_complete
    duration_minutes: 25
    locked: false
    kind: questline

    graduation:
      credits: 300
      faction_rep:
        independent: 5
      items: []
      achievements: ["fouled_sump_cleared"]
      drop_room: commercial_district_hab
      follow_up_hint: >
        The contaminated drum and the recovery sled's routing log reach the Coruscant Works
        environmental inspectorate and the outfit comes apart with them: a Drell tailings drum
        pulled from the void the hab block draws from, and the outfit's own routing log ending
        every "reclamation" run in that void instead of at a yard, is dumping no clean manifest
        can paper over. Drell Reclamation's disposal contract and license are pulled, the void is
        sealed and remediated and the hab block's draw cleaned, the haul-and-process fees billed
        for runs that never left the level are clawed back against the harm, and the offworld
        broker's cheap-disposal pipeline dries up. The outfit that lived on waste that went down
        quiet and manifests that read clean finds the one thing the racket needed buried come up
        the market street: a drum that should have been three systems away and a log that records
        exactly where every haul actually ended. The enforcer who meant to keep the level clean
        collects nothing but a pulled contract. Word travels the works levels the way it never
        travels a manifest: there is a hand who will take a rig down a flooded sump and a fouled
        void where a licensed crew swears nothing is, read the poison a clean haul hides, and
        stand the street when the disposal crew comes — and the works families who had learned to
        drink the metallic draw and call it an old block giving way stop believing their water
        sours and their children cough from the age of the pipes.

    steps:
      - step: 1
        title: "The Metallic Draw"
        location: commercial_district_hab
        npc: "Burlo Vethic"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Speak with Burlo Vethic in the maintenance bay of the Engineering Corps habitation block."
        npc_intro: >
          [A bulk-shouldered, four-armed old Besalisk in a silt-greyed works harness stands in the
          hab block's maintenance bay, a cracked recycler filter cradled in his lower hands and a
          torn drum-tag pinched in his upper, and he reads you the way a man reads a rig load
          before he trusts it.] "You can run a heavy rig? Then you'll do what I can't, and the
          inspectorate won't. I'm Burlo Vethic — thirty years I've taken the works' walkers and
          hover-rigs down where no wheel goes, and I know what old infrastructure wears like.
          `talk` to me. This—" [he holds up the cracked filter, its mesh stained metallic grey]
          "—isn't age. That's a heavy-metal load in the block's draw, come on in a season, and it
          only comes from somewhere it was put. Drell Reclamation's paid to haul the works' poison
          out to the yards. Instead they walk it down into the dead sump the hab draws from and
          dump it, and file the haul like it shipped. The water goes metallic, the children cough,
          the pipes rot from inside — and the district calls it an old block giving way. It's not.
          It's a drum of tailings in a void it was sworn to be three systems from, and a
          maintenance hand's word against their clean manifests is one more complaint."
        completion:
          type: talk_to_npc
          npc: "Burlo Vethic"
        npc_complete: >
          [He sets the torn tailings-drum tag on the maintenance bench between you and lays a
          blunt finger on the Drell Reclamation mark.] "I took a walker down the sump under the
          Central Power Grid Station myself, once, before they posted a man on it, and found their
          drums stacked in a void their manifests swore were processed offworld. But I'm a
          maintenance hand, and my word against their clean manifests is one more complaint the
          inspectorate's filed and forgotten. And I can't take a rig down there now — Drell's crew
          posts the grid station, and they'd run a slow old operator off before he reached the
          sump floor. You can. The works keeps a heavy cargo-walker at the grid station. Take it
          down — the sump floor's flooded and broken, no wheel or lift crosses it, only a walker's
          legs. Bring up one of their drums. Prove the waste they swore they hauled out is dumped
          where the block drinks, and you've got the first half of what pulls a contract."
        reward:
          faction_rep:
            independent: 2
        next_hint: "Go to the Central Power Grid Station, where the works keeps a heavy cargo-walker, and take it down the flooded coolant sump where the disposal crew dumps its drums — recover one contaminated tailings drum where no wheel or lift can go. Use your `walker operation` skill, then `chain attempt`."

      - step: 2
        title: "Down the Sump Floor"
        location: commercial_district_power_grid
        npc: "(none)"
        npc_role: contact
        teaches: ["walker operation"]
        objective: "At the Central Power Grid Station, take the works' heavy cargo-walker down the flooded coolant sump and recover a dumped tailings drum — a walker operation check."
        npc_intro: >
          [The Central Power Grid Station is the works district's industrial heart — transformer
          banks and coolant towers and the constant subsonic hum of mid-level power — and beneath
          it, behind a maintenance shaft the grid crew long since stopped using, lies the dead
          coolant sump: a flooded, collapsed sub-tier, its floor a broken wade of standing
          coolant and fallen ferrocrete no wheel or repulsorlift can cross. Off in the dark of it,
          stacked where a rig was walked in and emptied, sit the drums — a row of Drell
          Reclamation tailings drums the district's manifests swear were processed three systems
          away.] The works keeps a heavy cargo-walker on the station deck for exactly the ground
          no other rig can take. Walk it down the maintenance shaft, pick the legs across the
          flooded floor a hold at a time, and bring one of those drums up out of the sump in its
          claw — a drum of heavy-metal tailings in the void the hab block draws from is the proof
          a clean manifest cannot survive. `walker operation`, the hands to take a legged rig
          where no wheel goes and the patience to cross a broken sump floor without dropping it —
          `chain attempt` when the drum's up on the station deck.
        completion:
          type: skill_check_passed
          skill: "walker operation"
          difficulty: 11
          on_fail: "retry_allowed"
        npc_complete: >
          [You take the cargo-walker down the maintenance shaft the way Vethic swore it could be
          done — pick the legs across the flooded floor a hold at a time, feel the ferrocrete give
          and shift the weight, and walk it in among the stacked drums no wheel ever reached — and
          there they are: Drell Reclamation tailings drums, heavy-metal sludge and spent reactor
          cells, the tags intact, sitting in a dead sump the contractor's manifests swear were
          processed offworld. You set the claw, lift one clear of the coolant, and walk it back up
          out of the dark to the station deck. A drum of tailings in the void the hab block drinks
          from — and the manifest that says it shipped — is dumping no clean record can paper over.
          But a drum is only half of it: the drum says waste was dumped here, and the outfit will
          say this one strayed, one drum, an accident, not a contract run on lies. What ties every
          dumped run to the bench is the outfit's own hover-sled, that flew the bulk of it down
          into the gartro void below and logged every drop — which is exactly why they left it down
          there, fouled and forgotten.]
        reward:
          faction_rep:
            independent: 2
        next_hint: "You've got the drum — now make the runs talk. Fly a hover cargo-rig down into the gartro-choked void below the sump and recover the outfit's abandoned hover-sled and its routing log, the record that ends every 'reclamation' run in the void instead of at a yard — use your `hover vehicle operation` skill, then `chain attempt`."

      - step: 3
        title: "The Sled in the Void"
        location: gartro_rookery
        npc: "(none)"
        npc_role: contact
        teaches: ["hover vehicle operation"]
        objective: "In the gartro-choked structural void below the sump, fly a hover cargo-rig down to recover the disposal outfit's abandoned hover-sled and its routing log — a hover vehicle operation check."
        npc_intro: >
          [Below the dead sump the structure opens into a gartro rookery: a vast structural void
          dropped between the works levels, its girders and dead ducting furred with the stick-nests
          of Coruscant's scavenger gartros, the air a churn of warm updrafts off the lower levels
          and the clatter of startled flocks. It is ground no rig route ever logged and no wheel
          will ever touch — and it is where Drell flies the bulk of the dumping, down on a hover-
          sled, drop after drop into the dark. The sled they left after the last drop hangs fouled
          on a girder ledge halfway down, its routing log still live.] Take a hover cargo-rig off
          the works dock and fly it down into the void — thread the girders, ride the updrafts the
          gartros ride, hold the rig steady against the thermals long enough to come alongside the
          abandoned sled and pull its log core. The log ends every run where the drums actually
          went: not a reclamation yard three systems off, but this void, drop coordinate after drop
          coordinate, under the outfit's own contract numbers. `hover vehicle operation`, the touch
          to fly a loaded rig in bad air down a nesting void and the steadiness to hold it
          alongside a fouled sled — `chain attempt` when the sled's log is yours.
        completion:
          type: skill_check_passed
          skill: "hover vehicle operation"
          difficulty: 13
          on_fail: "retry_allowed"
        npc_complete: >
          [You fly the hover cargo-rig down into the void the way the crew was sure no one would
          bother to — thread the girders, ride the warm updrafts the gartros ride, feel the rig buck
          on the thermals and hold it, drop after careful drop into the dark until you come
          alongside the fouled sled hung on its ledge — and you pull its log core. And it remembers:
          the routing log surfaces a run at a time — every disposal run the outfit booked, every
          contract number it billed the haul-and-process fee against, every drop coordinate where a
          "reclamation" haul actually ended, and not one of them a yard. They all end here, in the
          void, under Drell's own contract numbers. The drum says waste was dumped where the block
          drinks; the log says this outfit dumped every run it was paid to haul out, by contract
          number, into this void. Put the two together and there is no clean manifest left to hide
          behind. But the sled's log in your hand and the drum on the station deck are exactly what
          the outfit cannot let come up off the level, and the Mid-Level Market Street runs between
          here and the inspectorate — and Drell keeps a man on the street for just this.]
        reward:
          faction_rep:
            independent: 3
        next_hint: "You've got the drum and the routing log — now get them to a desk. Carry the contaminated drum and the recovered hover-sled's log up the Mid-Level Market Street toward the Coruscant Works environmental inspectorate, and stand off the disposal crew's enforcer when he comes to take the proof back — `attack`, `dodge`."

      - step: 4
        title: "The Man on the Market Street"
        location: mid_market_street
        npc: "Draz Kullo"
        npc_role: antagonist
        teaches: ["attack", "dodge"]
        objective: "Carry the drum and the routing log up the Mid-Level Market Street and stop Draz Kullo when the disposal crew's enforcer comes to take the proof back — `attack`, `dodge`."
        npc_intro: >
          [The Mid-Level Market Street is the busy thoroughfare between the level's lifts and the
          works inspectorate, all vendor stalls and foot traffic and the hum of passing speeders.
          A leather-hided, heavy-jawed Klatooinian shoulders off a market stall as you come up with
          the tailings drum cradled in one arm and the recovered sled's log in your hand, a worn
          blaster under a grimed coverall and a Drell Reclamation patch at his shoulder, the flat
          patience of a being paid to make sure nothing comes up off the level it shouldn't.] Draz
          Kullo — the disposal crew's enforcer, the hand who rides the rigs down into the void and
          keeps the level clean. He has watched an outsider take a walker down a sump floor the
          crew thought no one would bother with and fly the void after a sled that was meant to stay
          lost, and the easy menace of a man who keeps a level goes hard. "That drum came off a
          clean reclamation run, friend — Drell's contract, Drell's haul, processed offworld and
          logged. Whatever you pulled out of that sump shipped three systems ago, clean as the
          manifest reads. And that sled never logged a thing — we left it for fouled. It doesn't go
          up to any inspectorate." [He sets himself across the street between you and the
          inspectorate.] "Hand it back and ditch the log and walk off the street, or you don't walk
          to that desk. Drell runs a quiet contract. I'm the part of it that keeps the level clean."
        completion:
          type: combat_won
          enemy_template: "fouled_sump_enforcer"
          enemy_count: 1
        npc_complete: >
          [Draz Kullo goes down on the deck-plates of the Mid-Level Market Street, the blaster
          knocked spinning under a vendor's stall, and the foot traffic that has long since learned
          not to watch where a licensed hauler runs its rigs finds somewhere else to look. The way
          up the street toward the works inspectorate stands clear, the tailings drum still cradled
          in your arm and the recovered sled's routing log still in your hand. Take them on — a drum
          that should have been three systems away and a log that records exactly where every haul
          ended — and there is nothing between here and the inspectorate's desk but the street, the
          racket's lie coming apart in your hands.]
        reward:
          credits: 150
          faction_rep:
            independent: 3
        next_hint: "The enforcer's down and the street is clear — get the contaminated drum and the recovered hover-sled's routing log to the Coruscant Works environmental inspectorate, then go back to Burlo Vethic at the hab block."

      - step: 5
        title: "The Draw Run Clean"
        location: commercial_district_hab
        npc: "Burlo Vethic"
        npc_role: instructor
        teaches: ["talk"]
        objective: "Return to Burlo Vethic at the Engineering Corps habitation block with the drum and the routing log delivered and the disposal contract coming apart."
        npc_intro: >
          [Vethic is on his feet when you come back, the cracked recycler filter swapped out on its
          rack and a remediation notice in his blunt hands, watching the hab block's families move
          past the maintenance bay — and there's a works crew up on the grid-station deck again,
          rigging the seal over the sump.] "Done. The inspectorate read a Drell tailings drum
          pulled from the void this block draws from, and the outfit's own routing log ending every
          haul it billed in that void instead of at a yard — and pulled the contract that morning.
          The void's being sealed and the sump remediated, the block's draw goes clean, the haul-
          and-process fees they billed for runs that never left the level get clawed back against
          the harm, and the offworld broker's cheap-disposal pipeline dried up the day the contract
          died. The inspectorate's no friend of adjudicating one more works complaint — but a
          licensed contractor that dumps the poison it was paid to haul out into the level a hab
          block drinks from has fouled the district's own draw, and that the inspectorate would not
          have." [He turns the notice over the way an operator checks a rig load one last time.] "A
          season they poisoned the water of the families I keep this block for and called it old
          pipes, and the manifests were all clean, so it was honest. `talk` to me and let me say it
          plain, now there's a desk that had to hear it."
        completion:
          type: talk_to_npc
          npc: "Burlo Vethic"
        npc_complete: >
          "Here's your fee — what a works pensioner's put by, and worth twice the credits to hand it
          to the hand that took the rigs down where my joints couldn't and read the poison a clean
          haul hid. A manifest can call a haul processed offworld; a drum pulled from the void the
          block drinks from says it was dumped under our own children. The contract's pulled, the
          draw runs clean, the next contractor that bills a reclamation run gets read against the
          coordinate the haul actually ended at, and a season of works families who drank the
          metallic draw and called it age get a clean draw back and the truth of why it soured. Word
          goes slow up a works level and fast down a market street — a block, a sump, a street learns
          quick who'll take a rig down a fouled void after the poison a hauler hides and who'll dump
          it under your draw and call it shipped. When a contractor on this level starts losing its
          quiet runs to a drum that should've been three systems gone, there's a name they'll send
          for now. Carry mine with it — and read a draw by the load in the water, not by how clean
          the manifest reads; I'd not have the hand that cleaned out that void drink a clean
          manifest on faith."
        reward:
          faction_rep:
            independent: 2
        next_hint: >
          The contract is pulled and the racket is coming apart: Drell Reclamation's disposal
          license dies as a tailings drum and the outfit's own routing log prove the hazardous
          waste it was paid to haul to reclamation was dumped in the level the hab block draws from,
          the void is sealed and the sump remediated and the block's draw cleaned, the haul-and-
          process fees billed for runs that never left the level become a fraud on the district's
          own environmental record, and a works level that had learned to drink the metallic draw
          and call it age learns to read a draw by the load in the water. A hand who will take a rig
          down a flooded sump and a fouled void where a licensed crew swears nothing is, read the
          poison a clean haul hides, recover the log that records where every run truly ended, and
          stand the street when the disposal crew comes has a way of being sent for — the Coruscant
          works levels carry a name now, down where a clean draw is the difference between a block
          that lives and a block poisoned under its own floor.

