  # pad, the merchant-house boulevard, the Ten families' contract forum, and the grand
  # hotel where the houses do their quiet business (kuat_city_landing_pad /
  # kuat_city_main_street / kuat_mercantile_forum / kuat_city_hotel), reusing NONE of
  # The Skimmed Line's orbital-ring rooms or The Condemned Hull's and The Salted Lane's
  # main-spaceport rooms — every room fresh to the corpus. Where those worked the ring
  # and the spaceport, this works the SURFACE CITY — the merchant houses' own ground.
  # A DEBT-BONDAGE / PADDED-ADVANCE (labor) racket: a labor-contracting outfit, Drale
  # Contract Labor & Provisioning, recruits offworld contract crews for the Ten houses'
  # surface staffing on a "passage advance" — fronts each worker's shuttle fare,
  # lodging, and tools, books every line at an inflated rate against company scrip with
  # compounding carry, pays the logged hours back in the same scrip at a discount, and
  # so engineers a debt that grows no matter how hard the crew works: a passage out
  # that can never be bought, the crews held on a surface they cannot afford to leave
  # while the books show nothing but an advance honestly owed. A Sullustan crew foreman
  # who came on one of those advances and has watched his crew's debt climb for two
  # years is bonded and unheard — beaten by LEDGER-AND-LEVERAGE work: reconcile Drale
  # Contract Labor's advance ledger against the real costs and the crew's logged hours
  # to prove the debt is engineered never to clear, not an honest advance (business),
  # corner the outfit's junior contracts-clerk in the forum's records annex and lean on
  # him until he hands over the true second ledger and names the scheme (intimidation),
  # stand off the outfit's collector who comes for the proof (combat), and get the
  # audit and the true ledger to the merchant houses' contract arbiter. The TWENTY-FIRST
  # distinct skill spread (business + intimidation — both Knowledge), the FIRST
  # accessible arc to reward the LEDGER-AND-LEVERAGE / FORENSIC-PRESSURE build (the
  # audit desk and the cornered clerk), mechanically and thematically distinct from the
  # only two prior arcs that touch money and records — The Skimmed Line (security +
  # bargain, a freelance RECOVERY that bypasses a lock and negotiates a return, not an
  # audit) and The Sealed Ledger (pick pocket + hide + computer programming, a HEIST
  # that lifts and slices a sealed record, not a forensic read of an open one). This
  # does not skim the top the way The Skimmed Line does; it inflates the bottom — the
  # crew is held by the books, not robbed by them. The Republic procurement liaison the
  # Kuat City room text names stays distant background — and the outfit is run afoul of
  # in the end by the merchant houses' own contract arbiter, who will not have a
  # peonage scandal soured onto a House's name — the way every prior accessible arc
  # keeps the war offstage. Reuses the live questline engine (kind:questline +
