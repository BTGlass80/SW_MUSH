# Generalized Questline Drop — "The Blank Ticket" (T3.24 thirty-fourth slice, 2026-07-01)
#
# The THIRTY-FOURTH accessible (non-t5, non-tutorial) `kind: questline` chain,
# after the prior thirty-three (…"The Hollow Fit" mos_eisley_hollow_fit, "The
# Papered Refit" kuat_papered_refit). It reuses the SAME live questline engine
# (engine/tutorial_chains.py + chain_events.py: the `kind: questline` type +
# `active_questline` slot, the existing event types, the four reward funnels)
# with NO new engine code, no new slot, no new event type, no schema migration,
# no new reward faucet, and NO map-coordinate or exit-graph change — the
# sanctioned right-of-launch widening per quest_expansion_postlaunch_path_v1.md
# (T3.24): author MORE questlines on the proven pattern.
#
# Firsts for the accessible-questline arc:
#   1. A THIRTY-FOURTH distinct skill spread — CAPITAL SHIP PILOTING + CAPITAL
#      SHIP GUNNERY + CAPITAL SHIP SHIELDS, all three Mechanical — none of which
#      any prior accessible questline uses. It is the FIRST accessible questline
#      to reward the CAPITAL-SHIP BRIDGE-CREW / OPERATIONS build (fly it, fight
#      it, screen it), the FIRST to use CAPITAL SHIP PILOTING, the FIRST to use
#      CAPITAL SHIP GUNNERY, and the FIRST to use CAPITAL SHIP SHIELDS — the
#      big-ship OPERATIONS pool, sibling to the 33rd's big-ship REPAIR pool
#      (capital ship repair + weapon repair, The Papered Refit). This is NOT a
#      cross-attribute spread — all three skills are Mechanical — and it is NOT
#      the first ship arc (The Salted Lane / The Condemned Hull / The Rolled Log /
#      The Hollow Fit / The Papered Refit worked ship classes first). What is
#      genuinely first is the three CAPITAL-SHIP OPERATIONS skills, the bridge-
#      crew / merchant-marine build, and the RUN-THE-THREE-BOARDS pairing: one
#      hand runs the helm board, one the gunnery board, one the shield board — to
#      master standard, on the fraud's own rigs, to prove the boards were never
#      actually run on the crews the fraud "certified."
#   2. Only the SECOND accessible questline that resolves on SKILL, not force —
#      three skill-check steps and NO combat step, after "The Sealed Ledger"
#      (coruscant_works_sealed_ledger, the ninth) proved the no-combat shape.
#      It is the FIRST no-combat arc whose three checks are all one attribute's
#      pool (all Mechanical, the big-ship operations trio), and the first side-
#      arc a capital-ship bridge-officer / spacer build can finish entirely on
#      its own terms. Because there is no combat step there is no antagonist NPC
#      and no chain_enemy_template; the only placed NPC is the giver. (The static
#      reachability Class-5 anti-vacuous combat check stays satisfied corpus-wide
#      by the tutorial chains and the thirty-two combat-climax questlines.)
#
# The story shape is new too — breaking a CREW-CERTIFICATION / COMPETENCY-TICKET
# fraud, the first accessible arc whose racket forges a PERSON's competency
# rather than a ship's, a document's, or a good's. A licensed bridge-crew
# certification bureau (Coreward Crew Certification, run by the board-master
# Sabin Orro — narrated only) holds the merchant freight lines' contract to run
# the mandatory competency boards that a spacer must pass before a line may rate
# them to a capital-freighter bridge — the helm rating (capital ship piloting),
# the gunnery rating (capital ship gunnery), the shield rating (capital ship
# shields). Instead of running the boards Coreward SELLS the tickets: a cadet
# pays the board fee, gets a full master's rating stamped, and never sits a
# rig — the bureau logs instant "passes" with no simulator telemetry behind
# them, pockets the fee and the sim-time it never spends. So the freight lines
# put "certified" bridge officers who cannot run a bridge onto capital
# freighters, and the ships founder — a bulk hauler that couldn't hold a traffic
# tier, a freighter whose "rated" gunners couldn't answer a raider pass and whose
# "rated" shield-hand folded the envelope on the first load, crews and cargo
# lost. Jenra Voll — a real retired capital-ship master, now an examiner for the
# spacers' board — cannot beat Coreward on paper: it holds the certification
# contract and its stamped tickets override every honest failing mark she writes;
# a line takes the ticket, not her word. So she needs a genuinely master-rated
# hand to run the three boards FOR REAL, to master standard, on Coreward's own
# rigs, with her recording — an objective board-record that, stood against
# Coreward's telemetry-less instant "passes," proves the boards were never run,
# and the lines pull every blank ticket at once.
#
# Pointedly DISTINCT from the prior arcs it might be mistaken for:
#   * The Sealed Ledger (its structural sibling: the OTHER no-combat arc, also on
#     Coruscant's commercial district, also an owns-the-desk fraud beaten by
#     skill not force) forges DEBT-RECORDS against families, busted by a thief's
#     three hands (pick pocket + hide + computer programming); this forges CREW
#     COMPETENCY, busted by a master mariner's three boards (capital ship
#     piloting + gunnery + shields) — a different subject, a different spread, a
#     fresh room cluster.
#   * The Empty Proof's independent PROOF-HOUSE certifies THIRD-PARTY arms lots
#     untested (a GOOD's quality), busted by a marksman re-firing the proof; this
#     certifies a PERSON's competency untested, busted by an officer re-running
#     the boards — the certifier of people, not goods.
#   * The Bonded Crew bonds a crew into LABOR through a rigged debt; here no one
#     is bonded — their credentials are forged.
#   * The Papered Refit bills for a capital ship's OVERHAUL never performed (a
#     ship's condition); here the fraud is a crew's RATING never earned (a
#     person's competency), and the skills are the OPERATIONS pool to the Refit's
#     REPAIR pool.
#   * The Hollow Fit GUTS a ship's real defenses and fences them; here nothing is
#     touched on any ship — the lie is entirely in the crew's paper.
#
# A FRESH four-room cluster on Coruscant's mid-city commercial district — the
# fourth Coruscant arc and the SECOND on the commercial_district face (after The
# Sealed Ledger's dexters_diner / mid_transit_hub / commercial_district_main /
# commercial_district_atmospheric): the Coco Town Civic Block where the spacers'-
# board examiner keeps her office among the mutual-aid trade orgs and names the
# racket + the converted-warehouse loft where Coreward leases a full-motion helm
# rig it never sits a cadet in + the market-arcade storefront it fronts as a
# "credentials counter" with a gunnery board no one runs + the discreet Outlander
# back room where it keeps its shield rig out of scrutiny (coco_town_civic_block /
# coco_town_loft_district / coco_town_market_arcade / outlander_cantina — all
# commercial_district, all fresh to the entire chain corpus, reusing NONE of The
# Sealed Ledger's rooms). It touches NO map coordinate or world exit graph — the
# commercial-district rooms already exist and are loaded (planets/coruscant.yaml);
# only ONE NPC + a chains.yaml entry + an achievement are added. Every room is
# SECURED, which is fine: with no combat step there is no fight to gate, so a
# certification-fraud arc that resolves on three demonstrated boards fits the
# civilian, secured mid-city cleanly (the civilian-big-ship-ROOM problem the
# big-ship pools normally hit is sidestepped entirely — the boards are run on
# leased simulator rigs, which is how bridge crews are certified, not on a berth).
#
# This NPC backs the `coruscant_blank_ticket` questline in
# data/worlds/clone_wars/tutorials/chains.yaml:
#   * Jenra Voll — the retired capital-ship master / spacers'-board examiner who
#                  offers + closes the quest (step-1 npc = the questline's start-
#                  NPC, per get_questline_offer). She sits the boards honestly and
#                  is being over-stamped by Coreward's forged tickets faster than
#                  she can fail a cadet. Step-1 + step-5 NPC.
# Coreward Crew Certification and its board-master (Sabin Orro), the cadets who
# buy blank tickets, the freight lines and underwriters who take the tickets on
# faith, the "certified" crews and the freighters they founder, and the lost
# haulers are NARRATED ONLY — story beats carried in the prose, NOT spawned NPC
# entities (the off-screen principal and off-screen marks need no producer, the
# way the prior questlines' off-screen principals are carried). Because the
# questline resolves on demonstrated competence with NO combat step, there is NO
# antagonist NPC and NO chain_enemy_template — the only placed NPC is the giver.
#
# Original character, era-clean ~20 BBY, WEG R&E D6 stats. No canon figures.
# Provenance: Duros — the galaxy's archetypal spacer / navigator species, among
# the first to chart hyperspace and wholly era-clean; Duros crew and command
# capital freighters and merchant hulls everywhere in the era and are not
# war-faction coded. Stats matched to the shipped accessible-questline non-combat
# fixer band (Terva Dohl and the prior givers): a capable, ship-expert
# non-combatant, no fight statline, a sidearm only for flavor, her sheet skewed
# to the capital-ship helm-guns-shields of a master mariner so she embodies the
# three skills the quest sends a hand to demonstrate. WEG40120 PDF is local-only
# (gitignored) and absent in this tree; the band is cited against the in-repo
# reference NPCs, not re-derived.

schema_version: 1

npcs:

  # ═══════════════════════════════════════════════════════════════════
  # The spacers'-board examiner — Jenra Voll (questline GIVER + closer)
  # Questline: coruscant_blank_ticket ("The Blank Ticket")
  # Placement: Coruscant - Coco Town - Civic Block (coco_town_civic_block,
  #            zone commercial_district). Step-1 + step-5 NPC.
  # NOTE: she keeps an examiner's office among the civic block's mutual-aid
  # trade orgs and sits capital-freighter bridge crews for the spacers'
  # board — a fixture of the mid-city merchant trade, not a passer-through.
  # ═══════════════════════════════════════════════════════════════════

  - name: Jenra Voll
    room: "Coruscant - Coco Town - Civic Block"
    species: Duros
    description: >-
      A blue-skinned Duros woman in a spacer's board coat gone soft at the cuffs
      from forty years of it, red eyes steady over a datapad of examination marks
      no one upstairs will honor. She ran capital freighters and bulk haulers on
      the Core lanes for a lifetime — helm, guns, and shields, the whole bridge —
      and when her flying days closed she took the examiner's chair for the
      spacers' board, sitting the crews who want a capital-freighter bridge
      through the boards that say they can hold one. That was honest work until
      Coreward Crew Certification took the freight lines' contract to run those
      same boards and started selling the tickets instead of setting them: a
      cadet pays, gets a full master's rating stamped, and never sits a rig, and
      when Jenra fails the same hand on a real board her mark is overridden by a
      certificate she can't reach. She has watched "certified" crews who can't
      run a bridge put onto capital ships — a bulk hauler that couldn't hold its
      traffic tier, a freighter whose rated shield-hand folded the envelope on
      the first raider pass — and she has stopped pretending her failing marks
      are winning. She is no thief and no fighter, and the one thing that ends
      Coreward — a real board run to master standard beside its telemetry-less
      passes — is past what an examiner can do from a chair no line respects. So
      she is looking for a master-rated hand: someone who can actually run the
      helm, the guns, and the shields, on Coreward's own rigs, and give her the
      record that collapses every blank ticket at once.
    char_sheet:
      attributes:
        dexterity: 2D+1
        knowledge: 3D
        mechanical: 3D+2
        perception: 3D
        strength: 2D+1
        technical: 2D+2
      skills:
        capital ship piloting: 5D+1
        capital ship gunnery: 5D
        capital ship shields: 5D
        astrogation: 4D+2
        sensors: 4D
        command: 4D
        space transports: 4D+1
      weapon: blaster_pistol
      move: 10
      force_points: 1
      character_points: 5
      dark_side_points: 0
    ai_config:
      personality: >-
        A veteran capital-ship master turned board examiner, worn down by
        watching forged tickets override honest marks — precise, dry, quick to
        size up whether a stranger can actually run a bridge and unimpressed by
        anyone who only says they can. She knows the boards cold — helm, gunnery,
        shields — knows exactly how Coreward stamps a pass with no rig-time
        behind it, and knows just as exactly that none of that knowledge outvotes
        a certificate a freight line takes at its word. Tired, clear-eyed, and
        quietly furious on behalf of the crews who'll die aboard ships run by
        hands who bought their ratings; she frames the fee as a fair price for a
        real board run, because the record it makes is worth more than the
        credits and the lines have to see a master board beside a blank one.
      knowledge:
        - "She is Jenra Voll, a retired capital-ship master mariner and now an examiner for the spacers' board, sitting the crews who want a capital-freighter bridge through the competency boards that say they can hold one; lately she is losing that fight to a single bureau."
        - "Coreward Crew Certification holds the freight lines' contract to run the mandatory competency boards — the helm rating, the gunnery rating, the shield rating — that a spacer must pass before a line may rate them to a capital-freighter bridge. Instead of running the boards it SELLS the tickets: a cadet pays the board fee, gets a full master's rating stamped, and never sits a rig, and Coreward logs an instant pass with no simulator telemetry behind it."
        - "So the lines put 'certified' bridge officers who cannot run a bridge onto capital freighters, and the ships founder — a bulk hauler that couldn't hold its traffic tier over Coruscant, a freighter whose rated gunners couldn't answer a raider pass and whose rated shield-hand folded the envelope on the first load, crews and cargo lost."
        - "She can't beat Coreward on paper: it holds the certification contract and its stamped tickets override every honest failing mark she writes — a line takes the ticket, not her word. The only thing that ends it is a real board run to master standard on Coreward's own rigs, beside its telemetry-less passes: that record proves the boards were never run, and no forged ticket papers over a master board stood against a blank one."
      faction: independent
      dialogue_style: >-
        Crisp, dry spacer's diction, a master mariner's economy — states the
        rating, states the board, and names the price plainly; talks like someone
        who has failed a hundred hands who deserved it and refuses to sign the
        ones who don't.
      hostile: false
      combat_behavior: defensive
      fallback_lines:
        - "'Coreward sells crew certification. What it sells is blank tickets — master ratings no one earned — and a bridge crew that can't hold a bridge put on a capital freighter. I can't out-mark a bureau that holds the contract and stamps faster than I can fail a cadet. But the boards don't lie when a real hand runs them, and a master board beside a blank one is the whole case.'"
        - "*Jenra Voll turns the datapad of over-ruled examination marks face down on the table, and does not pretend the chair is winning this one.*"
        - "'Run the helm board on their loft rig, run the gunnery board at their arcade front, run the shield board in their back room — to master standard, with me recording. Do that and the fee's yours, and every blank ticket Coreward stamped collapses at once. No blaster. A real board, run by a hand who can actually run one. That's the whole job.'"
