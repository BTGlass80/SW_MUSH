# Generalized Questline Drop — "The Cleared Fault" (T3.24 thirty-fifth slice, 2026-07-01)
#
# The THIRTY-FIFTH accessible (non-t5, non-tutorial) `kind: questline` chain, set on CORUSCANT —
# on a FRESH FOUR-ROOM SINGLE-ZONE CLUSTER (all commercial_district) no chain has touched: the
# Outlander Club in the lower entertainment strip where a blackballed weapons-safety range-master
# who walked off a crooked recall bench takes a corner and names the racket (outlander_club), the
# Invisible Sector main street where the crooked arms retailer keeps its shop and back-range and a
# rack of "recall-cleared" production blasters that still carry the buried fault (invisec_main_street),
# the covered scrap-lot range against the sector wall at the Invisible Sector border where a
# "recall-cleared" bowcaster can be spanned to full draw against the ferrocrete backstop and shown
# to fracture (invisec_border), and the mid-level residential megablock where the retailer's enforcer
# corners the live proof before it can reach the arms-standards board (mid_residential_block)
# (outlander_club / invisec_main_street / invisec_border / mid_residential_block). Every one of
# these four rooms is FRESH to the entire chain corpus.
#
# HONEST DISCIPLINE NOTE: this is the FIFTH Coruscant arc (after The Twisted Word, The False
# Provenance, The Sealed Ledger, The Buried Block, The Paper Death, The Cut Lane, The Blank Ticket —
# actually the count of Coruscant arcs is higher; this is another Coruscant arc, NOT a fresh planet)
# and the THIRD on the commercial_district face (The Sealed Ledger and The Blank Ticket worked it
# before — dexters_diner / mid_transit_hub / commercial_district_main / commercial_district_atmospheric
# and the Coco Town + Outlander Cantina cluster), so this is NOT a fresh face; what is fresh is the
# four-room CLUSTER, precedented by every prior second-and-later-on-a-face arc. Three of the four
# rooms are SECURED (outlander_club, invisec_main_street, invisec_border), which is fine: only the
# step-4 combat room must be combat-capable, and mid_residential_block carries no explicit
# security_level (defaults to CONTESTED — combat-capable), while the giver/return room and the two
# firing-proof rooms host no fight, so their SECURED level is immaterial (a skill check is never
# gated by room security — only NPC combat is, per _check_security_gate). It touches NO map
# coordinate or world exit graph — the rooms already exist and are loaded (planets/coruscant.yaml);
# only NPCs + a chains.yaml entry + an achievement are added.
#
# THE DEXTERITY-WEAPON-POOL PATH, TAKEN HONESTLY: the standing memory flag was that after the 34th
# arc the MECHANICAL and TECHNICAL pools are EXHAUSTED (the big-ship operations trio spent by The
# Blank Ticket, the big-ship repair pair by The Papered Refit, the small-ship systems by The Hollow
# Fit), and the only clean UNUSED skills left are the two remaining DEXTERITY personal-weapon skills
# — BLASTER and BOWCASTER — plus reactive parries/dodge and the Jedi/era lightsaber. A full corpus
# skill sweep this slice confirmed it: neither blaster nor bowcaster has EVER gated a questline
# skill_check_passed step (blaster and dodge are the FOILS' combat stats across the corpus, but
# neither is used as a CHAIN skill — a distinction the memory had previously mis-filed). So
# blaster + bowcaster is a clean fresh both-Dexterity personal-weapon pair, precedented as a shape
# by The Empty Proof (firearms + thrown), The Paper Death (running + melee combat), and The Cold
# Charge (grenade + missile weapons) — three prior all-Dexterity-weapon-pool spreads. Unlike the
# big-ship pools it needs NO special venue (no berth, no drydock, no simulator rig): two personal
# weapons are fired on two ordinary ranges, and the arc CAN take the standard combat step (a
# personal-weapon arc is not the no-combat capital-ship shape). It keeps the racket squarely
# civilian and sidesteps every venue problem the ship pools hit.
#
# It reuses the SAME live questline engine (engine/tutorial_chains.py + chain_events.py: the
# `kind: questline` type + `active_questline` slot, the existing event types, the four reward
# funnels) with NO new engine code, no new slot, no new event type, no schema migration, no new
# reward faucet, and NO map-coordinate or exit-graph change — the sanctioned right-of-launch
# widening per quest_expansion_postlaunch_path_v1.md (T3.24): author MORE questlines on the proven
# pattern.
#
# Firsts for the accessible-questline arc:
#   1. A THIRTY-FIFTH distinct skill spread — BLASTER (Dexterity) + BOWCASTER (Dexterity) — neither
#      of which any prior accessible questline uses. It is the FIRST accessible questline to reward
#      the PERSONAL-WEAPONS RANGE-MASTER / GUNSMITH-PROOF build — the hand that runs a suspect
#      blaster hot on the range to trip a hidden chamber/actuator fault and the hand that spans a
#      suspect bowcaster to full draw to show its riser/limb fracture — the FIRST to use BLASTER and
#      the FIRST to use BOWCASTER as a chain skill. (Honest notes: this is NOT a cross-attribute
#      spread — blaster and bowcaster are BOTH Dexterity — so it is the FOURTH all-Dexterity-weapon-
#      pool spread, after The Empty Proof's firearms + thrown weapons, The Paper Death's running +
#      melee combat, and The Cold Charge's grenade + missile weapons, and it is NOT the first weapon
#      arc. What is genuinely first is the two DEXTERITY personal-firearm skills BLASTER and
#      BOWCASTER, and the PROVE-THE-FAULT-IS-LIVE pairing on personal weapons: one hand runs a
#      "recall-cleared" production blaster hot on the range to trip the chamber/actuator fault the
#      recall swears was fixed, the other spans a "recall-cleared" bowcaster to full draw to show
#      the riser/limb fault the recall swears was fixed still fractures. Pointedly distinct from The
#      Empty Proof's marksman, which RE-RUNS a proof a proof-house SKIPPED on un-tested third-party
#      arms — here the marksman TRIPS a specific KNOWN defect the seller's own forged recall swears
#      it re-worked out, on the seller's own goods.)
#   2. Set on CORUSCANT, in the commercial_district zone — but, honestly, NOT a fresh face (The
#      Sealed Ledger and The Blank Ticket worked the commercial district) NOR a cross-zone cluster:
#      it is a SINGLE-ZONE assembly of four rooms (outlander_club / invisec_main_street /
#      invisec_border / mid_residential_block), every one new to the entire chain corpus. It touches
#      NO map coordinate or world exit graph — the rooms already exist and are loaded
#      (planets/coruscant.yaml); only NPCs + a chains.yaml entry + an achievement are added.
#
# It is also a new STORY SHAPE: breaking a SUPPRESSED-DEFECT / FAKED-RECALL product-safety cover-up
# on personal weapons — the first accessible arc whose racket is knowingly selling a lethal
# manufacturing defect, forging the recall-compliance record that swears the defect was re-worked
# out, and burying the buyers' injury reports. A civilian arms retailer and importer (Riftline Arms
# & Import, run by the proprietor Ostra Vell) sells personal blasters and bowcasters to the
# dockworkers, sector guards, caravan hands, and hunters who need a sidearm in a rough quarter, and
# a whole production lot of them carries a known lethal defect: a blaster gas-chamber and actuating-
# block fault that over-pressures and bursts in the shooter's hand under sustained fire, and a
# bowcaster riser-and-limb lamination fault that fractures under a full-power quarrel. When the
# malfunction reports and the injuries started coming back, Riftline did not pull the lot: it forged
# a recall-compliance certificate swearing every unit in the lot had been re-worked to clear the
# fault, kept selling the untouched defective stock as "recall-cleared," and buried the buyers'
# injury and malfunction reports so the arms-standards board never saw a pattern — collecting the
# margin on live-defective weapons while the guards and hunters who carry them lose a hand or their
# life the moment they need the weapon most. Pointedly DISTINCT from the prior arcs it might be
# mistaken for: The Empty Proof's INDEPENDENT PROOF-HOUSE certifies THIRD-PARTY arms lots
# "range-proofed" WITHOUT test-firing them — a certifier's SKIPPED test on others' goods of unknown
# quality, an omission — where here the SELLER KNOWS the exact defect (the injury reports prove it),
# forges a RECALL-COMPLIANCE record claiming it re-worked every unit to FIX the known defect, and
# actively BURIES the victims — a seller's active concealment and fabricated remediation of a KNOWN
# lethal defect, not a skipped proof. The Rigged Issue SUBSTITUTES counterfeits into an arms-supply
# contract — here the weapons are genuine brand stock with a real manufacturing defect, nothing
# substituted. The Cold Charge fakes the DESTRUCTION of ordnance and re-sells the live lots — here
# nothing is destroyed or diverted, the defective weapons are sold openly as recall-cleared. The
# Hollow Fit GUTS a ship's installed defenses and fences the real cores — here nothing on any ship,
# personal weapons with a suppressed defect. The Fouled Sump hides a REAL environmental poison — a
# contamination cover-up — where here the hidden hazard is a defective CONSUMER PRODUCT and its
# faked recall. The racket is broken not by a slicer, an inspector, or a medic but by a PERSONAL-
# WEAPONS RANGE-MASTER who does the two things a faked recall cannot survive: takes a "recall-
# cleared" production blaster off Riftline's own shop rack and runs it hot on the back-range until
# the chamber and actuating blocks the recall swears were replaced over-pressure and burst — a
# recall-cleared weapon that still carries the exact fault the recall was supposed to clear
# (blaster) — then spans a "recall-cleared" bowcaster to full draw on the covered scrap-lot range
# against the sector wall and reads the riser and limb the recall swears were replaced fracture on
# the first full-power quarrel (bowcaster), and puts the two live-defective "recall-cleared" weapons,
# beside Riftline's forged recall-compliance certificate and the buried injury reports, on the
# arms-standards board that can void the compliance certification and pull the retailer's arms
# license. It carries a real combat climax (step 4), with a single placed antagonist NPC and a
# chain_enemy_template.
#
# These NPCs back the `coruscant_cleared_fault` questline in
# data/worlds/clone_wars/tutorials/chains.yaml:
#   * Kesh Ordan   — the Zabrak master range-safety armorer who ran the recall bench for Riftline
#                    Arms & Import until he saw the recall was never performed and the injury reports
#                    buried; he offers + closes the quest (step-1 npc = the questline's start-NPC,
#                    per get_questline_offer). Step-1 + step-5 NPC.
#   * Draven Kohl  — the combat-step enforcer (ai_config.chain_enemy_template cleared_fault_enforcer;
#                    the step-4 combat_won foil), the muscle Riftline keeps to see that a live-
#                    defective weapon the recall swears was cleared never reaches the arms-standards
#                    board that could void the certificate and pull the retailer's license.
# The proprietor who forges the recall certificates and buries the injury reports (Ostra Vell), the
# shop clerks who sell the "recall-cleared" stock, the manufacturer whose defective production lot
# Riftline moves, the dockworkers, sector guards, caravan hands, and hunters who buy the weapons and
# take the recall on faith, the maimed and the dead the weapons have already claimed, and the
# arms-standards board whose desk licenses the retailer are NARRATED ONLY — story beats carried in
# the prose, NOT spawned NPC entities. Only the giver and the single combat foil are real placed
# NPCs. (The room-flavor figures the loaded rooms already imply — the Outlander's crime-kingpin
# owner and its sports-book droids, the Alien Combine cells and the occasional clone patrol on the
# Invisible Sector main street, the clone checkpoint at the sector border, the refugee families in
# the residential block — are ambient and never instantiated by this drop, and the racket ties to
# none of them.)
#
# Original characters, era-clean ~20 BBY, WEG R&E D6 stats. No canon figures. The racket is a
# private civilian arms retailer's suppressed-defect / faked-recall fraud and its hired muscle,
# never a war faction; the Senate, the Jedi, and the Republic war effort have no reach at a civilian
# arms retailer and never appear, Coruscant's ambient clone patrols and the sector's own politics
# are the loaded rooms' own ambient flavor and never drive the plot, and the "authority" that ends
# the racket is the civilian arms-standards board that voids the compliance certification and pulls
# the retailer's arms license once a live-defective "recall-cleared" weapon is put on its desk —
# nodded to and never instantiated.
# Provenance: Zabrak (the horned, tattoo-marked near-Humans of Iridonia, spread across the galaxy
# as a hardy, self-reliant people common in trades and the martial professions — era-clean and not
# war-faction coded in ~20 BBY, here a weapons-safety range-master whose people's practical, martial
# reputation grounds the build) and Weequay (the leathery, weathered people of Sriluur, common as
# Outer-Rim and Hutt-space muscle and dock labor, era-clean and not war-faction coded) are both
# era-clean.
# Stats matched to the shipped accessible-questline bands — the giver to the non-combat fixer band
# (Yelza Korrin / Dorae Vint / Sashi Renko / Dav Nuro / Soree Bann / Hessa Veil / Cassa Brel /
# Vessa Tial / Terva Dohl / Ria Tann / Nuva Sehl / Neyla Sur / Veelo Trinn / Numi Vesh / Brama Hool /
# Ulil Maan / Senni Vrook / Jando Vekk / Grett Bashan / Corwin Hale / Nabo Threll / Oren Vask /
# Tomar Hess / Nilo Sabb / Burlo Vethic / Garn Holvo / Sela Marrenn / Resa Halix / Sabra Ollun /
# Nima Tarr / Dessa Molvar / Nyla Sabo / Ormo Delth / Jenra Voll), with the range-master's spread
# skewed to the personal-weapons proof-work of a range-safety armorer to embody the two skills the
# quest sends a hand to use; the enforcer to the small-time-criminal antagonist band (Brakkis Vone /
# Gorvahn Brusk / Skarn Vex / Suro Vant / Vohrek Sarn / Brask Yade / Varn Tesk / Tarko Venn / Drevin
# Saar / Vossk Rhal / Korsa Drael / Bohrus Kang / Gornt Reska / Hekka Vrool / Greel Vodo / Vurr Magh /
# Draygo Sull / Drozz Kael / Hask Vorran / Garvo Naak / Dussek Rao / Brunt Kosh / Vagh Sarko / Draz
# Kullo / Neevo Karr / Sesko Vahr / Drovan Pell / Grull Vantok / Tovek Grahl / Hurss Kadag / Draxo
# Venn / Vodran Sekk): a real fight, beatable by a fresh post-chargen character, carrying the proven
# blaster_pistol of the ranged foils on the same in-band guarded stat line as The Salted Lane's, The
# Short Weight's, The Wreckers' Light's, The Bonded Crew's, The Kept Watch's, The Buried Block's, The
# Cut Coil's, The Fouled Sump's, The Fixed Bout's, The Empty Proof's, The Cut Lane's, The Rolled
# Log's, The Paper Death's, The Cold Charge's, The Hollow Fit's, and The Papered Refit's foils
# (squarely in the proven beatable band, no balance flag needed — and pointedly NOT the melee/heavy-
# weapon line of The Condemned Hull's out-of-band Houk foil Bohrus Kang; the retailer's enforcer is
# muscle who settles things with a blaster in a residential corridor, not an axe). WEG40120 PDF is
# local-only (gitignored) and absent in this tree; the bands are cited against the in-repo reference
# NPCs, not re-derived.

