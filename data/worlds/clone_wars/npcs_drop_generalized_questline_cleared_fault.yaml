  # ═══════════════════════════════════════════════════════════════════

  - name: Kesh Ordan
    room: "Coruscant - The Outlander Club"
    species: Zabrak
    description: >-
      A lean, weathered Zabrak man with the vestigial crown of horns and the faint facial tattoos of
      his Iridonian people, taken a corner booth in the Outlander Club where an out-of-work hand can
      nurse one drink, watch the room, and be found, a range-master's calloused hands turning a spent
      blaster gas-chamber over and over on the table and a recall-compliance slate face-down beside
      it. He is a master range-safety armorer by trade and a proof-bench hand by his last job — the
      one who ran the recall bench for Riftline Arms & Import, the Invisible Sector retailer and
      importer the sector's dockworkers, guards, caravan hands, and hunters buy their sidearms from
      because a rough quarter that the Republic pretends doesn't exist needs a weapon that works when
      it's drawn. He proofed and re-worked the shop's stock and signed it honest for years, until a
      whole production lot of blasters and bowcasters began coming back to the counter having let go
      in their owners' hands — blasters whose gas chambers and actuating blocks over-pressured and
      burst under sustained fire, bowcasters whose laminated risers and limbs fractured on a full-
      power quarrel — a hand lost here, an eye there, a caravan guard who drew on a raider and had
      his weapon burst instead of fire. A defect that bad is a recall: pull the lot, re-work every
      unit, replace the chambers and the risers. Instead he watched the proprietor Ostra Vell forge
      a recall-compliance certificate swearing the entire lot re-worked and cleared, keep the
      untouched defective stock on the rack sold as "recall-cleared," and bury the malfunction and
      injury reports in a drawer so the arms-standards board that licenses the shop never saw the
      pattern. He refused to sign the recall he never did and walked off the bench the day Vell told
      him to sign it anyway. Now a rack of live-defective "recall-cleared" weapons is still going out
      the counter to people who will stake a hand or a life on them, and he knows to the serial where
      the fault is and what the recall was supposed to fix and never did. A range-master reads a
      live-defective weapon from a re-worked one the way another being reads a face; but an armorer
      who quit the shop is "a disgruntled hand" to a standards board that takes a bonded recall-
      compliance certificate at its word. He needs a neutral hand who can do the two things he can —
      run a "recall-cleared" blaster hot on the range until its buried fault bursts, and span a
      "recall-cleared" bowcaster to full draw until its buried fault fractures — and put a live-
      defective weapon the certificate swore was cleared on the arms-standards board where they
      cannot look away.
    char_sheet:
