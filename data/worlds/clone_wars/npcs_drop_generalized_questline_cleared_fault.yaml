npcs:

  # ═══════════════════════════════════════════════════════════════════
  # The range-master — Kesh Ordan (questline GIVER + closer)
  # Questline: coruscant_cleared_fault ("The Cleared Fault")
  # Placement: Coruscant - The Outlander Club (outlander_club, zone
  #            commercial_district). Step-1 + step-5 NPC.
  # NOTE: a Zabrak master range-safety armorer who ran the recall bench for Riftline Arms & Import,
  # the Invisible Sector arms retailer and importer the sector's dockworkers, guards, caravan hands,
  # and hunters buy their sidearms from. He proofed and re-worked weapons on Riftline's bench honest
