        knowledge: 2D
        mechanical: 2D+1
        perception: 2D+2
        strength: 2D
        technical: 2D+2
      skills:
        blaster: 4D+1
        bowcaster: 4D
        firearms: 3D+2
        blaster repair: 3D+2
