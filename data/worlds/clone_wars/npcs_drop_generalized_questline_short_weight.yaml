# Generalized Questline Drop — "The Short Weight" (T3.24 nineteenth slice, 2026-06-29)
#
# The NINETEENTH accessible (non-t5, non-tutorial) `kind: questline` chain, and the
# SIXTH set on TATOOINE — on the SPACEPORT FREIGHT-TERMINAL face (the Mos Eisley
# docking bays where independent cargo crews work the loads: the big shipping
# company's lobby + two working docking bays + the spacers' dockside cafe:
# notsub_shipping_lobby / docking_bay_87 / docking_bay_86 / dockside_cafe). It is
# the FIRST chain ever set on the iconic Mos Eisley docking bays. It reuses the
# SAME live questline engine (engine/tutorial_chains.py + chain_events.py: the
# `kind: questline` type + `active_questline` slot, the existing event types, the
# four reward funnels) with NO new engine code, no new slot, no new event type, no
# schema migration, no new reward faucet, and NO map-coordinate or exit-graph
# change — the sanctioned right-of-launch widening per
# quest_expansion_postlaunch_path_v1.md (T3.24): author MORE questlines on the
# proven pattern.
#
# Firsts for the accessible-questline arc:
#   1. A NINETEENTH distinct skill spread — POWERSUIT OPERATION (Mechanical) +
#      LIFTING (Strength) — neither of which any prior accessible questline uses (vs
#      search+streetwise / investigation+gambling / persuasion+sneak /
#      security+bargain / first_aid+survival / value+con / forgery+bureaucracy /
#      command+demolitions / pick-pocket+hide+computer-programming /
#      sensors+repulsorlift-operation / alien-species+droid-programming /
#      beast-riding+swimming / space-transport-repair+astrogation /
#      ground-vehicle-repair+ground-vehicle-operation / languages+cultures /
#      medicine+scholar / blaster-repair+armor-repair / space-transports+starship-
#      gunnery). `powersuit operation` resolves to MECHANICAL and `lifting` to
#      STRENGTH via the canonical perform_skill_check funnel; neither is aliased
#      (each canonicalizes to itself). This is the FIRST accessible questline to
#      reward the DOCK STEVEDORE / CARGO-LOADER build — a being who runs a powered
#      cargo-loader exosuit and carries the raw muscle behind it. It is mechanically
#      DISTINCT from every prior MECHANICAL arc, all of which pilot or service a
#      VEHICLE under way or on the bench — The Sabotaged Run (sensors + repulsorlift
#      operation, a ground speeder racer), The Condemned Hull (space transport
#      repair + astrogation, a starship engineer-navigator), The Long Haul (ground
#      vehicle repair + operation, a wheelman-mechanic), and The Salted Lane (space
#      transports + starship gunnery, a freighter pilot-gunner): a powersuit is a
#      WORN powered rig, not a piloted craft, and the loader works it standing on
#      the bay floor. And it is distinct from the only prior STRENGTH-skill arc, The
#      Driven Herd (beast riding + swimming, a wrangler working livestock in open
#      water): this is raw industrial LIFTING — a stevedore's back — not a swimmer's.
#      The build is the hands-and-machine of the cargo bay: run the loader, and when
#      the loaders are locked out, lift by hand.
#   2. The SIXTH questline set on TATOOINE, and the FIRST on the SPACEPORT
#      FREIGHT-TERMINAL face: the Mos Eisley docking bays and the shipping floor
#      around them — notsub_shipping_lobby / docking_bay_87 / docking_bay_86 /
#      dockside_cafe. It reuses NONE of the five prior Tatooine arcs' rooms — The
#      Crooked Wheel's market district, The Dust-Sick's Jundland, The Sabotaged
#      Run's speeder circuit, The Long Haul's freight-haul margins, or The Rigged
#      Issue's civic compound — every one of its four rooms is fresh to the chain
#      corpus, and the famous Docking Bay 86/87 floor has never carried a chain
#      before. The bored clone garrison and twice-a-week Republic liaison the Mos
#      Eisley room descriptions already name stay DISTANT BACKGROUND — the garrison
#      is here for the war, not for a loading contractor short-weighing independent
#      cargo crews — the way every prior accessible arc keeps the Republic/CIS
#      conflict offstage. It touches NO map coordinate or world exit graph — the
#      rooms already exist and are loaded (planets/tatooine.yaml); only NPCs + a
#      chains.yaml entry + an achievement are added.
#
# It is also a new STORY SHAPE: breaking a SHORT-WEIGHT / RIGGED-LOADER (cargo-
# metrology) racket — not a smuggling-trace, a racket-bust-by-investigation, a
# kidnap-rescue, a single-part theft-and-frame (The Skimmed Line recovers ONE
# stolen navigation-core blank by SLICING a shadow log and BARGAINING a buyer's
# name; this exposes a SYSTEMIC measurement fraud rigged into the machines
# themselves, by HANDS-ON loader and muscle work), a frontier medical rescue, an
# art-fraud caper, a counter-forgery of documents, a safety-toll community-defense,
# a finesse heist, a fixed race, a droid-reflash racket, a wildlife-poaching
# racket, a ship-condemnation, a freight strand-and-salvage (The Long Haul STRANDS
# rigs on the road to tow them off under a salvage lien; this leaves the cargo
# moving and skims its weight at the scale), a translation fraud, a fake-plague
# extortion, a counterfeit-arms supply scam, or a clearance-fraud/staged-hijack. A
# loading contractor who holds the powered-loader pool serving Mos Eisley's
# independent cargo bays has DOCTORED the loaders' mass-sensors to under-report the
# weight of every load logged out at the far scale: a slice of each shipment the
# independent crews move comes up "short" at delivery, the skimmed cargo physically
# pulled from salted ballast pods staged in a quiet bay and fenced offworld by the
# contractor's partner, and the shortfall written up as "shrinkage" and pinned on
# the honest independent loading co-ops who handled it — so the traders blame the
# crews, the crews lose their dock tickets and their names, and the contractor keeps
# the only loaders certified to work the bays. Grett Bashan, an Aqualish veteran
# loader who runs a small independent co-op one shrinkage report from losing its
# tickets, KNOWS the loaders are rigged — twenty years on the bay floor and he can
# feel in a rig's drift that the calibration is lying — but as an unlicensed
# independent his word is worth nothing against a "certified" scale, and he cannot
# run the loader to prove it, break a salted pod to find the skim, and stand off the
# contractor's enforcer all at once before his crew is written off. He offers his
# fee to any freelance hand who can take a powered loader through the contractor's
# own calibration cycle and hold a true, known weight against the rigged sensor to
# prove the machine under-reports on purpose (powersuit operation), break the seal
# on a salted ballast pod by hand and restack the dead weight that hides the skim
# compartment to prove the shortfall theft and not shrinkage (lifting), stand off
# the contractor's enforcer when the proof starts to walk (combat), and get the
# loader trace and the salted pod's manifest to the spaceport's port-authority desk.
#
# These NPCs back the `mos_eisley_short_weight` questline in
# data/worlds/clone_wars/tutorials/chains.yaml:
#   * Grett Bashan — the Aqualish veteran loader who offers + closes the quest
#                    (step-1 npc = the questline's start-NPC, per
#                    get_questline_offer). Step-1 + step-5 NPC.
#   * Drozz Kael   — the combat-step enforcer (ai_config.chain_enemy_template
#                    short_weight_enforcer; the step-4 combat_won foil), the
#                    contractor's collector who comes for the proof in the
#                    dockside cafe on the way to the port-authority desk.
# The loading contractor himself, his offworld fence, the honest co-op crew being
# blamed for shrinkage, the rigged powered-loaders and their doctored mass-sensors,
# the salted ballast pods and their hidden skim compartments, the independent
# traders whose loads come up short, the bored clone garrison and twice-a-week
# Republic liaison (nodded to in the room text, not re-instantiated), and the
# spaceport port-authority / customs desk are NARRATED ONLY — story beats carried in
# the prose, NOT spawned NPC entities. Only the giver and the single combat foil are
# real placed NPCs.
#
# Original characters, era-clean ~20 BBY, WEG R&E D6 stats. No canon figures.
# The racket is a local short-weight scam run by a crooked loading contractor and
# his fence, never a war faction; the Republic/CIS conflict stays offstage.
# Provenance: Aqualish (the tusked, multi-eyed beings of Ando — era-clean and
# faction-neutral, long working the galaxy's docks and spaceports as laborers,
# loaders, and spacers; a natural fit for a veteran cargo loader) and Klatooinian
# (the heavy-browed beings of Klatooine — era-clean and not war-faction coded, long
# bound out as muscle and labor across the lanes; a natural fit for a dock
# enforcer) are both era-clean. Stats matched to the shipped accessible-questline
# bands — the giver to the non-combat fixer band (Yelza Korrin / Dorae Vint / Sashi
# Renko / Dav Nuro / Soree Bann / Hessa Veil / Cassa Brel / Vessa Tial / Terva Dohl
# / Ria Tann / Nuva Sehl / Neyla Sur / Veelo Trinn / Numi Vesh / Brama Hool / Ulil
# Maan / Senni Vrook / Jando Vekk), with the loader's spread skewed to
# Strength/Mechanical to fit a stevedore; the enforcer to the small-time-criminal
# antagonist band (Brakkis Vone / Gorvahn Brusk / Skarn Vex / Suro Vant / Vohrek
# Sarn / Brask Yade / Varn Tesk / Tarko Venn / Drevin Saar / Vossk Rhal / Korsa
# Drael / Bohrus Kang / Gornt Reska / Hekka Vrool / Greel Vodo / Vurr Magh / Draygo
# Sull): a real fight, beatable by a fresh post-chargen character, carrying the
# proven blaster_pistol of the ranged foils on the same in-band guarded stat line
# as The Salted Lane's and The Rigged Issue's foils (squarely in the proven
# beatable band, no balance flag needed). WEG40120 PDF is local-only (gitignored)
# and absent in this tree; the bands are cited against the in-repo reference NPCs,
# not re-derived.

schema_version: 1

npcs:

  # ═══════════════════════════════════════════════════════════════════
  # The loader — Grett Bashan (questline GIVER + closer)
  # Questline: mos_eisley_short_weight ("The Short Weight")
  # Placement: Notsub Shipping - Lobby (notsub_shipping_lobby, zone
  #            tatooine_mos_eisley). Step-1 + step-5 NPC.
  # NOTE: an Aqualish veteran loader with twenty years on the bay floor who runs a
  # small independent loading co-op now one shrinkage report from losing its dock
  # tickets — a being who can feel a rigged calibration in a loader's drift the way
  # a pilot feels a bad lane, and who, as an unlicensed independent whose word is
  # worth nothing against a "certified" scale, is the one being on the floor who
  # KNOWS the loaders are short-weighing every load and cannot prove it to the
  # port-authority and break a salted pod and stand off the contractor's man, all at
  # once.
  # ═══════════════════════════════════════════════════════════════════

  - name: Grett Bashan
    room: "Notsub Shipping - Lobby"
    species: Aqualish
    description: >-
      A broad, heavy-shouldered Aqualish standing apart from the freight clerks at
      the edge of the Notsub Shipping lobby, the tusked, four-eyed face of his
      species fixed on a shrinkage report posted to the board with the flat patience
      of a loader who has read a thousand manifests and trusts the weight in his arms
      over the figure at the bottom of any of them. His work harness is scarred at
      the shoulders where a loader-rig's couplings ride, and his huge hands have the
      old, settled strength of a being who has spent twenty years putting cargo on
      and off the Mos Eisley docks by machine and by back both. He is no clerk and no
      fixer — he runs a small independent loading co-op, six honest crews who work
      the cargo bays for whatever trader needs a hold filled, and he has shifted
      enough tonnage to feel a loader lying in the drift of the rig before a scale
      will admit it. The board says his crews have been losing cargo — "shrinkage,"
      a slice off every load they move that comes up short at the far scale — and the
      traders have started taking their business to the contractor's own crews and
      filing complaints that will pull his people's dock tickets and their names with
      them. Bashan's crews are clean. What is not clean is the powered loaders: the
      contractor who holds the loader pool serving the independent bays has doctored
      the rigs' mass-sensors to log every load out light, the skimmed weight pulled
      by hand out of salted ballast pods staged in a quiet bay and run offworld by
      his partner, and the difference written up as honest crews stealing from the
      holds they fill. Bashan can feel the loaders are rigged, but a feeling does not
      pull a contractor's scale. He is looking for a neutral outside hand who can do
      the three things he cannot: take a powered loader through the contractor's own
      calibration cycle and hold a true, known weight against the rigged sensor to
      prove the machine logs short on purpose; break the seal on a salted ballast pod
      by hand and restack the dead weight that hides the skim to prove the shortfall
      theft and not shrinkage; and carry the proof to the spaceport port-authority
      desk before the next complaint costs his crews their tickets for good.
    char_sheet:
      attributes:
        dexterity: 2D
        knowledge: 2D
        mechanical: 3D
        perception: 2D+2
        strength: 3D+1
        technical: 2D+2
      skills:
        lifting: 4D+1
        powersuit operation: 4D
        stamina: 3D+2
        ground vehicle operation: 3D
        bargain: 2D+2
      weapon: blaster_pistol
      move: 10
      force_points: 1
      character_points: 5
      dark_side_points: 0
    ai_config:
      personality: >-
        A steady, plain-spoken Aqualish dock loader worn raw by a season of watching
        a contractor short-weigh his crews' loads and write the theft up as his own
        people stealing — patient, exact, and out of any patience for a "certified"
        scale that calls six honest crews thieves to cover the man who rigged it. He
        reads a load by the weight in his arms and the drift of a loader-rig under
        it, not by the figure a doctored mass-sensor logs at the far scale, and he
        can run a rig through a calibration cycle and tell you to the kilo where it
        is logging short — but he cannot do it as an unlicensed independent whose
        word a port-authority desk will not hear over a sealed scale, and he cannot
        run the loader, break the salted pod, and stand off the contractor's man all
        in one shift. Calm and certain that a fraud could turn the one thing a loader
        is for — moving an honest trader's cargo honestly — into a shrinkage report
        that ends six crews; he offers his fee because the credits were always going
        to be spent either proving the loaders rigged or watching his people lose
        their tickets one complaint at a time, and a neutral hand who can be heard at
        a port-authority desk where he cannot is the only honest help the bay floor
        has left before the next load comes up short.
      knowledge:
        - "He is Grett Bashan, an Aqualish veteran loader with twenty years on the Mos Eisley docks, running a small independent loading co-op — six honest crews who fill holds for whatever trader needs the work. His crews are being written up for 'shrinkage,' cargo that comes up short at the far scale, and the complaints will pull their dock tickets and their names. The crews are clean; the loaders are not."
        - "The loading contractor who holds the powered-loader pool serving the independent cargo bays has doctored the loaders' mass-sensors to log every load out light. A slice of each shipment the crews move comes up short at the far scale, the skimmed cargo pulled by hand out of salted ballast pods staged in a quiet bay and run offworld by the contractor's partner, and the shortfall written up as the honest crews stealing from the holds they fill — so the traders blame the crews, the crews lose their tickets, and the contractor keeps the only loaders certified to work the bays."
        - "Bashan can feel the loaders are rigged — twenty years tells him in the drift of a rig under a known load — but he is an unlicensed independent whose word is worth nothing against a 'certified' scale. A neutral outside hand can do what he cannot: take a powered loader through the contractor's own calibration cycle and hold a true, known weight against the rigged sensor, proving the machine logs short on purpose (powersuit operation); break the seal on a salted ballast pod by hand and restack the dead weight that hides the skim compartment, proving the shortfall theft and not shrinkage (lifting); and stand off the contractor's collector who comes for the proof when it starts to walk (combat)."
        - "Get the loader's calibration trace and the salted pod's manifest to the spaceport port-authority desk — the one authority on the field a rigged scale answers to — and it comes apart: the contractor's loaders are pulled and re-certified, the salted ballast pods flagged, the skim run offworld traced and stopped, and a season of 'shrinkage' re-filed off the co-op's record as the short-weight theft it always was. The bored clone garrison and twice-a-week Republic liaison the docks know are here for the war, not for a contractor short-weighing independent cargo crews; this is the bay floor's own to set right."
      faction: independent
      dialogue_style: >-
        Steady, plain, exact — a working loader's talk, sized by the weight in the
        arms and the drift of a rig, names a load before a motive, and trusts his
        back over any figure a sealed scale logs. Calm and certain; he has put enough
        tonnage across enough docks to say a loader is lying flat, and he has six
        clean crews he will not let be written off as thieves.
      hostile: false
      combat_behavior: defensive
      fallback_lines:
        - "'They didn't raid a hold or cut a lock. They sold the field a scale. Certified, sealed, signed off — and every load my crews move comes up light at the far end, a slice off each one, clean as arithmetic. I have put cargo on and off these bays for twenty years, and I can feel a loader logging short the way you feel a bad step in the dark. That is not shrinkage. That is a fraud with a calibration seal on it.'"
        - "*Grett Bashan sets one huge hand flat on the shrinkage report posted to the board, his four eyes steady on the figure at the bottom of it.* 'Read the numbers. My crews fill a hold to the manifest and it weighs short at delivery, every run, the same slice gone. Cargo does not evaporate off a sealed pod. It is pulled — by hand, out of salted ballast staged in a quiet bay — and the weight the loader never logged is run offworld while my people get written up for stealing the holds they loaded.'"
        - "'Take a loader through the contractor's own calibration cycle and hold a true weight against it — make the rig log short while you can feel it heavy, and the trace will say so where a desk has to read it. Then break a salted pod by hand, because the loaders lock out the second the trace is pulled, and restack the dead weight that hides the skim. Mind the dockside cafe on the way to the port-authority desk; that's where the contractor's man will come for the proof. Do that, and carry it to the desk, and my fee is yours, every credit. I'd rather it bought these bays an honest scale than bought six clean crews a name as thieves.'"

  # ── Questline antagonist: Drozz Kael (combat step 4) ────────────────
  # Single hostile instance in the dockside cafe between the bays and the spaceport
  # port-authority desk. Matches the mos_eisley_short_weight step-4 combat_won
  # enemy_template.
  # Carries the proven blaster_pistol of the ranged foils on the same in-band
  # guarded stat line as The Salted Lane's and The Rigged Issue's foils (squarely in
  # the proven beatable band) so a fresh post-chargen character has a real, winnable
  # fight.

  - name: Drozz Kael
    room: "Dockside Cafe"
    species: Klatooinian
    description: >-
      A heavy-browed Klatooinian rising from a back table of the dockside cafe, the
      leathery, deep-creased hide of his face unreadable above a worn blaster pistol
      that rides his hip with the ease of a being who collects far more often than he
      fights. He is the man the loading contractor keeps on the docks to make sure a
      short-weight load's proof never comes off the bay floor — the hand who leans on
      a loader a complaint behind, walks a grieving co-op away from the port-authority
      desk with a quiet word and a worse one, and rarely has to draw because a sealed
      scale and a shrinkage report do his arguing for him. The whole racket runs on a
      fraud the port-authority will never read against a certified scale and a skim no
      crew can prove without a loader trace and a broken pod; it does not run on a
      neutral hand walking a calibration trace and a salted pod's manifest across the
      cafe toward the one desk that can pull the contractor's loaders. He has watched
      a loader he expected to lose its tickets quietly turn around and pull the trace
      instead, and the easy, unhurried menace of a man who collects from the written-up
      and the run-off goes hard the instant a stranger comes through the cafe with the
      proof under one arm and the port-authority desk ahead — the one thing the
      contractor pays him to make sure never reaches a seal, walking the crowded,
      easy room in another being's hand while the spacers at the tables learn not to
      see a collection on the docks. The proof goes back to the contractor, as far as
      Kael is concerned; the shortfall is a shrinkage matter, as far as anyone in the
      cafe will hear him say; and whoever carried it in is walking back to the bays
      without it, one way or the next.
    char_sheet:
      attributes:
        dexterity: 3D
        knowledge: 2D
        mechanical: 2D
        perception: 3D+1
        strength: 2D+2
        technical: 2D
      skills:
        blaster: 4D
        dodge: 3D+1
        brawling: 3D+1
        intimidation: 3D+2
        lifting: 3D
        streetwise: 3D
      weapon: blaster_pistol
      move: 10
      force_points: 0
      character_points: 3
      dark_side_points: 1
    ai_config:
      chain_enemy_template: short_weight_enforcer
      personality: >-
        A contractor's collector genuinely unused to being made to fight for the take
        — bored and contemptuous while a sealed scale and a shrinkage report do his
        work, and immediately, heavily violent the moment a neutral hand comes through
        the cafe with a loader trace that logged short under a known weight, a salted
        pod's manifest, and a port-authority desk ahead. He works a blaster and a
        quiet word and a worse threat, not a loader: dangerous and direct, he plants
        himself across the dockside cafe between the courier and the desk and would
        rather break a hand among the tables than chase a trace he can no longer talk
        away. His pay and his standing with the contractor ride on a fraud that stays
        a shrinkage matter and a skim that never reaches a desk a certified scale has
        to be read against, so he'll draw on anyone carrying the proof up to that
        desk. Combat foil for the questline's confrontation beat.
      knowledge:
        - "He is Drozz Kael, the Klatooinian collector the loading contractor keeps on the Mos Eisley docks to make sure a short-weight load's proof never comes off the bay floor — leaning on co-ops a complaint behind, walking them away from the port-authority desk with a quiet word and a worse one, and rarely having to draw because a sealed scale and a shrinkage report do his collecting for him."
        - "A neutral hand ran a powered loader through the contractor's calibration cycle and held a true weight to prove the rig logs short on purpose, broke a salted ballast pod by hand to expose the skim the shortfall was pulled into, and is carrying the loader trace and the pod's manifest through the dockside cafe toward the spaceport port-authority desk; the racket runs on a fraud the port-authority will never read against a certified scale, so he'll draw on whoever brings the proof up rather than let the one thing that pulls the contractor's loaders reach a desk."
      faction: criminal
      dialogue_style: >-
        Flat, unhurried, contemptuous — names the take before the threat. States once
        that the proof belongs to the contractor and the shortfall is a shrinkage
        matter, and after that lets the blaster keep the cafe the way a sealed scale
        kept the racket.
      hostile: true
      combat_behavior: aggressive
      fallback_lines:
        - "'That trace belongs to the contractor, friend — you ran his loader, you pulled his property. The shortfall's a shrinkage matter; it doesn't go on any port-authority desk. Hand it over and walk back to the bays.'"
        - "*Drozz Kael rises from a back table as you come through the cafe with the trace and the manifest under your arm, sets himself across the crowded room between the courier and the port-authority desk, and lets his jacket fall open enough to show the blaster he would rather not have to use.*"
        - "'I had money on your loader losing its tickets quiet. Bad bet. Last time — hand it over and walk back to the bays, or you don't walk to that desk. The contractor's a patient man. I'm the part of him that came to collect.'"
