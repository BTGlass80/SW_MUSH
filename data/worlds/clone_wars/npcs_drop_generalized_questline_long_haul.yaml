# Generalized Questline Drop — "The Long Haul" (T3.24 fourteenth slice, 2026-06-29)
#
# The FOURTEENTH accessible (non-t5, non-tutorial) `kind: questline` chain, and
# the FOURTH set on TATOOINE — after "The Ghost Shipment" (nar_freight_ghost_
# shipment, Nar Shaddaa), "The Crooked Wheel" (mos_eisley_crooked_wheel,
# Tatooine/Mos Eisley market), "The Lost Courier" (coruscant_lower_lost_courier,
# Coruscant LOWER city), "The Skimmed Line" (kuat_ring_skimmed_line, Kuat
# orbital ring), "The Dust-Sick" (jundland_dust_sick, Tatooine Jundland
# wilderness), "The False Provenance" (coruscant_petrax_false_provenance,
# Coruscant cultural district), "The Forged Notice" (nar_shaddaa_forged_notice,
# Nar Shaddaa upper docks), "The Warrens Toll" (nar_shaddaa_warrens_toll, Nar
# Shaddaa Warrens), "The Sealed Ledger" (coruscant_works_sealed_ledger,
# Coruscant mid-city), "The Sabotaged Run" (tatooine_speeder_sabotaged_run,
# Tatooine outskirts speeder circuit), "The Hollow Crew" (geonosis_offworld_
# hollow_crew, Geonosis offworlder surface), "The Driven Herd" (kamino_driven_
# herd, Kamino ocean platforms), and "The Condemned Hull" (kuat_condemned_hull,
# Kuat customs front). It reuses the SAME live questline engine
# (engine/tutorial_chains.py + chain_events.py: the `kind: questline` type +
# `active_questline` slot, the existing event types, the four reward funnels)
# with NO new engine code, no new slot, no new event type, no schema migration,
# no new reward faucet, and NO map-coordinate or exit-graph change — the
# sanctioned right-of-launch widening per quest_expansion_postlaunch_path_v1.md
# (T3.24): author MORE questlines on the proven pattern.
#
# Firsts for the accessible-questline arc:
#   1. A FOURTEENTH distinct skill spread — GROUND VEHICLE REPAIR + GROUND
#      VEHICLE OPERATION — neither of which any prior accessible questline uses
#      (vs search+streetwise / investigation+gambling / persuasion+sneak /
#      security+bargain / first_aid+survival / value+con / forgery+bureaucracy /
#      command+demolitions / pick-pocket+hide+computer-programming / sensors+
#      repulsorlift-operation / alien-species+droid-programming / beast-riding+
#      swimming / space-transport-repair+astrogation). `ground vehicle repair`
#      resolves to TECHNICAL and `ground vehicle operation` to MECHANICAL via the
#      canonical perform_skill_check funnel; neither is aliased (each
#      canonicalizes to itself). This is the FIRST accessible questline to reward
#      the GROUNDSIDE HAULER / WHEELMAN-MECHANIC build — the hand who can keep a
#      sabotaged freight rig running and then drive it through a killing stretch
#      of road. It is mechanically DISTINCT from the two prior vehicle arcs:
#      The Sabotaged Run rewards the sensor-pilot of a repulsorlift SWOOP
#      (sensors + repulsorlift operation, a fixed RACE), and The Condemned Hull
#      rewards the spacer engineer-navigator of a STARSHIP (space transport
#      repair + astrogation); neither touches a GROUND vehicle. The hauler is
#      not the racer and not the starship engineer.
#   2. The FOURTH questline set on TATOOINE, and the first on the FREIGHT-HAUL
#      face of the Mos Eisley margins: the power-station trade stop + the town
#      garage + the open desert haul road (the ridge track + the eastern gate):
#      power_station / dewback_stables_garage / outskirts_hermits_ridge /
#      outskirts_eastern_gate. It reuses NONE of The Crooked Wheel's
#      market-district rooms, NONE of The Dust-Sick's Jundland rooms, and NONE
#      of The Sabotaged Run's speeder-circuit rooms (spaceport_speeders /
#      transport_depot / outskirts_speeder_track / outskirts_wrecked_sandcrawler)
#      — every one of its four rooms is fresh to the chain corpus. The Republic
#      patrols the room descriptions already name stay distant background, the
#      way every prior accessible arc keeps the Republic/CIS conflict offstage:
#      the whole arc runs on the faction-neutral independent-hauler margins of
#      the frontier. It touches NO map coordinate or world exit graph — the
#      rooms already exist and are loaded (planets/tatooine.yaml); only NPCs + a
#      chains.yaml entry + an achievement are added.
#
# It is also a new STORY SHAPE: breaking a FREIGHT STRAND-AND-SALVAGE racket —
# not a smuggling-trace, a racket-bust-by-investigation, a kidnap-rescue, an
# industrial-skim, a frontier medical rescue, an art-fraud caper, a
# counter-forgery, a community-defense, a finesse heist, a fixed race, a
# droid-reflash racket, a wildlife-poaching racket, or a ship-condemnation. A
# bigger freight outfit (narrated only) corners the only paying water-and-parts
# runs to the outlying moisture farms by making sure the independents never make
# the delivery window: a planted fault — a fouled coolant line, a shimmed bearing
# — strands the rig out on the worst stretch of the haul road, where the
# outfit's own "recovery crew" just happens to be waiting to tow the load away
# under a salvage lien and buy the missed contract for a song. Numi Vesh, the
# Sullustan owner-driver whose one rig and one last run stand between her and
# losing the route, is a master of the rig and the road but her hired driver
# quit scared and she can't both wrench and run it alone past a crew that came
# for the load. She offers her fee to any freelance hand who can find and clear
# the planted sabotage before the rig rolls (ground vehicle repair), drive the
# loaded rig through the ridge stretch where every independent gets stranded
# (ground vehicle operation), stand off the recovery-crew enforcer who comes for
# the load at the gate, and bring the run in on the window.
#
# These NPCs back the `tatooine_long_haul` questline in
# data/worlds/clone_wars/tutorials/chains.yaml:
#   * Numi Vesh   — the Sullustan owner-driver who offers + closes the quest
#                   (step-1 npc = the questline's start-NPC, per
#                   get_questline_offer). Step-1 + step-5 NPC.
#   * Gornt Reska — the combat-step enforcer (ai_config.chain_enemy_template
#                   long_haul_enforcer; the step-4 combat_won foil), the
#                   Klatooinian recovery-crew muscle who comes for the load at
#                   the eastern gate when the strand fails.
# The bigger freight outfit, its dispatcher, the recovery crew, the salvage-lien
# clerk, the saboteur who fouled the rig, the outlying moisture farms waiting on
# the water, and the freighter-rig Sand Loper are NARRATED ONLY — story beats
# carried in the prose, NOT spawned NPC entities. Only the giver and the single
# combat foil are real placed NPCs.
#
# Original characters, era-clean ~20 BBY, WEG R&E D6 stats. No canon figures.
# The rival outfit is a civilian freight monopoly, never a war faction; the
# Republic/CIS conflict stays offstage. Provenance: Sullustan (the cavern-
# dwelling, machine-and-direction-savvy near-humans of Sullust — an era-clean,
# faction-neutral fixture of the galaxy and a natural fit for a master
# owner-driver) and Klatooinian (a heavy, long-lived Outer Rim / Hutt-space
# labor-and-muscle species, era-clean and not war-faction coded) are both
# era-clean. Stats matched to the shipped accessible-questline bands — the giver
# to the non-combat fixer band (Yelza Korrin / Dorae Vint / Sashi Renko / Dav
# Nuro / Soree Bann / Hessa Veil / Cassa Brel / Vessa Tial / Terva Dohl / Ria
# Tann / Nuva Sehl / Neyla Sur / Veelo Trinn), with the owner-driver's spread
# skewed to Mechanical/Technical to fit a master hauler-mechanic; the enforcer to
# the small-time-criminal antagonist band (Brakkis Vone / Gorvahn Brusk / Skarn
# Vex / Suro Vant / Vohrek Sarn / Brask Yade / Varn Tesk / Tarko Venn / Drevin
# Saar / Vossk Rhal / Korsa Drael / Bohrus Kang): a real fight, beatable by a
# fresh post-chargen character, carrying the proven blaster_pistol of the eleven
# ranged foils (NOT the offset melee weapon The Condemned Hull's foil carried —
# this foil stays squarely in the proven beatable band, no balance flag needed).
# WEG40120 PDF is local-only (gitignored) and absent in this tree; the bands are
# cited against the in-repo reference NPCs, not re-derived.

schema_version: 1

npcs:

  # ═══════════════════════════════════════════════════════════════════
  # The owner-driver — Numi Vesh (questline GIVER + closer)
  # Questline: tatooine_long_haul ("The Long Haul")
  # Placement: Power Station (power_station, zone tatooine_mos_eisley). Step-1
  #            + step-5 NPC.
  # NOTE: an independent freight hauler run ragged at the trade-and-recharge stop
  # where the merchants and moisture farmers gather — a master of her own rig and
  # her own road, down to one rig and one run, a rooted presence fighting to keep
  # her route, not one of the spaceport's transients.
  # ═══════════════════════════════════════════════════════════════════

  - name: Numi Vesh
    room: "Power Station"
    species: Sullustan
    description: >-
      A short, broad-shouldered Sullustan in a heat-bleached driver's coat, the
      dewflaps at her jowls grease-dark and her wide black eyes ringed with the
      red of too many nights under a rig, a coil of coolant line slung over one
      arm and a delivery flimsi gone soft at the folds in her hand. She is no
      hand on a corporate freight roster — she owns and drives the Sand Loper
      herself, a hauler-rig she has wrenched and run on the water-and-parts route
      out to the far moisture farms for eleven years, an owner-driver who knows
      her rig and her road the way another being knows their own hands. A bigger
      freight outfit has spent the season cornering that route the one way the
      law can't touch: not by underbidding her but by making sure she never makes
      the window — a fouled line here, a shimmed bearing there, every independent
      breaking down on the same killing stretch of ridge road, where the outfit's
      own recovery crew is always waiting to tow the load off under a salvage
      lien and buy the missed contract cheap. Two haulers folded this season; her
      driver quit scared a week ago; she has one rig, one run, and one window
      left, and she cannot both wrench the sabotage and run the road alone past a
      crew that came for the load. She is looking for a freelance hand who can do
      the three things she cannot all at once: find and clear the fault before
      the rig rolls, drive the loaded rig through the ridge the outfit owns, and
      stand on the gate when the recovery crew comes.
    char_sheet:
      attributes:
        dexterity: 2D
        knowledge: 2D+1
        mechanical: 3D+1
        perception: 2D+2
        strength: 2D
        technical: 3D
      skills:
        ground vehicle operation: 4D+2
        ground vehicle repair: 4D+1
        repulsorlift operation: 3D+1
        sensors: 3D
        bargain: 2D+2
      weapon: blaster_pistol
      move: 10
      force_points: 1
      character_points: 5
      dark_side_points: 0
    ai_config:
      personality: >-
        A blunt, capable Sullustan owner-driver worn down to the wire by a season
        of being squeezed off a route she has run honest for eleven years —
        practical, unsentimental, and out of patience with a racket that strands
        her rig and calls it salvage. She can strip and reseat a freight rig's
        drivetrain by feel and read a haul road's worst stretch in the dark, and
        she knows to the bearing that her breakdowns were planted — but she can't
        wrench the fault and drive the run and fight the crew all in one trip,
        and that is exactly the trip the outfit has left her. Tired, dry-humored,
        and quietly furious at an outfit that wins by making honest rigs fail;
        she offers her fee because the credits were always going to be spent
        either keeping the route or losing it, and a stranger willing to spend
        them on the outfit losing instead is the only honest help the
        independents on this road have left.
      knowledge:
        - "She is Numi Vesh, a Sullustan owner-driver out of Mos Eisley; she owns and drives the freight rig Sand Loper and has run the water-and-parts route to the outlying moisture farms for eleven years, an independent hauler down to one rig and one run."
        - "A bigger freight outfit is cornering the route without ever underbidding: they pay a hand to plant a fault in an independent's rig — a fouled coolant line, a shimmed bearing — so it strands on the worst stretch of the ridge road, where the outfit's recovery crew tows the load off under a salvage lien and buys the missed contract cheap. Two haulers folded this season; her driver quit a week ago."
        - "She has one run left to make the window or lose the route. She can't wrench the sabotage, drive the ridge, and fight the recovery crew alone — but a freelance hand can: find and clear the planted fault at the garage before the rig rolls (ground vehicle repair); drive the loaded rig through the ridge stretch the outfit owns without breaking down (ground vehicle operation); and stand off the recovery-crew enforcer who comes for the load at the eastern gate."
        - "Clear the run on the window and the route stays open to the independents, the planted breakdowns become a string of strands nobody can call salvage anymore, and the outfit's recovery crew loses the one thing the racket runs on — an honest rig that fails where they're waiting."
      faction: independent
      dialogue_style: >-
        Blunt, dry, mechanic's plain talk — names a part before a feeling,
        measures a road in breakdowns and a debt in windows missed; talks the way
        she drives, no wasted motion and every word load-bearing.
      hostile: false
      combat_behavior: defensive
      fallback_lines:
        - "'They don't underbid me. They make sure I break down. A fouled line, a shimmed bearing — and the rig dies on the ridge where their recovery crew's already parked, and they tow my load off as salvage and buy my missed run cheap. Two of us folded this season. My driver quit a week ago. I've got one rig and one window left.'"
        - "*Numi Vesh runs a thumb down the soft-folded delivery flimsi, reads the window time stamped on it, and her dewflaps tighten the way they only do over a number she's already missed once.*"
        - "'Clear the fault at the garage before she rolls — they'll have planted one. Drive her through the ridge stretch without dying where they want you to. And mind the gate on the way in; that's where their crew comes for the load. Do that and my fee's yours, every credit. I'd rather it bought their racket dying than bought me one more season strung along.'"

  # ── Questline antagonist: Gornt Reska (combat step 4) ───────────────
  # Single hostile instance at the recovery crew's chokepoint, the eastern gate.
  # Matches the tatooine_long_haul step-4 combat_won enemy_template.
  # Carries the proven blaster_pistol of the eleven ranged foils (squarely in the
  # proven beatable band — NOT the offset melee weapon The Condemned Hull's foil
  # carried) so a fresh post-chargen character has a real, winnable fight.

  - name: Gornt Reska
    room: "City Outskirts - Eastern Gate"
    species: Klatooinian
    description: >-
      A heavy, thick-necked Klatooinian in a recovery crew's dust-rig, the
      leathery muscle of his species gone to gristle and scar over years of
      hauling other beings' stranded loads off the road, a worn blaster pistol
      riding his hip and a tow-hook coiled at his belt. He is the muscle who
      keeps the freight outfit's recovery work quiet — the hand who meets the
      independents where they break down, reads them the salvage lien, and tows
      the load off before anyone with a stake in it arrives, and who has rarely
      had to draw because a stranded rig and a missed window do the taking for
      him. The whole racket runs on an honest rig failing where the crew is
      waiting; it does not run on a freelance hand wrenching the planted fault
      clear and driving the load through the ridge the outfit owns. The bored
      contempt of a being whose work tows itself goes flat the instant the Sand
      Loper rolls up to the gate on the window instead of dying on the ridge — a
      load he was paid to recover, coming in clean, with a stranger at the wheel.
      The load is salvage, as far as the lien goes; the rig made the window, as
      far as everyone watching the gate can see; and whoever drove it in is going
      back out on a tow-hook with the rest of the strand.
    char_sheet:
      attributes:
        dexterity: 3D
        knowledge: 2D
        mechanical: 2D+2
        perception: 2D+1
        strength: 3D+1
        technical: 2D+1
      skills:
        blaster: 4D
        dodge: 3D+1
        brawling: 4D
        ground vehicle operation: 3D+2
        intimidation: 3D+1
        streetwise: 2D+2
      weapon: blaster_pistol
      move: 10
      force_points: 0
      character_points: 3
      dark_side_points: 1
    ai_config:
      chain_enemy_template: long_haul_enforcer
      personality: >-
        A recovery-crew enforcer genuinely unused to being made to fight for the
        racket — bored and contemptuous while a planted fault and a missed window
        do his taking, immediately and heavily violent the moment an independent
        rolls up on the window with a freelance hand at the wheel and a load he
        was paid to tow off as salvage. He works a tow-hook and a blaster, not a
        case: dangerous and direct, he plants himself across the gate and would
        rather break a driver at the chokepoint than chase a rig down the road.
        His pay and his standing with the outfit ride on a quiet road and a load
        that strands where it's told to, so he'll draw on anyone who drove the
        run in clean. Combat foil for the questline's confrontation beat.
      knowledge:
        - "He is Gornt Reska, the Klatooinian enforcer who keeps the freight outfit's recovery work quiet — meeting the independents where their rigs break down on the ridge, reading them the salvage lien, and towing the load off before anyone with a stake in it arrives."
        - "A freelance hand wrenched clear a fault he was counting on to strand the Sand Loper and drove the load in on the window; the racket runs on an honest rig failing where the crew waits, so he'll draw on whoever brought the run in clean rather than lose the route and the salvage the outfit has already half-sold."
      faction: criminal
      dialogue_style: >-
        Flat, unhurried, contemptuous. States once that the load's under a salvage
        lien and the driver should step off the rig and walk, and after that lets
        the blaster keep the gate the way the planted breakdowns kept the road.
      hostile: true
      combat_behavior: aggressive
      fallback_lines:
        - "'That load's under a salvage lien, hauler, signed before you ever turned a wheel. The rig strands, we recover — that's the deal on this road. Step off her and walk.'"
        - "*Gornt Reska uncoils the tow-hook from his belt, sets it down where the driver can see it, and plants himself across the gate between the rig and the window.*"
        - "'Last time — step off and walk, or you go out on the hook with the rest of the strand. The breakdowns do my towing. The blaster's just for the ones who drive in clean.'"
