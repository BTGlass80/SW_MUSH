  # T3.24 generalized-questline arc (2026-06-22): the first ACCESSIBLE
  # (non-t5, non-tutorial) questline. Earned by solving "The Ghost
  # Shipment" for the freight broker Yelza Korrin on Nar Shaddaa. Lower
  # cp_reward than the t5 trainer chains (3 vs 5): this is open freelance
  # side-content, not a rep-gated end-game trial.
  - key: ghost_shipment_solved
    name: "The Ghost Shipment"
    description: "Tracked down the skimmer bleeding Yelza Korrin's freight runs dry on Nar Shaddaa. A freelance reputation starts with one finished job."
    category: profession
    icon: "📦"
    cp_reward: 3
    trigger: {event: "chain_graduation", count: 1, chain_id: "nar_freight_ghost_shipment"}

  # T3.24 generalized-questline arc (2026-06-25): the SECOND accessible
  # (non-t5, non-tutorial) questline. Earned by breaking "the Wheel" — a
  # rigged-sabacc loan racket — for the market vendor Dorae Vint on Mos
  # Eisley. Same lower-tier band as the Ghost Shipment (cp_reward 3 vs the
  # t5 trainer chains' 5): open freelance side-content, not a rep-gated trial.
  - key: crooked_wheel_busted
    name: "The Crooked Wheel"
    description: "Exposed the rigged sabacc table bleeding Mos Eisley's market vendors dry and ran the Wheel's collector to ground. Some games only end when somebody flips the table."
    category: profession
    icon: "🎲"
    cp_reward: 3
    trigger: {event: "chain_graduation", count: 1, chain_id: "mos_eisley_crooked_wheel"}

  # T3.24 generalized-questline arc (2026-06-25): the THIRD accessible
  # (non-t5, non-tutorial) questline. Earned by tracing a grabbed courier
  # through Coruscant's Southern Underground and freeing the kid from a
  # Trandoshan enforcer for the fixer Sashi Renko. Same lower-tier band as
  # the Ghost Shipment / Crooked Wheel (cp_reward 3 vs the t5 trainer
  # chains' 5): open freelance side-content, not a rep-gated trial.
  - key: lost_courier_found
    name: "The Lost Courier"
    description: "Talked a frightened warren open, slipped a watched bolt-hole, and brought a fixer's grabbed courier home alive from the Coruscant underworld. Some jobs are only simple until somebody disappears."
    category: profession
    icon: "🛰️"
    cp_reward: 3
    trigger: {event: "chain_graduation", count: 1, chain_id: "coruscant_lower_lost_courier"}

  # T3.24 generalized-questline arc (2026-06-26): the FOURTH accessible
  # (non-t5, non-tutorial) questline. Earned by clearing an honest Kuat Drive
  # Yards floor crew of a theft they didn't commit — slicing the scrubbed
  # shift log, buying the buyer's name, and recovering a skimmed navigation
  # core from the fixer Suro Vant. Same lower-tier band as the Ghost Shipment /
  # Crooked Wheel / Lost Courier (cp_reward 3 vs the t5 trainer chains' 5):
  # open freelance side-content, not a rep-gated trial.
  - key: skimmed_line_cleared
    name: "The Skimmed Line"
    description: "Pulled the truth out of the Kuat yards' systems and kept twelve honest fitters on the ring — sliced a scrubbed shift log, bought a fence's silence, and took back a skimmed core before it shipped off-ring. The cheapest answer is rarely the true one."
    category: profession
    icon: "⚙️"
    cp_reward: 3
    trigger: {event: "chain_graduation", count: 1, chain_id: "kuat_ring_skimmed_line"}

  # T3.24 generalized-questline arc (2026-06-26): the FIFTH accessible
  # (non-t5, non-tutorial) questline, and the FIRST set in the wilderness
  # (Tatooine deep desert). Earned by reaching a homesteader's dust-sick
  # son in the Jundland Wastes, stabilizing him, charting a survivable
  # line home, and getting him past a scavenger band — a save-the-stricken
  # frontier rescue on a fifth distinct skill spread (first_aid + survival).
  # Same lower-tier band as the Ghost Shipment / Crooked Wheel / Lost
  # Courier / Skimmed Line (cp_reward 3 vs the t5 trainer chains' 5): open
  # freelance side-content, not a rep-gated trial.
  - key: dust_sick_recovered
    name: "The Dust-Sick"
    description: "Carried a homesteader's fevered son out of the Jundland Wastes alive — stabilized him where he lay, read a rising desert for the one line home a sick man could walk, and ran a scavenger band off the take. Out here, the desert keeps what you leave to it."
    category: profession
    icon: "🩹"
    cp_reward: 3
    trigger: {event: "chain_graduation", count: 1, chain_id: "jundland_dust_sick"}

  # T3.24 generalized-questline arc (2026-06-26): the SIXTH accessible
  # (non-t5, non-tutorial) questline, the FIRST set in Coruscant's cultural /
  # mid-upper district (Petrax Quarter / Galactic Museum / Calocour Heights /
  # Westport; vs the Lost Courier's lower city). Earned by clearing a defamed
  # Bith antiquities dealer — appraising a forgery to prove a swap, conning a
  # fence into the open, and running down the genuine pre-Republic votive before
  # it shipped off-world — on a sixth distinct skill spread (value + con). Same
  # lower-tier band as the Ghost Shipment / Crooked Wheel / Lost Courier /
  # Skimmed Line / Dust-Sick (cp_reward 3 vs the t5 trainer chains' 5): open
  # freelance side-content, not a rep-gated trial.
  - key: false_provenance_cleared
    name: "The False Provenance"
    description: "Proved a flawless forgery for what it was, drew a Calocour fence into the open, and ran down a genuine pre-Republic votive an hour before it shipped off-world — clearing an honest Coruscant dealer's name against paid-for ruin. A reputation is only worth what it can survive."
    category: profession
    icon: "🏺"
    cp_reward: 3
    trigger: {event: "chain_graduation", count: 1, chain_id: "coruscant_petrax_false_provenance"}

  # T3.24 generalized-questline arc (2026-06-26): the SEVENTH accessible
  # (non-t5, non-tutorial) questline, a RETURN to Nar Shaddaa on a different
  # face of the moon (the upper docks + freight registry vs the Ghost
  # Shipment's cantina + Undercity; reuses none of its rooms). Earned by
  # breaking a port factor's forged-paperwork ship-seizure racket — proving a
  # forged derelict-notice a fake, filing an emergency hold the factor can't
  # quash, and turning back the seizure crew — on a seventh distinct skill
  # spread (forgery + bureaucracy). Same lower-tier band as the Ghost Shipment /
  # Crooked Wheel / Lost Courier / Skimmed Line / Dust-Sick / False Provenance
  # (cp_reward 3 vs the t5 trainer chains' 5): open freelance side-content, not
  # a rep-gated trial.
  - key: forged_notice_cleared
    name: "The Forged Notice"
    description: "Read a forged derelict-notice off a freighter's hull for the fake it was, beat a crooked port factor at his own registry desk with the hold that saved her, and turned a seizure crew out of the alley before it reached the berth — pulling an honest captain's ship out of a theft dressed as procedure. A forged seal is only as good as the eye that never reads it."
    category: profession
    icon: "📜"
    cp_reward: 3
    trigger: {event: "chain_graduation", count: 1, chain_id: "nar_shaddaa_forged_notice"}

  # T3.24 generalized-questline arc (2026-06-26): the EIGHTH accessible
  # (non-t5, non-tutorial) questline, set in the deepest face of Nar Shaddaa —
  # the Warrens, the Smuggler's Moon's lowest inhabitable levels (vs the Ghost
  # Shipment's promenade/Undercity and the Forged Notice's upper docks; reuses
  # none of their rooms). Earned by breaking a Hutt-space "reactor-safety toll"
  # racket before its planted charge breaches the Warrens reactor — rallying a
  # frightened level to act together, defusing the charge on the cooling fins,
  # and stopping the enforcer who comes to set another by hand — on an eighth
  # distinct skill spread (command + demolitions). Same lower-tier band as the
  # Ghost Shipment / Crooked Wheel / Lost Courier / Skimmed Line / Dust-Sick /
  # False Provenance / Forged Notice (cp_reward 3 vs the t5 trainer chains' 5):
  # open freelance side-content, not a rep-gated trial.
  - key: warrens_toll_broken
    name: "The Warrens Toll"
    description: "Came down to the lowest level of the Smuggler's Moon where no law will, rallied a frightened block to move as one, lifted a live charge off a centuries-old reactor before it breached, and dropped the collector who came to set the next one by hand — breaking a safety racket on the people it leaned on hardest. Down here, a toll is only paid by those who can't make you stop."
    category: profession
    icon: "⚙️"
    cp_reward: 3
    trigger: {event: "chain_graduation", count: 1, chain_id: "nar_shaddaa_warrens_toll"}

  - key: sealed_ledger_recovered
    name: "The Sealed Ledger"
    description: "Beat a Coruscant mid-city forgery-broker on his own ground without raising a blaster — lifted the vault fob from his collector in the transit crush, slipped past his watchers and the dead sublevel's sensor sweep, and cracked the slicer-gauntlet to pull the original ledger before his purge could re-forge it. Dozens of families cleared of debts they never owed, on finesse alone. Quiet hands are rarer than gun hands, and worth more."
    category: profession
    icon: "🗝️"
    cp_reward: 3
    trigger: {event: "chain_graduation", count: 1, chain_id: "coruscant_works_sealed_ledger"}

  - key: sabotaged_run_won
    name: "The Sabotaged Run"
    description: "Broke a swoop gang's fix on the Mos Eisley outskirts speeder circuit — read their coil-spike off the depot gate scanners and traced their rig, out-drove their picket on open hardpan to pull it off the chop-shop, and walked their enforcer down in his own gutted-sandcrawler shop to bring back a stripped rig and a stranded medical run. A pilot's hands and a scanner's eye beat a fixed race, and the honest riders queued at the start gates again."
    category: profession
    icon: "🏁"
    cp_reward: 3
    trigger: {event: "chain_graduation", count: 1, chain_id: "tatooine_speeder_sabotaged_run"}

  - key: hollow_crew_freed
    name: "The Hollow Crew"
    description: "Broke a scrap-gang's droid-reflash recall racket in the Stalgasin offworld quarter on Geonosis — read the Geonosian drone-caste broker right in the caste's own terms to re-open a salvager's overrun channel, cracked a walked labor droid to pull the gang's buried recall-string and trace it home, and stood off the enforcer whose signature was on every core to give the offworld quarter back an honest bench. A scholar's read of an alien caste and a slicer's hands in a stolen core freed the walked crews and cleared a framed trader's name."
    category: profession
    icon: "🤖"
    cp_reward: 3
    trigger: {event: "chain_graduation", count: 1, chain_id: "geonosis_offworld_hollow_crew"}

  - key: driven_herd_freed
    name: "The Driven Herd"
